// ─── Budget calc helpers — shared between BudgetView + DecBalView ────────────
// Given budgetCfg + sales[], compute per-dept monthly budget and per-day budget.
// Mirrors the BudgetView math so the Declining Balance shows the SAME numbers.
function computeBudgetData(budgetCfg, sales, monthDays) {
  const DEFAULTS = window.DEFAULT_BUDGET_CONFIG || {};
  const cfg = {
    officeFlat: budgetCfg?.officeFlat ?? DEFAULTS.officeFlat ?? 0,
    pcts: { ...(DEFAULTS.pcts||{}), ...(budgetCfg?.pcts||{}) },
    holidays: budgetCfg?.holidays || [],
  };
  const days = monthDays || window.MARCH_DAYS || [];
  const daysInMonth = days.length || 30;
  // Per-day sales by area
  const dayAreaSales = (s, area) => {
    const n = k => parseFloat(s?.[k])||0;
    switch(area) {
      case 'rc':        return n('rc_food')+n('rc_nabev')+n('rc_alcohol');
      case 'alcohol':   return n('prem_alcohol')+n('rc_alcohol');
      case 'prem_food': return n('prem_food');
      case 'rc_food':   return n('rc_food');
      case 'food':      return n('prem_food')+n('rc_food');
      case 'premium':
      default:          return n('prem_food')+n('prem_nabev')+n('prem_alcohol');
    }
  };
  const holSet = new Set(cfg.holidays);
  // Daily breakdown: each dept's budget = daySales(area) × pct% × holMult, plus admin office flat / N
  const dailyBudgets = days.map((d, i) => {
    const s = sales?.[i] || {};
    const isHol = holSet.has(d.date);
    const holMult = isHol ? 1.5 : 1;
    const byDept = {};
    let dayBudget = 0;
    DEPTS.forEach(dept => {
      const dCfg = cfg.pcts[dept.id] || { pct:0, area:'premium' };
      const daySales = dayAreaSales(s, dCfg.area);
      const fromPct = daySales * (dCfg.pct/100) * holMult;
      const flatDay = dept.id==='admin' ? (cfg.officeFlat||0)/daysInMonth : 0;
      byDept[dept.id] = fromPct + flatDay;
      dayBudget += byDept[dept.id];
    });
    return { date:d.date, dow:d.dow, isHol, byDept, total: dayBudget };
  });
  // Monthly totals per dept = sum of daily
  const deptBudgets = {};
  DEPTS.forEach(dept => {
    const total = dailyBudgets.reduce((s, r) => s + (r.byDept[dept.id]||0), 0);
    deptBudgets[dept.id] = total;
  });
  const monthlyTotal = Object.values(deptBudgets).reduce((s,v)=>s+v, 0);
  return { dailyBudgets, deptBudgets, monthlyTotal };
}

// ─── Declining Balance View ───────────────────────────────────────────────────
function DecBalView({ laborData, actuals, budgetCfg, sales, employees, weekShifts, monthData, onClearActuals }) {
  const { MARCH_DAYS } = window;
  const [selDept, setSelDept] = useState('all');

  // Aggregate helper: sum across all depts when selDept === 'all'
  const isAll = selDept === 'all';
  const dept = isAll ? {color:'#E8890C', label:'All Locations'} : getDept(selDept);

  // Compute budgets from budgetCfg + sales — same logic as the Budget tab.
  const budgetData = useMemo(() => computeBudgetData(budgetCfg, sales, MARCH_DAYS), [budgetCfg, sales, MARCH_DAYS]);

  // ── Build per-day, per-dept SCHEDULED forecast from actual shifts. ──────
  // Returns scheduledByDay[monthDayIdx][deptId] = {hrs, cost}.
  // monthDays index aligns with the day rows we render below.
  const scheduledByDay = useMemo(() => {
    const days = (MARCH_DAYS || []).length;
    const out = Array.from({length: days}, ()=>({}));
    if (!employees || !weekShifts || !monthData) return out;
    monthData.weeks.forEach(wk => {
      const wkData = weekShifts[wk.id] || {};
      // wk.dayIdx[i] = month-day number (or null) for week-day i (0=Mon..6=Sun)
      wk.dayIdx.forEach((monthDay, dayI) => {
        if (monthDay == null) return;
        // Find row in MARCH_DAYS matching this month-day. monthDays date format: "M/D"
        const rowIdx = MARCH_DAYS.findIndex(d => parseInt(String(d.date).split('/')[1]) === monthDay);
        if (rowIdx < 0) return;
        employees.forEach(e => {
          const shifts = wkData[e.id];
          if (!shifts) return;
          const sh = shifts[dayI];
          if (!sh) return;
          const status = sh[0]; const hrs = sh[1]||0;
          if (!hrs || status === 'OFF') return;
          // AVAIL/PASS/CANCEL = open / unfilled — skip from forecast
          if (status==='AVAIL' || status==='PASS' || status==='CANCEL') return;
          const dId = sh[5] || e.dept;
          const cost = getShiftCost(e, sh, MARCH_DAYS[rowIdx]?.date);
          if (!out[rowIdx][dId]) out[rowIdx][dId] = { hrs:0, cost:0 };
          out[rowIdx][dId].hrs  += hrs;
          out[rowIdx][dId].cost += cost;
        });
      });
    });
    return out;
  }, [employees, weekShifts, monthData, MARCH_DAYS]);

  // Monthly forecast: prefer SUM of scheduled-day costs (live).
  // Fall back to LABOR_DATA static forecast when nothing's scheduled yet.
  const liveDeptForecast = useMemo(() => {
    const m = {};
    scheduledByDay.forEach(byDept => {
      Object.entries(byDept).forEach(([dId, v]) => { m[dId] = (m[dId]||0) + (v.cost||0); });
    });
    return m;
  }, [scheduledByDay]);

  const budget = isAll
    ? budgetData.monthlyTotal
    : (budgetData.deptBudgets[selDept] || 0);
  const forecast = isAll
    ? (DEPTS.reduce((s,d)=>s+(liveDeptForecast[d.id] || laborData.find(l=>l.dept===d.id)?.forecast || 0), 0))
    : (liveDeptForecast[selDept] || laborData.find(l=>l.dept===selDept)?.forecast || 0);
  const mtdActual = isAll
    ? Object.values(actuals||{}).reduce((s,d)=>{
        if (!d || typeof d !== 'object') return s;
        return s + (d?.total||0);
      },0)
    : (actuals?.[selDept]?.total || 0);
  const remaining = budget - mtdActual;
  const pctUsed = budget > 0 ? Math.min(100, (mtdActual / budget) * 100) : 0;

  // Build day rows with running balance — uses budgetData per-day
  const rows = useMemo(() => {
    const AM = window.ACTIVE_MONTH || {year:2026, month:3};
    const monthStart = new Date(AM.year, AM.month-1, 1);
    const MONTH_START_SERIAL = window.dateToSerial(monthStart);
    let runBalance = budget;
    return MARCH_DAYS.map((day, i) => {
      // Per-day BUDGET = from computeBudgetData (sum across depts for All, single dept otherwise)
      const dayB = budgetData.dailyBudgets[i] || { byDept:{}, total:0 };
      const dayBudget = isAll ? dayB.total : (dayB.byDept[selDept] || 0);
      // Per-day FORECAST: sum live scheduled cost across all depts (or just the selected dept)
      const dayBy = scheduledByDay[i] || {};
      let dayFcst = 0, dayFcstHrs = 0;
      if (isAll) {
        Object.values(dayBy).forEach(v => { dayFcst += v.cost||0; dayFcstHrs += v.hrs||0; });
      } else {
        const v = dayBy[selDept];
        if (v) { dayFcst = v.cost||0; dayFcstHrs = v.hrs||0; }
      }
      // Actual: from import — look up by serial/dayIdx across ALL weeks
      const monthDay = parseInt(day.date.split('/')[1]);
      const serial = MONTH_START_SERIAL + monthDay - 1;
      let dayAct = 0, dayActHrs = 0;
      const getActForDept = (dId) => {
        const src = actuals?.[dId];
        if (!src) return {amt:0, hrs:0};
        if (src[serial]) return {amt: src[serial].amount||0, hrs: src[serial].hours||0};
        const weekStart = new Date(AM.year, AM.month-1, 23);
        const dayDate = new Date(AM.year, AM.month-1, monthDay);
        const di = Math.round((dayDate - weekStart) / 86400000);
        if (di >= 0 && di <= 6 && src[di]) return {amt: src[di].amount||0, hrs: src[di].hours||0};
        return {amt:0, hrs:0};
      };
      if (isAll) {
        DEPTS.forEach(d => {
          const {amt,hrs} = getActForDept(d.id);
          dayAct += amt; dayActHrs += hrs;
        });
      } else {
        const {amt,hrs} = getActForDept(selDept);
        dayAct = amt; dayActHrs = hrs;
      }

      if (dayAct > 0) runBalance -= dayAct;
      return { ...day, i, dayBudget, dayFcst, dayFcstHrs, dayAct, dayActHrs, runBalance, isHol: dayB.isHol };
    });
  }, [selDept, actuals, budget, isAll, budgetData, scheduledByDay]);

  const totalFcst = rows.reduce((s, r) => s + r.dayFcst, 0);
  const totalDailyBud = rows.reduce((s, r) => s + (r.dayBudget||0), 0);

  return (
    <div className="db-view">
      <div className="db-header">
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:12 }}>
          <div className="db-title">Declining Balance — {window.ACTIVE_MONTH_LABEL||'March 2026'}</div>
          <select className="db-dept-select" value={selDept} onChange={e => setSelDept(e.target.value)}>
            <option value="all">All Locations</option>
            {DEPTS.map(d => <option key={d.id} value={d.id}>{d.label}</option>)}
          </select>
          <button onClick={()=>{
            const summary = DEPTS.map(d=>{
              const src = actuals?.[d.id]||{};
              let amt=0,hrs=0;
              Object.entries(src).forEach(([k,v])=>{
                if(/^\d{5}$/.test(k) && v && typeof v==='object'){ amt+=v.amount||0; hrs+=v.hours||0; }
              });
              return `${d.label}: $${amt.toFixed(0)} / ${hrs.toFixed(1)}h`;
            }).join('\n');
            alert('Actuals state by department:\n\n'+summary+'\n\nIf data is missing or in wrong dept, click "Clear Actuals" below and re-import your One & Done file.');
          }} style={{marginLeft:8,padding:'6px 12px',background:'#2A2D3A',border:'1px solid #3A3D50',borderRadius:6,color:'#8B8FA8',fontSize:11,fontWeight:700,cursor:'pointer',letterSpacing:'.05em',textTransform:'uppercase'}}>Diagnose</button>
          <button onClick={()=>{
            if(confirm('Clear all imported actuals? You will need to re-import your One & Done file.')) onClearActuals?.();
          }} style={{padding:'6px 12px',background:'#DC262622',border:'1px solid #DC262666',borderRadius:6,color:'#FCA5A5',fontSize:11,fontWeight:700,cursor:'pointer',letterSpacing:'.05em',textTransform:'uppercase'}}>Clear Actuals</button>
        </div>
        <div className="db-summary">
          <div className="db-big">
            <span className="db-big-label">Monthly Budget</span>
            <span className="db-big-val" style={{ color: budget>0 ? '#E8EAF0' : '#4A4D60' }}>{budget>0 ? fmt$(budget) : '—'}</span>
          </div>
          <div className="db-big">
            <span className="db-big-label">Monthly Forecast</span>
            <span className="db-big-val" style={{ color: dept.color }}>{fmt$(forecast)}</span>
          </div>
          <div className="db-big">
            <span className="db-big-label">MTD Actual</span>
            <span className="db-big-val" style={{ color: mtdActual > 0 ? '#E8EAF0' : '#4A4D60' }}>{mtdActual > 0 ? fmt$(mtdActual) : 'Not imported'}</span>
          </div>
          <div className="db-big">
            <span className="db-big-label">Remaining Balance</span>
            <span className={`db-big-val ${remaining >= 0 ? 'pos' : 'neg'}`}>{budget>0 ? ((remaining >= 0 ? '+' : '') + fmt$(Math.abs(remaining))) : '—'}</span>
            {budget>0 && <><div className="db-progress-bar" style={{ marginTop: 8 }}>
              <div className="db-progress-fill" style={{ width: `${pctUsed}%`, background: pctUsed > 90 ? '#DC2626' : pctUsed > 70 ? '#E8890C' : dept.color }} />
            </div>
            <div style={{ fontSize:9, color:'#6B6F85', marginTop:3 }}>{pctUsed.toFixed(1)}% used</div></>}
          </div>
          <div className="db-big" style={{ marginLeft:8 }}>
            <span className="db-big-label">Total Forecasted</span>
            <span className="db-big-val" style={{ color:'#8B8FA8', fontSize:16 }}>{fmt$(totalFcst)}</span>
          </div>
        </div>
      </div>

      <div className="db-body">
        <div style={{ overflowX:'auto' }}>
          <table className="db-table">
            <thead>
              <tr>
                <th>Date</th><th>Day</th><th>Event</th>
                <th className="num">Fcst Hrs</th>
                <th className="num">Forecast $</th>
                <th className="num">Daily Budget $</th>
                <th className="num">Actual $</th>
                <th className="num" title="Actual minus Forecast">Var to Forecast</th>
                <th className="num" title="Actual minus Daily Budget">Var to Budget</th>
                <th className="num">Running Balance</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => {
                const varFcst = r.dayAct > 0 ? r.dayAct - r.dayFcst : null;
                const varBud = r.dayAct > 0 ? r.dayAct - r.dayBudget : null;
                const rowClass = r.dayAct > 0 && (varBud||0) <= 0 ? 'db-row has-actual-good' : r.dayAct > 0 ? 'db-row has-actual-bad' : 'db-row';
                const balColor = r.runBalance < 0 ? '#F87171' : budget>0 && r.runBalance < budget * 0.2 ? '#E8890C' : '#4ADE80';
                const balPct = budget > 0 ? Math.max(0, Math.min(100, (r.runBalance / budget) * 100)) : 100;
                return (
                  <tr key={i} className={rowClass}>
                    <td className="db-td date">{r.date}</td>
                    <td className="db-td dow">{r.dow}</td>
                    <td className="db-td event">{r.event || '—'}</td>
                    <td className="db-td num" style={{color:'#6B6F85'}}>{r.dayFcstHrs > 0 ? fmtHrs(r.dayFcstHrs) : '—'}</td>
                    <td className="db-td num" style={{color:'#8B8FA8'}}>{r.dayFcst > 0 ? fmt$(r.dayFcst) : '—'}</td>
                    <td className="db-td num" style={{color:'#A78BFA'}}>{r.dayBudget > 0 ? fmt$(r.dayBudget) : '—'}</td>
                    <td className="db-td num" style={{color: r.dayAct > 0 ? '#E8EAF0' : '#3A3D50'}}>{r.dayAct > 0 ? fmt$(r.dayAct) : '—'}</td>
                    <td className={`db-td num ${varFcst === null ? 'db-var-zero' : varFcst > 0 ? 'db-var-neg' : 'db-var-pos'}`}>
                      {varFcst !== null ? (varFcst > 0 ? '+' : '') + fmt$(varFcst) : '—'}
                    </td>
                    <td className={`db-td num ${varBud === null ? 'db-var-zero' : varBud > 0 ? 'db-var-neg' : 'db-var-pos'}`}>
                      {varBud !== null ? (varBud > 0 ? '+' : '') + fmt$(varBud) : '—'}
                    </td>
                    <td className="db-td num balance" style={{color: balColor}}>
                      {budget > 0 ? fmt$(r.runBalance) : '—'}
                      {budget > 0 && <span className="db-balance-bar"><span className="db-balance-fill" style={{width:`${balPct}%`,background:balColor,opacity:.7}}/></span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── Statistics View ──────────────────────────────────────────────────────────
function StatsView({ employees, canonEmployees, weekShifts, budgetCfg, laborData, actuals }) {
  const { dates: WEEK_DATES, events: WEEK_EVENTS_CTX } = useWeek();
  const WEEK_EVENTS = WEEK_EVENTS_CTX;
  const schedHrsByDept = useMemo(() => {
    const m = {}; DEPTS.forEach(d => { m[d.id] = 0; });
    employees.forEach(e => { const h = e.shifts.reduce((s,[,h])=>s+(h||0),0); m[e.dept] = (m[e.dept]||0)+h; });
    return m;
  }, [employees]);

  const hrsByDay = useMemo(() => {
    const arr = Array(7).fill(0);
    employees.forEach(e => { e.shifts.forEach(([,h],di) => { if(h>0) arr[di]+=h; }); });
    return arr;
  }, [employees]);

  const totalHrs = Object.values(schedHrsByDept).reduce((s,h)=>s+h,0);
  const totalFcst = laborData.reduce((s,l)=>s+l.forecast,0);
  const totalBudget = laborData.reduce((s,l)=>s+(l.budget||0),0);
  const totalAct = DEPTS.reduce((s,d)=>s+(actuals?.[d.id]?.total||0),0);
  const staffScheduled = employees.filter(e=>e.shifts.some(([s,h])=>(h||0)>0 && s!=='OFF' && s!=='PASS' && s!=='AVAIL' && s!=='CANCEL')).length;
  const avgHrs = staffScheduled > 0 ? (totalHrs/staffScheduled).toFixed(1) : 0;
  const maxDayHrs = Math.max(...hrsByDay, 1);
  const maxDayIdx = hrsByDay.indexOf(Math.max(...hrsByDay));

  // Per dept stats
  const deptStats = DEPTS.map(d => {
    const ld = laborData.find(l=>l.dept===d.id)||{};
    const hrs = schedHrsByDept[d.id]||0;
    const rate = AVG_RATES[d.id]||30;
    const wkFcst = hrs*rate;
    const actAmt = actuals?.[d.id]?.total||0;
    const actHrs = DEPTS.reduce((s)=>s,0); // placeholder
    const varAmt = actAmt > 0 ? actAmt - ld.forecast : null;
    const varPct = ld.forecast > 0 && varAmt !== null ? (varAmt/ld.forecast)*100 : null;
    const util = ld.budget > 0 ? Math.min(120,((actAmt||ld.forecast)/ld.budget)*100) : null;
    const staff = employees.filter(e=>e.dept===d.id).length;
    return { dept:d, ld, hrs, wkFcst, actAmt, varAmt, varPct, util, staff };
  }).filter(r=>r.staff>0 || r.ld.forecast>0);

  // Event analysis
  const eventGroups = { 'Dark':[], 'Active Event':[] };
  WEEK_EVENTS.forEach((ev,i)=>{
    const key = ev.event === 'Dark' ? 'Dark' : 'Active Event';
    const hrs = hrsByDay[i]; const fcst = hrs*(totalHrs>0?(totalFcst/totalHrs):30);
    eventGroups[key].push({day:DAYS[i],hrs,fcst});
  });

  const insights = [
    hrsByDay[maxDayIdx]>0 && { icon:'📅', text:<><strong>{DAYS[maxDayIdx]}</strong> is the busiest day — {fmtHrs(hrsByDay[maxDayIdx])} scheduled</> },
    avgHrs>0 && { icon:'⏱', text:<>Average <strong>{avgHrs} hours</strong> per scheduled employee</> },
    totalAct>0 && totalAct>totalFcst && { icon:'⚠️', text:<>MTD actuals exceed forecast by <strong style={{color:'#F87171'}}>{fmt$(totalAct-totalFcst)}</strong></> },
    totalAct>0 && totalAct<=totalFcst && { icon:'✅', text:<>MTD actuals under forecast — <strong style={{color:'#4ADE80'}}>{fmt$(totalFcst-totalAct)}</strong> remaining</> },
    deptStats.filter(d=>d.util>100).length>0 && { icon:'🔴', text:<>{deptStats.filter(d=>d.util>100).map(d=>d.dept.label).join(', ')} over budget</> },
    employees.filter(e=>e.shifts.reduce((s,[,h])=>s+(h||0),0)>40).length>0 && { icon:'🕐', text:<><strong>{employees.filter(e=>e.shifts.reduce((s,[,h])=>s+(h||0),0)>40).length} employees</strong> scheduled for overtime (40+ hrs)</> },
  ].filter(Boolean);

  return (
    <div className="stats-view">
      {/* KPI Cards */}
      <div className="stats-section">
        <div className="stats-section-title">Key Metrics — Week of Mar 23–29, 2026</div>
        <div className="kpi-grid">
          {[
            { label:'Staff Scheduled', val:staffScheduled, sub:`of ${employees.length} total` },
            { label:'Total Sched Hours', val:fmtHrs(totalHrs), sub:`${fmtNum(avgHrs)}h avg/person` },
            { label:'Monthly Forecast', val:fmt$(totalFcst), sub:'All departments', color:'#E8890C' },
            totalBudget>0 && { label:'Monthly Budget', val:fmt$(totalBudget), sub:'Authorized spend', color:'#6B6F85' },
            totalAct>0 && { label:'MTD Actual', val:fmt$(totalAct), sub:`${((totalAct/totalFcst)*100).toFixed(1)}% of forecast`, color: totalAct<=totalFcst?'#4ADE80':'#F87171' },
            totalAct>0 && { label:'Remaining', val:(totalFcst-totalAct>=0?'+':'')+fmt$(totalFcst-totalAct), sub:'vs forecast', color:totalFcst-totalAct>=0?'#4ADE80':'#F87171' },
          ].filter(Boolean).map((k,i)=>(
            <div className="kpi-card" key={i}>
              <div className="kpi-label">{k.label}</div>
              <div className="kpi-val" style={{color:k.color||'#E8EAF0'}}>{k.val}</div>
              <div className="kpi-sub">{k.sub}</div>
            </div>
          ))}
        </div>
      </div>

      {/* FOH/BOH + Premium/R&C split */}
      <div className="stats-section">
        <div className="stats-section-title">Labor Breakdown</div>
        <div className="stats-two-col">
          {[
            {title:'Front of House vs Back of House', pairs:[['Front of House',DEPT_GROUPS.foh,'#06B6D4'],['Back of House',DEPT_GROUPS.boh,'#E8890C']]},
            {title:'Premium vs R&C',                  pairs:[['Premium',DEPT_GROUPS.premium,'#E8890C'],['R&C',DEPT_GROUPS.rc,'#4ADE80']]},
          ].map(({title,pairs})=>{
            const rows = pairs.map(([label,ids,color])=>{
              const hrs = ids.reduce((s,id)=>s+(schedHrsByDept[id]||0),0);
              const fcst = ids.reduce((s,id)=>s+(laborData.find(l=>l.dept===id)?.forecast||0),0);
              const act = ids.reduce((s,id)=>s+(actuals?.[id]?.total||0),0);
              const staff = ids.reduce((s,id)=>s+employees.filter(e=>e.dept===id).length,0);
              return {label,ids,color,hrs,fcst,act,staff};
            });
            const totHrs = rows.reduce((s,r)=>s+r.hrs,0)||1;
            const totFcst = rows.reduce((s,r)=>s+r.fcst,0)||1;
            const totAct = rows.reduce((s,r)=>s+r.act,0);
            return (
              <div key={title} className="stats-card">
                <div className="stats-card-title">{title}</div>
                {rows.map(r=>(
                  <div key={r.label} style={{marginBottom:12}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
                      <span style={{fontSize:12,fontWeight:700,color:r.color}}>{r.label}</span>
                      <span style={{fontSize:10,color:'#6B6F85'}}>{r.staff} staff · {r.hrs}h</span>
                    </div>
                    <div style={{display:'flex',gap:6,marginBottom:3}}>
                      <span style={{fontSize:9,color:'#4A4D60',width:52,fontWeight:700}}>HOURS</span>
                      <div style={{flex:1,height:6,background:'#2A2D3A',borderRadius:3,overflow:'hidden'}}>
                        <div style={{height:'100%',width:`${(r.hrs/totHrs)*100}%`,background:r.color+'aa'}}/></div>
                      <span style={{fontSize:10,fontWeight:700,minWidth:64,textAlign:'right',color:'#8B8FA8'}}>{((r.hrs/totHrs)*100).toFixed(0)}%</span>
                    </div>
                    <div style={{display:'flex',gap:6,marginBottom:3}}>
                      <span style={{fontSize:9,color:'#4A4D60',width:52,fontWeight:700}}>FORECAST</span>
                      <div style={{flex:1,height:6,background:'#2A2D3A',borderRadius:3,overflow:'hidden'}}>
                        <div style={{height:'100%',width:`${(r.fcst/totFcst)*100}%`,background:r.color}}/></div>
                      <span style={{fontSize:10,fontWeight:700,minWidth:64,textAlign:'right',color:r.color}}>{fmt$(r.fcst)}</span>
                    </div>
                    {totAct>0 && <div style={{display:'flex',gap:6}}>
                      <span style={{fontSize:9,color:'#4A4D60',width:52,fontWeight:700}}>ACTUAL</span>
                      <div style={{flex:1,height:6,background:'#2A2D3A',borderRadius:3,overflow:'hidden'}}>
                        <div style={{height:'100%',width:`${totAct>0?(r.act/totAct)*100:0}%`,background:'#E8EAF0'}}/></div>
                      <span style={{fontSize:10,fontWeight:700,minWidth:64,textAlign:'right',color:'#E8EAF0'}}>{r.act>0?fmt$(r.act):'—'}</span>
                    </div>}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </div>

      {/* Supervisor Labor — monthly from One & Done upload */}
      <div className="stats-section">
        <div className="stats-section-title">Supervisor Labor — {window.ACTIVE_MONTH_LABEL||'This Month'}</div>
        {(() => {
          const sup = actuals && actuals._supervisors;
          if (sup && Object.keys(sup.byPerson||{}).length) {
            const byDept = DEPTS.map(d => ({ d, ...(sup.byDept[d.id]||{hrs:0,amt:0}), people: Object.values(sup.byPerson).filter(p => p.dept===d.id) }))
                                .filter(r => r.people.length || r.amt>0);
            const tot = byDept.reduce((a,r)=>({hrs:a.hrs+r.hrs, amt:a.amt+r.amt}),{hrs:0,amt:0});
            return <div style={{background:'#1C1E26',border:'1px solid #2A2D3A',borderRadius:10,overflow:'hidden'}}>
              <table className="perf-table">
                <thead><tr>
                  <th>Department</th><th>Supervisors</th>
                  <th className="r">Roles</th>
                  <th className="r">Monthly Hrs</th>
                  <th className="r">Monthly $</th>
                  <th className="r">Avg Rate</th>
                </tr></thead>
                <tbody>
                  {byDept.map(({d,people,hrs,amt}) => (
                    <tr key={d.id}>
                      <td><span style={{display:'inline-flex',alignItems:'center',gap:7}}><span style={{width:9,height:9,borderRadius:'50%',background:d.color}}/><span style={{color:d.color,fontWeight:700}}>{d.label}</span></span></td>
                      <td style={{color:'#8B8FA8',fontSize:11,maxWidth:260,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={people.map(p=>`${p.name} · ${p.job}`).join('\n')}>{people.length} — {people.map(p=>p.name.split(',')[0]).join(', ')||'—'}</td>
                      <td style={{textAlign:'right',color:'#8B8FA8',fontSize:10,maxWidth:200,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={[...new Set(people.map(p=>p.job))].join(', ')}>{[...new Set(people.map(p=>p.job))].slice(0,2).join(', ')||'—'}</td>
                      <td style={{textAlign:'right',fontWeight:700,color:'#E8EAF0'}}>{fmtHrs(hrs)}</td>
                      <td style={{textAlign:'right',fontWeight:800,color:d.color}}>{fmt$(amt)}</td>
                      <td style={{textAlign:'right',color:'#8B8FA8',fontSize:11}}>{hrs>0?'$'+(amt/hrs).toFixed(2)+'/h':'—'}</td>
                    </tr>
                  ))}
                  <tr className="tot-row" style={{background:'#13151C',borderTop:'2px solid #2A2D3A'}}>
                    <td style={{fontWeight:800}}>Total</td>
                    <td style={{color:'#6B6F85',fontSize:11}}>{Object.keys(sup.byPerson).length} supervisors</td>
                    <td/>
                    <td style={{textAlign:'right',fontWeight:900,color:'#E8EAF0'}}>{fmtHrs(tot.hrs)}</td>
                    <td style={{textAlign:'right',fontWeight:900,color:'#E8890C'}}>{fmt$(tot.amt)}</td>
                    <td style={{textAlign:'right',fontWeight:800,color:'#8B8FA8',fontSize:11}}>{tot.hrs>0?'$'+(tot.amt/tot.hrs).toFixed(2)+'/h':'—'}</td>
                  </tr>
                </tbody>
              </table>
            </div>;
          }
          // Fallback: no upload yet — compute from scheduled weekly data
          return <div style={{background:'#1C1E26',border:'1px solid #2A2D3A',borderRadius:10,padding:'18px 20px',textAlign:'center',color:'#8B8FA8',fontSize:12}}>
            <div style={{marginBottom:6,color:'#E8EAF0',fontWeight:700}}>No supervisor labor data yet</div>
            <div>Upload a One &amp; Done file on the <strong>Import</strong> tab to populate this section.</div>
          </div>;
        })()}
      </div>

      {/* H&W / Fringe — monthly actual + projected per dept */}
      <div className="stats-section">
        <div className="stats-section-title">Health &amp; Welfare / Fringe — Monthly by Department</div>
        <div className="stats-sub" style={{marginTop:-8,marginBottom:10,color:'#6B6F85',fontSize:11}}>
          Actual = hours already worked (from One &amp; Done imports when a person-day match exists, else scheduled hours for past days). Projected = scheduled hours for remaining days. Work-dept overrides from the schedule are respected; imported cost-center departments take priority when present.
        </div>
        <div style={{background:'#1C1E26',border:'1px solid #2A2D3A',borderRadius:10,overflow:'hidden'}}>
          <table className="perf-table">
            <thead>
              <tr>
                <th>Department</th>
                <th className="r">B Plan Hrs</th>
                <th className="r">V Plan Hrs</th>
                <th className="r">Total Hrs</th>
                <th className="r">Actual H&amp;W</th>
                <th className="r">Projected H&amp;W</th>
                <th className="r" style={{background:'#E8890C11',color:'#E8890C'}}>Month Total</th>
              </tr>
            </thead>
            <tbody>
              {(() => {
                const plans = budgetCfg?.hwPlans || { b:{hw:8.91,edu:0.07,legal:0.11,name:'B Plan'}, v:{hw:3.42,edu:0.07,legal:0.11,name:'V Plan'} };
                const defaultPlan = budgetCfg?.defaultPlan || 'b';
                const FALLBACK_PLAN = { hw:0, edu:0, legal:0, name:'—' };
                const rateOf = plan => { const p = plans[plan] || plans[defaultPlan] || FALLBACK_PLAN; return (p.hw||0)+(p.edu||0)+(p.legal||0); };
                const AM = window.ACTIVE_MONTH || {year:2026, month:3};
                const today = new Date();
                const isPast = (monthDay) => {
                  const d = new Date(AM.year, AM.month-1, monthDay);
                  return d <= today;
                };
                // Build name → plan lookup from canonEmployees
                const norm = s => (s||'').toLowerCase().replace(/[^a-z]/g,'');
                const nameToPlan = {};
                (canonEmployees||[]).forEach(emp => { nameToPlan[norm(emp.name)] = emp.plan || defaultPlan; });

                const tally = {};
                DEPTS.forEach(d=>{ tally[d.id] = { bActualHrs:0, vActualHrs:0, bProjHrs:0, vProjHrs:0, actualAmt:0, projAmt:0 }; });

                // 1) ACTUAL hours: iterate ALL imported records directly — no per-person matching required
                const recs = (actuals?._records) || [];
                const actByDayName = {}; // used to skip scheduled hrs for matched person+day
                recs.forEach(r => {
                  if (!tally[r.dept]) return;
                  const plan = nameToPlan[norm(r.name)] || defaultPlan;
                  const rate = rateOf(plan);
                  if (plan === 'b') tally[r.dept].bActualHrs += r.hours;
                  else if (plan === 'v') tally[r.dept].vActualHrs += r.hours;
                  else tally[r.dept].bActualHrs += r.hours; // unknown plan defaults to B pool for hours display
                  tally[r.dept].actualAmt += (r.hours||0) * rate;
                  const k = norm(r.name);
                  if (!actByDayName[r.monthDay]) actByDayName[r.monthDay] = new Set();
                  actByDayName[r.monthDay].add(k);
                });

                // 2) PROJECTED hours: for future days ONLY, use scheduled shifts (skip person+day already in actuals)
                (canonEmployees||[]).forEach(emp => {
                  const plan = emp.plan || defaultPlan;
                  const rate = rateOf(plan);
                  const empKey = norm(emp.name);
                  (window.WEEKS||[]).forEach(wk => {
                    const wkSh = (weekShifts||{})[wk.id] || {};
                    const shifts = wkSh[emp.id];
                    shifts && shifts.forEach((sh, di) => {
                      const monthDay = wk.dayIdx[di];
                      if (monthDay == null) return;
                      const schedHrs = sh[1] || 0;
                      const workDept = sh[5] || emp.dept;
                      if (!tally[workDept] || schedHrs <= 0) return;
                      // Skip if this person-day already counted as actual
                      if (actByDayName[monthDay]?.has(empKey)) return;
                      if (isPast(monthDay)) {
                        // Past day with no import record → count as ACTUAL from schedule
                        if (plan === 'b') tally[workDept].bActualHrs += schedHrs;
                        else if (plan === 'v') tally[workDept].vActualHrs += schedHrs;
                        tally[workDept].actualAmt += schedHrs * rate;
                      } else {
                        if (plan === 'b') tally[workDept].bProjHrs += schedHrs;
                        else if (plan === 'v') tally[workDept].vProjHrs += schedHrs;
                        tally[workDept].projAmt += schedHrs * rate;
                      }
                    });
                  });
                });

                const rows = DEPTS.map(d => ({ d, ...tally[d.id] }))
                  .filter(r => r.bActualHrs + r.vActualHrs + r.bProjHrs + r.vProjHrs > 0);
                if (!rows.length) return <tr><td colSpan={7} style={{textAlign:'center',color:'#4A4D60',padding:'20px 0',fontSize:11}}>No imported actuals or scheduled hours for {window.ACTIVE_MONTH_LABEL||'this month'} yet.</td></tr>;
                const tot = rows.reduce((a,r)=>({
                  bActualHrs:a.bActualHrs+r.bActualHrs, vActualHrs:a.vActualHrs+r.vActualHrs,
                  bProjHrs:a.bProjHrs+r.bProjHrs, vProjHrs:a.vProjHrs+r.vProjHrs,
                  actualAmt:a.actualAmt+r.actualAmt, projAmt:a.projAmt+r.projAmt,
                }),{bActualHrs:0,vActualHrs:0,bProjHrs:0,vProjHrs:0,actualAmt:0,projAmt:0});
                return <>
                  {rows.map(({d,bActualHrs,vActualHrs,bProjHrs,vProjHrs,actualAmt,projAmt})=>{
                    const bH = bActualHrs+bProjHrs; const vH = vActualHrs+vProjHrs; const total = actualAmt+projAmt;
                    return <tr key={d.id}>
                      <td><span style={{display:'inline-flex',alignItems:'center',gap:7}}><span style={{width:9,height:9,borderRadius:'50%',background:d.color,display:'inline-block'}}/><span style={{color:d.color,fontWeight:700}}>{d.label}</span></span></td>
                      <td style={{textAlign:'right',color:bH>0?'#93C5FD':'#3A3D50'}}>{bH>0?fmtHrs(bH):'—'}</td>
                      <td style={{textAlign:'right',color:vH>0?'#FDA4A4':'#3A3D50'}}>{vH>0?fmtHrs(vH):'—'}</td>
                      <td style={{textAlign:'right',fontWeight:700,color:'#E8EAF0'}}>{fmtHrs(bH+vH)}</td>
                      <td style={{textAlign:'right',fontWeight:600,color:actualAmt>0?'#E8EAF0':'#4A4D60'}}>{actualAmt>0?fmt$(actualAmt):'—'}</td>
                      <td style={{textAlign:'right',fontWeight:600,color:projAmt>0?'#8B8FA8':'#4A4D60',fontStyle:projAmt>0?'italic':'normal'}}>{projAmt>0?fmt$(projAmt):'—'}</td>
                      <td style={{textAlign:'right',fontWeight:800,color:d.color}}>{fmt$(total)}</td>
                    </tr>;
                  })}
                  <tr className="tot-row" style={{background:'#13151C',borderTop:'2px solid #2A2D3A'}}>
                    <td style={{fontWeight:800}}>Month Total</td>
                    <td style={{textAlign:'right',fontWeight:800,color:'#93C5FD'}}>{fmtHrs(tot.bActualHrs+tot.bProjHrs)}</td>
                    <td style={{textAlign:'right',fontWeight:800,color:'#FDA4A4'}}>{fmtHrs(tot.vActualHrs+tot.vProjHrs)}</td>
                    <td style={{textAlign:'right',fontWeight:800,color:'#E8EAF0'}}>{fmtHrs(tot.bActualHrs+tot.vActualHrs+tot.bProjHrs+tot.vProjHrs)}</td>
                    <td style={{textAlign:'right',fontWeight:800,color:'#E8EAF0'}}>{fmt$(tot.actualAmt)}</td>
                    <td style={{textAlign:'right',fontWeight:800,color:'#8B8FA8',fontStyle:'italic'}}>{fmt$(tot.projAmt)}</td>
                    <td style={{textAlign:'right',fontWeight:900,color:'#E8890C',fontSize:13}}>{fmt$(tot.actualAmt+tot.projAmt)}</td>
                  </tr>
                </>;
              })()}
            </tbody>
          </table>
        </div>
        <div style={{display:'flex',gap:14,marginTop:8,fontSize:10,color:'#6B6F85'}}>
          {Object.entries(budgetCfg?.hwPlans || {}).map(([k,p])=>{
            const r = ((p?.hw||0)+(p?.edu||0)+(p?.legal||0));
            const col = k==='b'?'#2563EB':k==='v'?'#D97757':'#6B6F85';
            return <span key={k}><span style={{width:8,height:8,background:col,borderRadius:2,display:'inline-block',marginRight:4,verticalAlign:'middle'}}/>{p?.name||k}: ${r.toFixed(2)}/hr</span>;
          })}
          <span style={{color:'#4A4D60'}}>— edit rates on the Budget tab</span>
        </div>
      </div>

      {/* Dept performance */}
      <div className="stats-section">
        <div className="stats-section-title">Department Performance</div>
        <div style={{background:'#1C1E26',border:'1px solid #2A2D3A',borderRadius:10,overflow:'hidden'}}>
          <table className="perf-table">
            <thead>
              <tr>
                <th>Department</th><th>Staff</th><th className="r">Sched Hrs</th>
                <th className="r">Wk Forecast</th><th className="r">Mth Forecast</th>
                <th className="r">MTD Actual</th><th className="r">Variance</th>
                <th style={{width:120}}>Budget Utilization</th>
              </tr>
            </thead>
            <tbody>
              {deptStats.map(({dept:d,ld,hrs,wkFcst,actAmt,varAmt,varPct,util,staff})=>(
                <tr key={d.id}>
                  <td><span style={{display:'inline-flex',alignItems:'center',gap:7}}><span style={{width:9,height:9,borderRadius:'50%',background:d.color,display:'inline-block'}}/><span style={{color:d.color,fontWeight:700}}>{d.label}</span></span></td>
                  <td style={{color:'#6B6F85'}}>{staff}</td>
                  <td style={{textAlign:'right',fontWeight:600}}>{hrs>0?fmtHrs(hrs):'—'}</td>
                  <td style={{textAlign:'right',color:'#8B8FA8'}}>{wkFcst>0?fmt$(wkFcst):'—'}</td>
                  <td style={{textAlign:'right',color:d.color,fontWeight:700}}>{fmt$(ld.forecast)}</td>
                  <td style={{textAlign:'right',fontWeight:700,color:actAmt>0?'#E8EAF0':'#4A4D60'}}>{actAmt>0?fmt$(actAmt):'—'}</td>
                  <td style={{textAlign:'right'}} className={varAmt===null?'':varAmt>0?'neg':'pos'}>{varAmt!==null?(varAmt>0?'+':'')+fmt$(varAmt):'—'}</td>
                  <td>
                    {util!==null?<>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                        <span style={{fontSize:9,color:'#6B6F85'}}>{util.toFixed(0)}%</span>
                        {util>100&&<span className="kpi-badge badge-red">Over</span>}
                        {util>80&&util<=100&&<span className="kpi-badge badge-amber">On Track</span>}
                        {util<=80&&<span className="kpi-badge badge-green">Under</span>}
                      </div>
                      <div className="util-bar"><div className="util-fill" style={{width:`${Math.min(100,util)}%`,background:util>100?'#DC2626':util>80?'#E8890C':d.color}}/></div>
                    </>:<span style={{fontSize:10,color:'#4A4D60'}}>No budget set</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Day dist + Insights */}
      <div className="stats-two-col">
        <div className="stats-section">
          <div className="stats-section-title">Scheduled Hours by Day</div>
          <div className="stats-card" style={{display:'flex',flexDirection:'column',gap:8}}>
            {DAYS.map((d,i)=>(
              <div key={d} className="day-dist">
                <span className="day-dist-label">{d}</span>
                <div className="day-dist-track">
                  <div className="day-dist-fill" style={{width:`${(hrsByDay[i]/maxDayHrs)*100}%`,background:i===maxDayIdx?'#E8890C':'#2563EB88'}}>
                    {hrsByDay[i]>0&&fmtHrs(hrsByDay[i])}
                  </div>
                </div>
                <span className="day-dist-val">{hrsByDay[i]>0?fmt$(hrsByDay[i]*(totalHrs>0?totalFcst/totalHrs:30)):'—'}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="stats-section">
          <div className="stats-section-title">Insights &amp; Flags</div>
          <div className="stats-card">
            {insights.length>0 ? insights.map((ins,i)=>(
              <div key={i} className="insight-row">
                <span className="insight-icon">{ins.icon}</span>
                <span className="insight-text">{ins.text}</span>
              </div>
            )):<div style={{color:'#4A4D60',fontSize:12,padding:'8px 0'}}>Import One &amp; Done data for deeper insights.</div>}
            {totalAct===0&&<div className="insight-row"><span className="insight-icon">💡</span><span className="insight-text">Go to <strong>Import</strong> tab to load actual labor data from One &amp; Done report.</span></div>}
          </div>

          <div className="stats-section-title" style={{marginTop:16}}>Event Type Analysis</div>
          <div className="stats-card">
            {Object.entries(eventGroups).map(([type,days])=>{
              const totHrs=days.reduce((s,d)=>s+d.hrs,0);
              const totFcst=days.reduce((s,d)=>s+d.fcst,0);
              return (
                <div key={type} className="insight-row">
                  <span className="insight-icon">{type==='Dark'?'🌑':'🎪'}</span>
                  <span className="insight-text">
                    <strong>{type}</strong> ({days.length} days) — {totHrs}h / {fmt$(totFcst)}<br/>
                    <span style={{fontSize:10,color:'#6B6F85'}}>Days: {days.map(d=>d.day).join(', ')}</span>
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Budget View ──────────────────────────────────────────────────────────────
function BudgetView({ config, sales, events, onConfigChange, onSalesChange, onEventsChange }) {
  const { MARCH_DAYS, DEFAULT_BUDGET_CONFIG } = window;
  // Guard against partial config from stale localStorage
  const safeCfg = {
    officeFlat: config?.officeFlat ?? DEFAULT_BUDGET_CONFIG.officeFlat,
    pcts: { ...DEFAULT_BUDGET_CONFIG.pcts, ...(config?.pcts || {}) },
    hwPlans: {
      ...DEFAULT_BUDGET_CONFIG.hwPlans,
      ...(config?.hwPlans || {}),
    },
    defaultPlan: config?.defaultPlan || DEFAULT_BUDGET_CONFIG.defaultPlan,
    // Preserve every other field that callers store on the config so we don't
    // accidentally strip them when onConfigChange writes back via {...config, ...patch}.
    holidays: Array.isArray(config?.holidays) ? config.holidays : (DEFAULT_BUDGET_CONFIG.holidays || []),
    positionRates: { ...(DEFAULT_BUDGET_CONFIG.positionRates||{}), ...(config?.positionRates||{}) },
    customPositions: Array.isArray(config?.customPositions) ? config.customPositions : (DEFAULT_BUDGET_CONFIG.customPositions || []),
    positionOrder: (config?.positionOrder && typeof config.positionOrder === 'object') ? config.positionOrder : (DEFAULT_BUDGET_CONFIG.positionOrder || {}),
    tagRates: (config?.tagRates && typeof config.tagRates === 'object') ? config.tagRates : (DEFAULT_BUDGET_CONFIG.tagRates || {}),
    hiddenPositions: Array.isArray(config?.hiddenPositions) ? config.hiddenPositions : [],
  };
  config = safeCfg;
  const daysInMonth = MARCH_DAYS.length;

  // Pool totals by area
  const salesByArea = useMemo(()=>{
    const prem = {food:0,nabev:0,alcohol:0,total:0};
    const rc = {food:0,nabev:0,alcohol:0,total:0};
    MARCH_DAYS.forEach((d,i)=>{
      const s = sales[i] || {};
      ['prem_food','prem_nabev','prem_alcohol','rc_food','rc_nabev','rc_alcohol'].forEach(k=>{
        const v = parseFloat(s[k])||0;
        if(k.startsWith('prem_')) { prem[k.replace('prem_','')] += v; prem.total += v; }
        else { rc[k.replace('rc_','')] += v; rc.total += v; }
      });
    });
    return { prem, rc, grand: prem.total + rc.total };
  },[sales]);

  // Resolve a configured "area" code to a sales pool total.
  // premium=all premium, rc=all R&C, alcohol=prem alcohol+rc alcohol,
  // prem_food=prem food only, rc_food=rc food only, food=both food only.
  const areaPool = (area)=>{
    switch(area){
      case 'rc':        return salesByArea.rc.total;
      case 'alcohol':   return salesByArea.prem.alcohol + salesByArea.rc.alcohol;
      case 'prem_food': return salesByArea.prem.food;
      case 'rc_food':   return salesByArea.rc.food;
      case 'food':      return salesByArea.prem.food + salesByArea.rc.food;
      case 'premium':
      default:          return salesByArea.prem.total;
    }
  };
  const dayAreaSales = (s, area)=>{
    const n = k=>parseFloat(s[k])||0;
    switch(area){
      case 'rc':        return n('rc_food')+n('rc_nabev')+n('rc_alcohol');
      case 'alcohol':   return n('prem_alcohol')+n('rc_alcohol');
      case 'prem_food': return n('prem_food');
      case 'rc_food':   return n('rc_food');
      case 'food':      return n('prem_food')+n('rc_food');
      case 'premium':
      default:          return n('prem_food')+n('prem_nabev')+n('prem_alcohol');
    }
  };

  // Labor $ per dept = pct × total area sales + (office flat for admin)
  const deptBudgets = useMemo(()=>{
    const out = {};
    DEPTS.forEach(d=>{
      const cfg = config.pcts[d.id] || { pct:0, area:'premium' };
      const pool = areaPool(cfg.area);
      const fromPct = pool * (cfg.pct/100);
      const fromFlat = d.id === 'admin' ? (config.officeFlat||0) : 0;
      out[d.id] = { fromPct, fromFlat, total: fromPct + fromFlat, pool, pct:cfg.pct, area:cfg.area };
    });
    return out;
  },[config,salesByArea]);

  const totalBudget = Object.values(deptBudgets).reduce((s,b)=>s+b.total,0);
  const totalPctPrem = DEPTS.filter(d=>config.pcts[d.id]?.area==='premium').reduce((s,d)=>s+(config.pcts[d.id]?.pct||0),0);
  const totalPctRc = DEPTS.filter(d=>['rc','rc_food'].includes(config.pcts[d.id]?.area)).reduce((s,d)=>s+(config.pcts[d.id]?.pct||0),0);

  // Daily budget: distribute each dept's budget based on that day's sales share of its area
  const dailyBudgets = useMemo(()=>{
    const holSet = new Set(config.holidays||[]);
    return MARCH_DAYS.map((d,i)=>{
      const s = sales[i] || {};
      const daySalesPrem = ['prem_food','prem_nabev','prem_alcohol'].reduce((a,k)=>a+(parseFloat(s[k])||0),0);
      const daySalesRc = ['rc_food','rc_nabev','rc_alcohol'].reduce((a,k)=>a+(parseFloat(s[k])||0),0);
      const isHol = holSet.has(d.date);
      const holMult = isHol ? 1.5 : 1;
      let dayBudget = 0; const byDept = {};
      DEPTS.forEach(dept=>{
        const cfg = config.pcts[dept.id] || { pct:0, area:'premium' };
        const daySales = dayAreaSales(s, cfg.area);
        const fromPct = daySales * (cfg.pct/100);
        const flatDay = dept.id==='admin' ? (config.officeFlat||0)/daysInMonth : 0;
        byDept[dept.id] = (fromPct * holMult) + flatDay;
        dayBudget += byDept[dept.id];
      });
      return { date:d.date, dow:d.dow, event:d.event, daySalesPrem, daySalesRc, total:daySalesPrem+daySalesRc, budget:dayBudget, byDept, isHol };
    });
  },[sales,config,salesByArea,daysInMonth]);

  const updateSale = (di, key, val)=>{ onSalesChange({ ...sales, [di]: { ...(sales[di]||{}), [key]: val } }); };
  const updatePct = (deptId, pct)=>{ onConfigChange({ ...config, pcts:{ ...config.pcts, [deptId]:{ ...(config.pcts[deptId]||{}), pct:parseFloat(pct)||0 } } }); };
  const updateArea = (deptId, area)=>{ onConfigChange({ ...config, pcts:{ ...config.pcts, [deptId]:{ ...(config.pcts[deptId]||{}), area } } }); };
  const updateFlat = (v)=>{ onConfigChange({ ...config, officeFlat:parseFloat(v)||0 }); };
  const resetDefaults = ()=>{ if(confirm('Reset % allocation to defaults?')) onConfigChange(JSON.parse(JSON.stringify(DEFAULT_BUDGET_CONFIG))); };

  const fillFromForecast = ()=>{
    if(!confirm(`Fill sales from the ${window.ACTIVE_MONTH_LABEL||'current month'} forecast (sample distribution)? Current values will be overwritten.`)) return;
    // Estimate sales from the file's daily forecast: if kp/rc f is the labor $, back out sales via % (prem 10%, rc 23%)
    const newSales = {};
    MARCH_DAYS.forEach((d,i)=>{
      const kpSales = (d.kp?.f||0) / 0.10;  // premium culinary labor 10% of sales
      const rcSales = (d.rc?.f||0) / 0.23;  // R&C labor ~23% of sales
      newSales[i] = {
        prem_food: Math.round(kpSales*0.70),
        prem_nabev: Math.round(kpSales*0.10),
        prem_alcohol: Math.round(kpSales*0.20),

                      <input type="radio" name="defaultPlan" checked={config.defaultPlan===k} onChange={()=>onConfigChange({ ...config, defaultPlan:k })} style={{margin:0}}/>

                    </label>
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>

              <th style={{textAlign:'left'}}>Position</th>

              <th className="num" style={{width:90}}>6h Rate</th>

              <th className="num" style={{width:60}}>Status</th>

                const positions = (window.POSITIONS||[]).filter(p=>p.dept===d.id);

                  const cur = positions.map(p=>p.id);
                  const i = cur.indexOf(posId); if (i<0) return;
                  const j = i + dir; if (j<0 || j>=cur.length) return;
                  const next = cur.slice(); [next[i], next[j]] = [next[j], next[i]];
                  onConfigChange({ ...config, positionOrder: { ...(config.positionOrder||{}), [d.id]: next } });

                const addCustom = ()=>{
                  const label = (prompt(`New ${d.label} position name?`)||'').trim();
                  if (!label) return;
                  const baseId = label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'custom';
                  let id = `${d.id}_${baseId}`;
                  const allIds = new Set((window.POSITIONS||[]).map(p=>p.id));
                  let n=2; while (allIds.has(id)) { id = `${d.id}_${baseId}_${n++}`; }
                  const rateStr = prompt(`Default 8h+ rate for "${label}"? (4h and 6h tiers will use this too unless overridden)`, '20.00');

                  const newPos = { id, label, dept: d.id, h4: rate, h6: rate, h8: rate, custom: true };
                  onConfigChange({ ...config, customPositions: [...(config.customPositions||[]), newPos] });
                };
                const removeCustom = (pid)=>{
                  if (!confirm('Remove this custom position? Any employees assigned to it will need a new position.')) return;
                  const nextRates = { ...(config.positionRates||{}) }; delete nextRates[pid];
                  onConfigChange({ ...config, customPositions: (config.customPositions||[]).filter(cp=>cp.id!==pid), positionRates: nextRates });
                };
                const hideBuiltIn = (pid)=>{
                  if (!confirm('Hide this position? It will be removed from dropdowns and area rows on the Schedule. Any employees assigned to it will need a new position. You can restore it later from the "Hidden positions" list at the bottom of this section.')) return;
                  const nextHidden = Array.from(new Set([...(config.hiddenPositions||[]), pid]));

                      onConfigChange({ ...config, positionRates: nextRates });

                    const isOverridden = Object.keys(ov).length > 0;
                    return <tr key={p.id}>
                      <td style={{fontWeight:600,color:'#C8CAD6'}}>
                        <span style={{display:'inline-flex',gap:1,marginRight:6,verticalAlign:'middle'}}>

                        </td>;
                      })}
                      <td className="num" style={{fontSize:10,color:isOverridden?'#A78BFA':isCustom?'#4ADE80':'#6B6F85',fontWeight:700}}>{isCustom?'New':isOverridden?'Custom':'Default'}</td>
                    </tr>;
                  })}
                  <tr><td colSpan={6} style={{padding:'4px 6px'}}>
                    <button onClick={addCustom} style={{background:'transparent',border:`1px dashed ${d.color}66`,color:d.color,borderRadius:4,fontSize:10,padding:'4px 10px',cursor:'pointer',fontWeight:600}}>+ Add {d.label} position</button>
                  </td></tr>
                </React.Fragment>;
              })}
            </tbody>
          </table>
        </div>
        {(() => {
          const hidden = config.hiddenPositions || [];
          if (!hidden.length) return null;
          // Resolve hidden ids back to position objects (from base + custom).
          const allKnown = [...(window.__BASE_POSITIONS||[]), ...((config.customPositions)||[])];
          const restore = (pid) => {
            onConfigChange({ ...config, hiddenPositions: hidden.filter(x=>x!==pid) });

          return (
            <div style={{marginTop:10,padding:'8px 10px',background:'#1C1E2680',border:'1px dashed #3A3D50',borderRadius:5}}>

              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {hidden.map(pid => {
                  const p = allKnown.find(x=>x.id===pid);

                      <span style={{color:'#4ADE80',fontWeight:700,fontSize:10}}>↺</span>

                  const nextRates = { ...(config.tagRates||{}) };

                  onConfigChange({ ...config, tagRates: nextRates });

// ─── Planning Sheet ───────────────────────────────────────────────────────────
// A plan cell holds ONE shift block { n, time, hrs } or MANY via { blocks:[ {n,time,hrs}, ... ] }.
// planEntries() normalises both shapes; planSumN/planSumHrs roll them up.
function planEntries(c){
  if(!c) return [];
  if(Array.isArray(c.blocks)) return c.blocks.filter(b=>b && ((+b.n>0)||b.time));
  if((+c.n>0)||c.time) return [{ n:+c.n||0, time:c.time||'', hrs:+c.hrs||0 }];
  return [];
}
function planSumN(c){ return planEntries(c).reduce((s,b)=>s+(+b.n||0),0); }
function planSumHrs(c){ return planEntries(c).reduce((s,b)=>s+(+b.hrs||0),0); }

// Department-head view: for every position, set how many people are needed each day
// of the month (+ target shift time + total hours). Counts roll up to a department
// total per day and feed the "need / scheduled" counters on the Schedule grid.
function PlanCellPopup({ posId, posLabel, deptColor, date, dow, cur, monthDays, onApply, onApplyMulti, allPositions, viewPositions, weekDates, onClose }) {
  const _toEdit = (b)=>{ const parts=(b.time||'').split(/[-–—]/); return { n: (b.n!=null && b.n!=='') ? String(b.n) : '', start: parts[0]||'', end: parts[1]||'', hrsOv: b.hrs!=null ? String(b.hrs) : '' }; };
  const _seedBlocks = planEntries(cur);
  const [blocks, setBlocks] = useState(_seedBlocks.length ? _seedBlocks.map(_toEdit) : [{ n:'', start:'', end:'', hrsOv:'' }]);
  const upd = (i,key,val)=>setBlocks(bs=>bs.map((b,j)=>j===i?{...b,[key]:val}:b));
  const addBlock = ()=>setBlocks(bs=>[...bs, { n:'', start:'', end:'', hrsOv:'' }]);
  const removeBlock = (i)=>setBlocks(bs=> bs.length>1 ? bs.filter((_,j)=>j!==i) : [{ n:'', start:'', end:'', hrsOv:'' }]);
  const calc = (b)=>{
    const time = (b.start||b.end) ? joinRange(b.start,b.end) : '';
    const persh = rangeToHours(time);
    const autoHrs = (persh!=null && +b.n>0) ? Math.round(persh*(+b.n)*100)/100 : (persh||0);
    const effHrs = b.hrsOv!=='' ? (parseFloat(b.hrsOv)||0) : autoHrs;
    return { time, persh, autoHrs, effHrs };
  };
  const calcs = blocks.map(calc);
  const totalN = blocks.reduce((s,b)=>s+(parseInt(b.n)||0),0);
  const totalHrs = Math.round(calcs.reduce((s,c)=>s+c.effHrs,0)*100)/100;
  const build = () => {
    const out = [];
    blocks.forEach((b,i)=>{
      const cnt = parseInt(b.n)||0; const time = calcs[i].time; const hrs = calcs[i].effHrs;
      if (cnt<=0 && !time) return;
      out.push({ n:cnt, time, hrs });
    });
    if (!out.length) return null;
    return out.length===1 ? out[0] : { blocks: out };
  };
  const saveDay = () => { onApply({ [date]: build() }); onClose(); };
  const saveAllDow = () => {
    const val = build();
    const map = {};
    monthDays.forEach(d=>{ if (d.dow===dow) map[d.date]=val; });
    onApply(map); onClose();
  };
  const clear = () => { onApply({ [date]: null }); onClose(); };
  const viewIds = (viewPositions||[]).map(p=>p.id);
  const _weekDates = (weekDates && weekDates.length) ? weekDates : [date];
  return (
    <>
      <div className="cell-edit-overlay" style={{background:'#0008',zIndex:600}} onClick={onClose}/>
      <div className="cell-edit-popup" style={{zIndex:601,width:392,maxWidth:'calc(100vw - 32px)',top:'50%',left:'50%',transform:'translate(-50%,-50%)',height:'fit-content'}}>
        <div className="popup-title" style={{color:deptColor,marginBottom:4}}>{posLabel}</div>
        <div style={{fontSize:11,color:'#8B8FA8',marginBottom:10}}>{dow} {date} — one row per shift block</div>
        <div style={{display:'flex',gap:6,padding:'0 2px 4px',fontSize:9,color:'#6B6F85',fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em'}}>
          <div style={{flex:'0 0 58px'}}>People</div>
          <div style={{flex:1}}>Start</div>
          <div style={{flex:1}}>End</div>
          <div style={{flex:'0 0 56px'}}>Hrs</div>
          <div style={{flex:'0 0 22px'}}></div>
        </div>
        {blocks.map((b,i)=>(
          <div key={i} style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
            <input type="number" min="0" value={b.n} onChange={e=>upd(i,'n',e.target.value)} placeholder="0" style={{...inpS,flex:'0 0 58px',textAlign:'center'}} autoFocus={i===0}/>
            <input value={b.start} onChange={e=>upd(i,'start',e.target.value)} placeholder="8A" style={{...inpS,flex:1}}/>
            <input value={b.end} onChange={e=>upd(i,'end',e.target.value)} placeholder="3P" style={{...inpS,flex:1}}/>
            <input value={b.hrsOv} onChange={e=>upd(i,'hrsOv',e.target.value)} placeholder={String(calcs[i].autoHrs||0)} style={{...inpS,flex:'0 0 56px',textAlign:'center'}}/>
            <button onClick={()=>removeBlock(i)} title="Remove this block" style={{flex:'0 0 22px',height:30,border:'1px solid #3A3D50',background:'transparent',color:'#6B6F85',borderRadius:6,cursor:'pointer',fontSize:15,lineHeight:1,padding:0}}>×</button>
          </div>
        ))}
        <button onClick={addBlock} className="preset-btn" style={{width:'100%',padding:'7px',marginBottom:8,fontSize:11}}>+ Add another shift block</button>
        <div style={{fontSize:11,color:'#8B8FA8',margin:'2px 0 10px'}}>
          {totalN>0 ? <>Total <b style={{color:'#E8EAF0'}}>{totalN}</b> {totalN===1?'person':'people'} · <b style={{color:'#E8890C'}}>{totalHrs}h</b></> : 'Enter people and an optional shift time'}
        </div>
        <div style={{fontSize:9,fontWeight:800,letterSpacing:'.07em',color:'#6B6F85',textTransform:'uppercase',margin:'2px 0 6px'}}>Apply this value to</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:8}}>
          <button className="preset-btn" style={{padding:'8px 6px',fontSize:10.5,lineHeight:1.3,textAlign:'center'}} onClick={()=>{onApplyMulti(viewIds,[date],build());onClose();}} title={`Every position shown, on ${dow} ${date} (${viewIds.length})`}>All positions<br/><span style={{opacity:.65}}>this day</span></button>
          <button className="preset-btn" style={{padding:'8px 6px',fontSize:10.5,lineHeight:1.3,textAlign:'center'}} onClick={()=>{onApplyMulti(viewIds,_weekDates,build());onClose();}} title={`Every position shown, for this whole week (${_weekDates.length} days)`}>All positions<br/><span style={{opacity:.65}}>this week</span></button>
        </div>
        <div className="popup-actions" style={{display:'flex',gap:6}}>
          <button className="popup-cancel" onClick={clear}>Clear</button>
          <button className="popup-cancel" onClick={onClose}>Cancel</button>
          <button className="popup-save" onClick={saveDay}>Save</button>
        </div>
      </div>
    </>
  );
}

function PlanningView({ plan, onPlanChange, monthData, employees, weekShifts, budgetCfg, sales, actuals, customPositionsKey }) {
  const [editing, setEditing] = useState(null); // {posId, date, dow}
  const [selDept, setSelDept] = useState('all');
  const [showSummary, setShowSummary] = useState(true);
  const editable = selDept!=='all'; // All Departments = read-only roll-up / overview
  const [painting, setPainting] = useState(false);
  const [paintRange, setPaintRange] = useState(null); // {r0,r1,c0,c1}
  const paintRef = useRef(null);
  const rowPosMapRef = useRef({});
  const colDateMapRef = useRef({});
  const monthDays = monthData.monthDays || [];
  // Rebuild whenever custom positions change so new roles appear immediately
  const positionsByDept = useMemo(()=>{
    const by = {};
    (window.POSITIONS||[]).forEach(p=>{ (by[p.dept]=by[p.dept]||[]).push(p); });
    return by;
  }, [monthData, customPositionsKey]);
  const deptsToShow = selDept==='all' ? DEPTS : DEPTS.filter(d=>d.id===selDept);

  const applyPlan = (posId, dateValMap) => {
    onPlanChange(prev => {
      const next = { ...(prev||{}) };
      const pos = { ...(next[posId]||{}) };
      Object.entries(dateValMap).forEach(([date,val])=>{
        if (!val || planEntries(val).length===0) delete pos[date];
        else pos[date] = val;
      });
      if (Object.keys(pos).length) next[posId] = pos; else delete next[posId];
      return next;
    });
  };

  // Apply one value to many positions × many dates (mass edit / fill).
  const applyPlanMulti = (posIds, dates, val) => {
    onPlanChange(prev => {
      const next = { ...(prev||{}) };
      (posIds||[]).forEach(pid=>{
        const pos = { ...(next[pid]||{}) };
        (dates||[]).forEach(date=>{
          if (!val || planEntries(val).length===0) delete pos[date];
          else pos[date] = val;
        });
        if (Object.keys(pos).length) next[pid] = pos; else delete next[pid];
      });
      return next;
    });
  };

  const cellOf = (posId, date) => (plan && plan[posId] && plan[posId][date]) || null;
  const monthDateSet = useMemo(()=>new Set(monthDays.map(d=>d.date)), [monthDays]);
  const weekDatesOf = (date) => {
    const wk = (monthData.weeks||[]).find(w=>w.dates.some(dd=>dd[0]===date));
    if (!wk) return [date];
    return wk.dates.map(dd=>dd[0]).filter(ds=>monthDateSet.has(ds));
  };
  const deptDayTotal = (deptId, date) => (positionsByDept[deptId]||[]).reduce((s,p)=>{
    const c = cellOf(p.id, date); return s + planSumN(c);
  }, 0);
  const rowTotals = (posId) => {
    let ppl=0, hrs=0;
    monthDays.forEach(d=>{ const c=cellOf(posId,d.date); ppl+=planSumN(c); hrs+=planSumHrs(c); });
    return { ppl, hrs };
  };
  // Planned totals for the visible department(s)
  const grand = useMemo(()=>{
    let ppl=0, hrs=0;
    deptsToShow.forEach(dept=>(positionsByDept[dept.id]||[]).forEach(p=>{
      const byDate = plan && plan[p.id]; if(!byDate) return;
      Object.values(byDate).forEach(c=>{ ppl+=planSumN(c); hrs+=planSumHrs(c); });
    }));
    return { ppl, hrs };
  }, [plan, positionsByDept, selDept]);

  const isWknd = (dow)=> dow==='Sat'||dow==='Sun';

  // ── Excel-style fill-handle paint (positions × days) ──
  useEffect(()=>{
    if (!painting) return;
    document.body.classList.add('painting');
    const onMove = (e)=>{
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cell = el && el.closest && el.closest('td[data-prow]');
      const p = paintRef.current; if (!p || !cell) return;
      const r = +cell.getAttribute('data-prow'), c = +cell.getAttribute('data-pcol');
      const range = { r0:Math.min(p.srcRow,r), r1:Math.max(p.srcRow,r), c0:Math.min(p.srcCol,c), c1:Math.max(p.srcCol,c) };
      p.range = range; setPaintRange(range);
    };
    const onUp = ()=>{
      const p = paintRef.current;
      if (p) {
        const rng = p.range || {r0:p.srcRow,r1:p.srcRow,c0:p.srcCol,c1:p.srcCol};
        const rowMap = rowPosMapRef.current||{}, colMap = colDateMapRef.current||{};
        const posIds=[], dates=[];
        for (let r=rng.r0;r<=rng.r1;r++){ if (rowMap[r]!=null) posIds.push(rowMap[r]); }
        for (let c=rng.c0;c<=rng.c1;c++){ if (colMap[c]!=null) dates.push(colMap[c]); }
        if (p.val && posIds.length && dates.length) applyPlanMulti(posIds, dates, p.val);
      }
      document.body.classList.remove('painting');
      paintRef.current = null; setPaintRange(null); setPainting(false);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp, {once:true});
    return ()=>{ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.body.classList.remove('painting'); };
  }, [painting]);
  const inPaint = (r,c)=> paintRange && r>=paintRange.r0 && r<=paintRange.r1 && c>=paintRange.c0 && c<=paintRange.c1;
  // Build rowIdx→posId and colIdx→date maps in render (DOM) order for the fill paint
  const _posRowIdx = {}; const _rowToPos = {}; let _prow = 0;
  deptsToShow.forEach(dept=>{ (positionsByDept[dept.id]||[]).forEach(p=>{ _posRowIdx[p.id]=_prow; _rowToPos[_prow]=p.id; _prow++; }); });
  rowPosMapRef.current = _rowToPos;
  const _colToDate = {}; monthDays.forEach((d,i)=>{ _colToDate[i]=d.date; }); colDateMapRef.current = _colToDate;

  // ── Monthly labor summary (per-day budget / forecast / actual) ──────────────
  const AM = window.ACTIVE_MONTH || {year:monthData.year, month:monthData.month};
  const budgetData = useMemo(()=>computeBudgetData(budgetCfg, sales, monthDays), [budgetCfg, sales, monthDays]);
  const monthStartSerial = window.dateToSerial(new Date(AM.year, AM.month-1, 1));
  // Forecast = PLANNED labor from this tab (people × planned hours × position rate),
  // not the scheduled shifts. Each plan cell stores total hrs; rate by shift-length tier.
  const dayFcst = useMemo(()=>{
    const out = {}; // date -> {hrs,cost}
    const posList = (selDept==='all') ? (window.POSITIONS||[]) : (window.POSITIONS||[]).filter(p=>p.dept===selDept);
    posList.forEach(p=>{
      const byDate = plan && plan[p.id]; if(!byDate) return;
      Object.entries(byDate).forEach(([date,c])=>{
        planEntries(c).forEach(b=>{
          const n = +b.n||0, hrs = +b.hrs||0;
          if(hrs<=0) return;
          const persh = n>0 ? hrs/n : hrs;
          const tier = persh>=8?'h8':(persh>=5?'h6':'h4');
          const rate = getPosRate(p.id, tier) ?? p.h8 ?? p.h6 ?? p.h4 ?? 28;
          if(!out[date]) out[date]={hrs:0,cost:0};
          out[date].hrs += hrs; out[date].cost += hrs*rate;
        });
      });
    });
    return out;
  }, [plan, selDept, customPositionsKey]);
  const actOf = (monthDay)=>{
    const serial = monthStartSerial + monthDay - 1;
    if(selDept!=='all') return (actuals?.[selDept]?.[serial]?.amount)||0;
    let t=0; DEPTS.forEach(d=>{ t += (actuals?.[d.id]?.[serial]?.amount)||0; }); return t;
  };
  const sumRows = monthDays.map((d,i)=>{
    const f = dayFcst[d.date]||{hrs:0,cost:0};
    const bud = selDept==='all' ? (budgetData.dailyBudgets[i]?.total||0) : (budgetData.dailyBudgets[i]?.byDept?.[selDept]||0);
    const day = parseInt(String(d.date).split('/')[1]);
    return { date:d.date, dow:d.dow, event:d.event, hrs:f.hrs, fcst:f.cost, bud, act:actOf(day), day };
  });
  const sumTot = sumRows.reduce((a,r)=>({hrs:a.hrs+r.hrs,fcst:a.fcst+r.fcst,bud:a.bud+r.bud,act:a.act+r.act}),{hrs:0,fcst:0,bud:0,act:0});
  const todayStr = `${AM.month}/${new Date().getDate()}`;

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,background:'#13151C'}}>

// ─── Employee Cost Modal ─────────────────────────────────────────────────────
// Shows: position, rate used (base + lead if applicable), weekly + MTD hours/cost.
function EmpCostModal({ empId, employees, weekShifts, monthData, onClose, actuals }) {
  const emp = employees.find(e=>e.id===empId);
  if (!emp) return null;
  const dept = getDept(emp.dept);
  const pos = (window.POSITIONS||[]).find(p=>p.id===emp.positionId);
  const posLabel = pos ? pos.label : (emp.role || '—');

  // Local rate resolver: override > emp.rate > dept average
  const resolveRate = (e, opts={}) => {
    let r = (opts.rateOverride!=null && opts.rateOverride!=='') ? parseFloat(opts.rateOverride) : (e.rate!=null ? parseFloat(e.rate) : (AVG_RATES[e.dept]||30));
    if (opts.lead) r += 3;
    return r;
  };
  const OT_MULT = 1.5;
  const HOL_MULT = 2.0;

  // Compute per-week hours and cost for this emp across the whole month
  const weekRows = (monthData?.weeks||[]).map(wk=>{
    const shifts = (weekShifts[wk.id]||{})[empId] || Array(7).fill(['',0,'']);
    let hours=0, cost=0, otHrs=0, holHrs=0, leadHrs=0;
    shifts.forEach(sh=>{
      const [, h] = sh; const flag = sh[3]||''; const overrideRate = sh[4];
      if (!h) return;
      const isLead = flag==='LEAD';
      const isHol  = flag==='HOL';
      const isOT   = flag==='OT';
      const rate = resolveRate(emp, { lead:isLead, rateOverride:overrideRate });
      const mult = isOT ? OT_MULT : isHol ? HOL_MULT : 1;
      const hrCost = rate * h * mult;
      hours += h; cost += hrCost;
      if (isOT)   otHrs  += h;
      if (isHol)  holHrs += h;
      if (isLead) leadHrs+= h;
    });
    return { wk, hours, cost, otHrs, holHrs, leadHrs };
  });
  const mtd = weekRows.reduce((s,r)=>({hours:s.hours+r.hours,cost:s.cost+r.cost,otHrs:s.otHrs+r.otHrs,holHrs:s.holHrs+r.holHrs,leadHrs:s.leadHrs+r.leadHrs}),{hours:0,cost:0,otHrs:0,holHrs:0,leadHrs:0});

  // Rate preview
  const baseRate = resolveRate(emp, {});
  const leadRate = resolveRate(emp, { lead:true });
  const rateSource = emp.rate!=null ? 'employee record' : 'dept average';

  return (
    <>
      <div style={{position:'fixed',inset:0,background:'#000A',zIndex:500}} onClick={onClose}/>
      <div style={{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:560,maxHeight:'85vh',overflowY:'auto',background:'#13151C',border:'1px solid #3A3D50',borderRadius:12,zIndex:501,boxShadow:'0 24px 80px #0009'}}>
        <div style={{padding:'18px 22px',borderBottom:'1px solid #2A2D3A',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:11,fontWeight:800,letterSpacing:'.1em',color:dept.color}}>{dept.label.toUpperCase()} · {posLabel.toUpperCase()}</div>
            <div style={{fontSize:18,fontWeight:800,color:'#E8EAF0',marginTop:3}}>{emp.name}</div>
          </div>
          <button onClick={onClose} style={{background:'transparent',border:'none',color:'#6B6F85',fontSize:22,cursor:'pointer',padding:6}}>×</button>
        </div>

        <div style={{padding:'16px 22px',borderBottom:'1px solid #2A2D3A',display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14}}>
          <div>
            <div style={{fontSize:9,letterSpacing:'.1em',color:'#6B6F85',fontWeight:700}}>BASE RATE (8H)</div>
            <div style={{fontSize:20,fontWeight:800,color:'#E8EAF0',marginTop:2}}>${baseRate.toFixed(2)}</div>
            <div style={{fontSize:9,color:'#6B6F85',marginTop:2}}>source: {rateSource}</div>
          </div>
          <div>
            <div style={{fontSize:9,letterSpacing:'.1em',color:'#6B6F85',fontWeight:700}}>LEAD RATE (+$3)</div>
            <div style={{fontSize:20,fontWeight:800,color:'#4ADE80',marginTop:2}}>${leadRate.toFixed(2)}</div>
            <div style={{fontSize:9,color:'#6B6F85',marginTop:2}}>when shift flagged LEAD</div>
          </div>
          <div>
            <div style={{fontSize:9,letterSpacing:'.1em',color:'#6B6F85',fontWeight:700}}>MTD COST</div>
            <div style={{fontSize:20,fontWeight:800,color:'#E8890C',marginTop:2}}>${mtd.cost.toFixed(0)}</div>
            <div style={{fontSize:9,color:'#6B6F85',marginTop:2}}>{mtd.hours.toFixed(1)} hrs</div>
          </div>
        </div>

        <div style={{padding:'14px 22px'}}>
          <div style={{fontSize:10,fontWeight:800,letterSpacing:'.1em',color:'#8B8FA8',marginBottom:8}}>WEEKLY BREAKDOWN</div>
          <table style={{width:'100%',fontSize:12,borderCollapse:'collapse'}}>
            <thead>
              <tr style={{color:'#6B6F85',fontSize:10,letterSpacing:'.06em'}}>
                <th style={{textAlign:'left',padding:'6px 0',fontWeight:700}}>WEEK</th>
                <th style={{textAlign:'right',padding:'6px 6px',fontWeight:700}}>HOURS</th>
                <th style={{textAlign:'right',padding:'6px 6px',fontWeight:700}}>OT</th>
                <th style={{textAlign:'right',padding:'6px 6px',fontWeight:700}}>HOL</th>
                <th style={{textAlign:'right',padding:'6px 6px',fontWeight:700}}>LEAD</th>
                <th style={{textAlign:'right',padding:'6px 0',fontWeight:700}}>COST</th>
              </tr>
            </thead>
            <tbody>
              {weekRows.map(r=>(
                <tr key={r.wk.id} style={{borderTop:'1px solid #22253244'}}>
                  <td style={{padding:'8px 0',color:'#C8CAD6'}}>{r.wk.label}</td>
                  <td style={{padding:'8px 6px',textAlign:'right',color:'#E8EAF0',fontWeight:600}}>{r.hours>0?r.hours.toFixed(1):'—'}</td>
                  <td style={{padding:'8px 6px',textAlign:'right',color:r.otHrs>0?'#E8890C':'#6B6F85'}}>{r.otHrs>0?r.otHrs.toFixed(1):'—'}</td>
                  <td style={{padding:'8px 6px',textAlign:'right',color:r.holHrs>0?'#F87171':'#6B6F85'}}>{r.holHrs>0?r.holHrs.toFixed(1):'—'}</td>
                  <td style={{padding:'8px 6px',textAlign:'right',color:r.leadHrs>0?'#4ADE80':'#6B6F85'}}>{r.leadHrs>0?r.leadHrs.toFixed(1):'—'}</td>
                  <td style={{padding:'8px 0',textAlign:'right',color:'#E8EAF0',fontWeight:700}}>{r.cost>0?'$'+r.cost.toFixed(0):'—'}</td>
                </tr>
              ))}
              <tr style={{borderTop:'2px solid #3A3D50',background:'#1C1E26'}}>
                <td style={{padding:'10px 0',color:'#E8890C',fontWeight:800,letterSpacing:'.05em'}}>MTD TOTAL</td>
                <td style={{padding:'10px 6px',textAlign:'right',color:'#E8EAF0',fontWeight:800}}>{mtd.hours.toFixed(1)}</td>
                <td style={{padding:'10px 6px',textAlign:'right',color:mtd.otHrs>0?'#E8890C':'#6B6F85',fontWeight:800}}>{mtd.otHrs.toFixed(1)}</td>
                <td style={{padding:'10px 6px',textAlign:'right',color:mtd.holHrs>0?'#F87171':'#6B6F85',fontWeight:800}}>{mtd.holHrs.toFixed(1)}</td>
                <td style={{padding:'10px 6px',textAlign:'right',color:mtd.leadHrs>0?'#4ADE80':'#6B6F85',fontWeight:800}}>{mtd.leadHrs.toFixed(1)}</td>
                <td style={{padding:'10px 0',textAlign:'right',color:'#E8890C',fontWeight:800,fontSize:14}}>${mtd.cost.toFixed(0)}</td>
              </tr>
            </tbody>
          </table>
          <div style={{fontSize:10,color:'#6B6F85',marginTop:10,lineHeight:1.5}}>
            Rate = employee record (or dept average). <b style={{color:'#4ADE80'}}>LEAD</b> adds +$3/hr. <b style={{color:'#E8890C'}}>OT</b> multiplies by 1.5×. <b style={{color:'#F87171'}}>HOL</b> multiplies by 2×. Per-shift rate overrides take precedence.

    </>
  );
