<script>
// ─── Firebase Sync Module ──────────────────────────────────────────────────────
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyCht6CtwSPjedXPsk19XR26rasEK7ao7Sc",
    authDomain: "la-ctr-scheduling.firebaseapp.com",
    projectId: "la-ctr-scheduling",
    databaseURL: "https://la-ctr-scheduling-default-rtdb.firebaseio.com",
    storageBucket: "la-ctr-scheduling.firebasestorage.app",
    messagingSenderId: "491153441113",
    appId: "1:491153441113:web:8da848473c55c3de76cc48",
  };
  try {
    firebase.initializeApp(firebaseConfig);
  } catch (e) { console.warn('Firebase init issue:', e); }

  const CLIENT_ID = (() => {
    let id = localStorage.getItem('km_client_id');
    if (!id) { id = 'c_' + Math.random().toString(36).slice(2,10) + '_' + Date.now().toString(36); localStorage.setItem('km_client_id', id); }
    return id;
  })();

  const DOC_PATH = 'scheduling/v1';  // all shared state lives under this node
  const listeners = new Set();
  let status = 'connecting';  // 'connecting' | 'online' | 'offline' | 'error'
  let remoteSnapshot = null;
  let applyingRemote = false;
  let writeTimer = null;
  let lastPushedHash = null;

  const notify = () => listeners.forEach(fn => { try { fn({ status, remoteSnapshot, applyingRemote }); } catch(e){} });

  const setStatus = s => { if (s !== status) { status = s; notify(); } };

  const hash = obj => {
    try { const s = JSON.stringify(obj); let h=5381; for (let i=0;i<s.length;i++) h=((h<<5)+h)+s.charCodeAt(i); return h; } catch(e) { return Math.random(); }
  };

  // Auth: anonymous sign-in → then subscribe to the shared doc
  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      const ref = firebase.database().ref(DOC_PATH);
      ref.on('value', snap => {
        const val = snap.val();
        if (!val) { setStatus('online'); return; }
        // Ignore our own writes (sender matches)
        if (val._meta && val._meta.sender === CLIENT_ID && val._meta.hash === lastPushedHash) {
          setStatus('online');
          return;
        }
        remoteSnapshot = val;
        applyingRemote = true;
        notify();
        applyingRemote = false;
        setStatus('online');
      }, err => {
        console.error('Firebase read error:', err);
        setStatus('error');
      });
      // Connection status
      firebase.database().ref('.info/connected').on('value', s => {
        setStatus(s.val() ? 'online' : 'offline');
      });
    }
  });

  firebase.auth().signInAnonymously().catch(e => {
    console.error('Firebase anon auth failed:', e);
    setStatus('error');
  });

  window.KMSync = {
    CLIENT_ID,
    subscribe(fn) { listeners.add(fn); fn({ status, remoteSnapshot, applyingRemote }); return () => listeners.delete(fn); },
    push(state) {
      // Debounce — coalesce rapid edits into one write
      clearTimeout(writeTimer);
      writeTimer = setTimeout(() => {
        const h = hash(state);
        lastPushedHash = h;
        const payload = { ...state, _meta: { sender: CLIENT_ID, ts: Date.now(), hash: h } };
        firebase.database().ref(DOC_PATH).set(payload).catch(e => {
          console.error('Firebase write error:', e);
          setStatus('error');
        });
      }, 600);
    },
    get status() { return status; },
    async pushImmediate(state) {
      clearTimeout(writeTimer);
      const h = hash(state); lastPushedHash = h;
      const payload = { ...state, _meta: { sender: CLIENT_ID, ts: Date.now(), hash: h } };
      return firebase.database().ref(DOC_PATH).set(payload);
    },
  };
})();
</script>

<script type="text/babel">
const { useState, useCallback, useRef, useEffect, useMemo } = React;
const { DEPTS, COST_CENTER_MAP, mapCostCenter, DAYS, WEEK_DATES, WEEK_EVENTS,
        WEEK_START_SERIAL, AVG_RATES, STATUS_COLORS, INIT_EMPLOYEES, LABOR_DATA,
        DEPT_GROUPS, DEFAULT_BUDGET_CONFIG, MARCH_DAYS } = window;

const getDept = id => DEPTS.find(d=>d.id===id)||DEPTS[0];
const fmt$ = n => n===0?'—':'$'+Math.round(n).toLocaleString();
const fmtH = n => n===0?'—':n+'h';
// Round any displayed number to max 2 decimals (todo #43)
const r2 = n => { if (n==null || n===''||isNaN(n)) return 0; return Math.round(n*100)/100; };
const fmtHrs = n => { const v = r2(n); return v===0?'—':(v%1===0?v+'h':v.toFixed(2)+'h'); };
const fmtNum = (n, d=2) => { const v = r2(n); return v%1===0?String(v):v.toFixed(d); };

// ── Week context — consumers re-render when active week changes ──
const WeekContext = React.createContext(null);
const useWeek = () => {
  const ctx = React.useContext(WeekContext);
  return ctx || { dates: window.WEEK_DATES, events: window.WEEK_EVENTS };
};

// ── Rate helpers ──────────────────────────────────────────────────────────
// Shift tuple is [status, hours, time] with optional [flag, rateOverride].
// flag values: '' | 'OT' (1.5x) | 'HOL' (2x)
const getShiftFlag = sh => sh[3]||'';
const getShiftRateOverride = sh => (sh[4]==null||sh[4]==='')?null:parseFloat(sh[4]);
const getPosRate = (posId, tier='h8') => {
  if (!posId) return null;
  const ov = (window.__POS_RATE_OVERRIDES || {})[posId];
  if (ov && ov[tier]!=null) return parseFloat(ov[tier]);
  const p = (window.POSITIONS || []).find(pp=>pp.id===posId);
  if (p) return p[tier];
  return null;
};
const getEmpRate = (emp, hrs) => {
  if (emp.rate!=null && emp.rate!=='') return parseFloat(emp.rate);
  if (emp.positionId) {
    // Tier by shift length: <5h → h4, 5–7h → h6, 8h+ → h8.
    // When `hrs` isn't passed (display contexts), fall back to h8 as the canonical "rack" rate.
    const tier = hrs==null ? 'h8' : (hrs >= 8 ? 'h8' : hrs >= 5 ? 'h6' : 'h4');
    const r = getPosRate(emp.positionId, tier);
    if (r!=null) return r;
    // Fallback if that specific tier isn't set: try h8 → h6 → h4
    for (const t of ['h8','h6','h4']) {
      const r2 = getPosRate(emp.positionId, t);
      if (r2!=null) return r2;
    }
  }
  return (AVG_RATES[emp.dept]||30);
};
const getShiftCost = (emp, sh, date) => {
  const hrs = sh[1]||0; if(!hrs) return 0;
  // Rate priority: per-shift override (sh[4]) > tag rate (sh[6]) > position rate.
  const tagRate = sh[6] ? getTagRate(sh[6]) : null;
  const base = getShiftRateOverride(sh) ?? tagRate ?? getEmpRate(emp, hrs);
  // Auto-holiday: shift's date is in window.__HOLIDAY_DATES (set from Budget tab),
  // OR the user manually flagged the shift as 'HOL', OR the shift code itself is 'H' (Holiday).
  const isHolDate = !!(date && window.__HOLIDAY_DATES && window.__HOLIDAY_DATES.has(date));
  const isHolFlag = sh[3]==='HOL' || sh[0]==='H';
  const mult = sh[3]==='OT' ? 1.5 : (isHolFlag || isHolDate) ? 2.0 : 1.0;
  return hrs * base * mult;
};
const getEmpWeeklyCost = (emp, weekDates) => emp.shifts.reduce((s,sh,di)=>{
  const wd = weekDates?.[di];
  // weekDates entries are [['M/D','Mon D'], ...] tuples; or plain "M/D" strings.
  const dateStr = Array.isArray(wd) ? wd[0] : wd;
  return s + getShiftCost(emp, sh, dateStr);
},0);
// Shift dept override: sh[5] = dept id string, or null = use emp's primary dept
const getShiftDept = (emp, sh) => sh[5] || emp.dept;
const getShiftDeptOv = sh => sh[5] || null;

// Parse "5A", "5:30A", "12P", "5", "5:30" → minutes since midnight (or null)
const parseTimeToken = (s) => {
  if (!s) return null;
  s = s.trim().toUpperCase().replace(/\s+/g,'');
  const m = s.match(/^(\d{1,2})(?::(\d{1,2}))?\s*([AP])?M?$/);
  if (!m) return null;
  let h = parseInt(m[1],10);
  const min = m[2] ? parseInt(m[2],10) : 0;
  const ap = m[3];
  if (h<0 || h>23 || min<0 || min>59) return null;
  if (ap === 'A') { if (h===12) h=0; }
  else if (ap === 'P') { if (h<12) h+=12; }
  // No A/P: leave as 24h interpretation
  return h*60 + min;
};
// minutes since midnight → "5A", "5:30A", "12P", "1:30P"
const fmtTimeFromMin = (mins) => {
  let h = Math.floor(mins/60) % 24;
  const m = mins % 60;
  const ap = h<12 ? 'A' : 'P';
  let h12 = h%12; if (h12===0) h12=12;
  return `${h12}${m?':'+String(m).padStart(2,'0'):''}${ap}`;
};
// "5A" + 8h → "5A–1P"; "5:30A" + 8h → "5:30A–1:30P"
const autoFillEndTime = (timeStr, hrs) => {
  if (!timeStr || !hrs || hrs<=0) return null;
  // If user already entered a range (contains dash), don't overwrite
  if (/[-–—]/.test(timeStr)) return null;
  const startMin = parseTimeToken(timeStr);
  if (startMin == null) return null;
  const endMin = startMin + Math.round(hrs*60);
  return `${fmtTimeFromMin(startMin)}–${fmtTimeFromMin(endMin)}`;
};

// "8A–3P" → 7 (hours). Single token → null. Handles overnight wrap.
const rangeToHours = (rangeStr) => {
  if (!rangeStr) return null;
  const parts = String(rangeStr).split(/[-–—]/).map(s=>s.trim()).filter(Boolean);
  if (parts.length < 2) return null;
  const a = parseTimeToken(parts[0]); let b = parseTimeToken(parts[1]);
  if (a==null || b==null) return null;
  if (b <= a) b += 24*60;
  return Math.round(((b-a)/60)*100)/100;
};
// Build a "8A–3P" style label from two tokens
const joinRange = (s,e) => {
  const a=parseTimeToken(s), b=parseTimeToken(e);
  if (a==null||b==null) return (s||'')+(e?('–'+e):'');
  return `${fmtTimeFromMin(a)}–${fmtTimeFromMin(b)}`;
};

// ─── CellPopup ────────────────────────────────────────────────────────────────
function CellPopup({ emp, dayIdx, onSave, onClose }) {
  const { dates: WEEK_DATES, events: WEEK_EVENTS_CTX } = useWeek();
  const WEEK_EVENTS = WEEK_EVENTS_CTX;
  const shift = emp.shifts[dayIdx];
  const [status, setStatus] = useState(shift[0]);
  const [hours, setHours]   = useState(shift[1]||'');
  const [time, setTime]     = useState(shift[2]||'');
  const [flag, setFlag]     = useState(shift[3]||'');
  const [rateOv, setRateOv] = useState(shift[4]==null?'':shift[4]);
  const [deptOv, setDeptOv] = useState(shift[5]||'');
  const [tag, setTag]       = useState(shift[6]||'');     // Shift tag: TRAIN | SETUP | ''
  const [note, setNote]     = useState(shift[7]||'');     // Free-text comment
  const presets = ['OFF','CANCEL','PASS','AVAIL'];
  const liveHrs = parseFloat(hours)||0;
  const baseRate = getEmpRate(emp, liveHrs || null);
  // Rate priority for the popup preview must mirror getShiftCost():
  //   per-shift override (rateOv) > tag rate > position rate
  const tagRate = tag ? getTagRate(tag) : null;
  const preMultRate = rateOv!=='' ? parseFloat(rateOv) : (tagRate!=null ? tagRate : baseRate);
  const effRate = preMultRate * (flag==='OT'?1.5:flag==='HOL'?2.0:1.0);
  const cost = liveHrs * effRate;
  const save = () => {
    const tuple = [status, parseFloat(hours)||0, time];
    const hasAny = flag || rateOv!=='' || deptOv || tag || note;
    if (hasAny) {
      tuple[3] = flag || '';
      tuple[4] = rateOv===''?null:parseFloat(rateOv);
      tuple[5] = deptOv || null;
      tuple[6] = tag || '';
      tuple[7] = note || '';
    }
    onSave(emp.id, dayIdx, tuple); onClose();
  };
  return (
    <>
      <div className="cell-edit-overlay" onClick={onClose}/>
      <div className="cell-edit-popup" style={{top:20,bottom:20,left:'50%',transform:'translateX(-50%)',height:'fit-content',maxHeight:'calc(100vh - 40px)'}}>
        <div className="popup-title">{emp.name} — {DAYS[dayIdx]} {WEEK_DATES[dayIdx][0]}</div>
        <div className="popup-presets">
          {presets.map(p=><button key={p} className={`preset-btn${status===p?' sel':''}`} onClick={()=>setStatus(p)}>{p}</button>)}
        </div>
        <div className="popup-row">
          <label className="popup-label">Hours</label>
          <input className="popup-input" type="number" min="0" max="24" step=".5" value={hours}
            onChange={e=>setHours(e.target.value)}
            onBlur={e=>{
              const filled = autoFillEndTime(time, parseFloat(e.target.value)||0);
              if (filled) setTime(filled);
            }}
            placeholder="0"/>
        </div>
        <div className="popup-row">
          <label className="popup-label">Shift Time</label>
          <input className="popup-input" type="text" value={time}
            onChange={e=>setTime(e.target.value)}
            onBlur={e=>{
              const filled = autoFillEndTime(e.target.value, parseFloat(hours)||0);
              if (filled) setTime(filled);
            }}
            placeholder="e.g. 5A (auto-fills to 5A–1P at 8h)"/>
        </div>
        <div style={{borderTop:'1px solid #2A2D3A',margin:'4px 0',paddingTop:8}}>
          <div style={{fontSize:10,fontWeight:700,color:'#6B6F85',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>Rate Flags</div>
          <div className="popup-presets" style={{marginBottom:8}}>
            {[['','Regular'],['OT','Overtime (1.5×)'],['HOL','Holiday (2×)']].map(([val,lbl])=>(
              <button key={val} className={`preset-btn${flag===val?' sel':''}`} style={flag===val&&val==='OT'?{background:'#E8890C33',color:'#E8890C',borderColor:'#E8890C'}:flag===val&&val==='HOL'?{background:'#DC262633',color:'#F87171',borderColor:'#DC2626'}:{}} onClick={()=>setFlag(val)}>{lbl}</button>
            ))}
          </div>
          <div className="popup-row">
            <label className="popup-label">Rate Override</label>
            <input className="popup-input" type="number" min="0" step=".25" value={rateOv} onChange={e=>setRateOv(e.target.value)} placeholder={`Default: $${baseRate.toFixed(2)}/hr`}/>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',padding:'4px 2px',fontSize:11,color:'#6B6F85'}}>
            <span>Effective rate: <strong style={{color:flag==='OT'?'#E8890C':flag==='HOL'?'#F87171':'#E8EAF0'}}>${effRate.toFixed(2)}/hr</strong></span>
            <span>Cost: <strong style={{color:'#E8EAF0'}}>{cost>0?fmt$(cost):'—'}</strong></span>
          </div>
        </div>
        <div style={{borderTop:'1px solid #2A2D3A',margin:'4px 0',paddingTop:8}}>
          <div style={{fontSize:10,fontWeight:700,color:'#6B6F85',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>Shift Tag</div>
          <div className="popup-presets" style={{marginBottom:8,gap:4}}>
            <button key="none" className={`preset-btn${!tag?' sel':''}`} onClick={()=>setTag('')}>None</button>
            {(window.SHIFT_TAGS||SHIFT_TAGS).filter(t => {
              // Derive position from emp.role (employees don't carry a positionId — role is free-text from the CSV).
              const role = emp.role || '';
              const pos = (window.POSITIONS||[]).find(p => {
                const lab = (p.label||'').toLowerCase();
                return role.toLowerCase().includes(lab) || lab.includes(role.toLowerCase().split(/\s+/)[0]);
              }) || { label: role };
              try { return t.appliesTo(emp, pos); } catch(e) { return false; }
            }).map(t => {
              const sel = tag === t.id;
              const tagR = getTagRate(t.id);
              const title = tagR!=null ? `${t.label} — pays $${tagR.toFixed(2)}/hr` : `${t.label} — visual flag only`;
              return (
                <button key={t.id} className={`preset-btn${sel?' sel':''}`} title={title}
                  style={sel?{background:t.color+'33',color:t.color,borderColor:t.color}:{}}
                  onClick={()=>setTag(t.id)}>
                  {t.label}{tagR!=null && <span style={{marginLeft:4,opacity:.7,fontSize:9}}>${tagR.toFixed(0)}</span>}
                </button>
              );
            })}
          </div>
        </div>
        <div style={{borderTop:'1px solid #2A2D3A',margin:'4px 0',paddingTop:8}}>
          <div style={{fontSize:10,fontWeight:700,color:'#6B6F85',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>Comments</div>
          <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Notes about this shift (e.g. shadowing John, covering banquet setup, etc.)" rows={2} style={{width:'100%',background:'#1C1E26',border:'1px solid #2A2D3A',borderRadius:5,padding:'7px 9px',color:'#C8CAD6',fontSize:11,outline:'none',resize:'vertical',fontFamily:'inherit',lineHeight:1.4,boxSizing:'border-box'}} onFocus={e=>e.target.style.borderColor='#E8890C66'} onBlur={e=>e.target.style.borderColor='#2A2D3A'}/>
        </div>
        <div style={{display:'flex',gap:6,marginBottom:6}}>
          <button
            className="preset-btn"
            style={{flex:1,padding:'6px 8px',fontSize:11}}
            title="Copy this shift to clipboard"
            onClick={()=>{
              const tuple = [status, parseFloat(hours)||0, time];
              tuple[3]=flag||''; tuple[4]=rateOv===''?null:parseFloat(rateOv); tuple[5]=null; tuple[6]=tag||''; tuple[7]=note||'';
              window.__SHIFT_CLIPBOARD = tuple;
              // Force re-render of paste button — bump a tick on window
              window.dispatchEvent(new Event('shift-clipboard-change'));
            }}
          >⎘ Copy</button>
          <button
            className="preset-btn"
            style={{flex:1,padding:'6px 8px',fontSize:11,opacity: window.__SHIFT_CLIPBOARD ? 1 : 0.4}}
            title={window.__SHIFT_CLIPBOARD ? 'Paste shift from clipboard' : 'Nothing copied yet'}
            disabled={!window.__SHIFT_CLIPBOARD}
            onClick={()=>{
              const c = window.__SHIFT_CLIPBOARD; if (!c) return;
              setStatus(c[0]||''); setHours(c[1]||0); setTime(c[2]||'');
              setFlag(c[3]||''); setRateOv(c[4]==null?'':c[4]);
              setTag(c[6]||''); setNote(c[7]||'');
            }}
          >📋 Paste</button>
        </div>
        <div className="popup-actions">
          <button className="popup-cancel" onClick={onClose}>Cancel</button>
          <button className="popup-save" onClick={save}>Save</button>
        </div>
      </div>
    </>
  );
}

// ─── LaborPanel ───────────────────────────────────────────────────────────────
function LaborPanel({ employees, canonEmployees, weekShifts, monthData, laborData, actuals, budgetCfg, sales }) {
  const { dates: WEEK_DATES, events: WEEK_EVENTS_CTX } = useWeek();
  const WEEK_EVENTS = WEEK_EVENTS_CTX;
  const actualHrsByDept = useMemo(()=>{
    const m={};
    employees.forEach(e=>{ const h=e.shifts.reduce((s,sh)=>s+(sh[1]||0),0); m[e.dept]=(m[e.dept]||0)+h; });
    return m;
  },[employees]);
  // LIVE per-dept FORECAST = sum of scheduled labor cost across the WHOLE month, per dept.
  const liveDeptForecast = useMemo(()=>{
    const m = {};
    if (!monthData || !weekShifts || !canonEmployees) return m;
    const AM = window.ACTIVE_MONTH || {month:3};
    monthData.weeks.forEach(wk => {
      const wkSh = weekShifts[wk.id] || {};
      canonEmployees.forEach(emp => {
        const shifts = wkSh[emp.id]; if (!shifts) return;
        shifts.forEach((sh, di) => {
          if (!sh) return;
          const monthDay = wk.dayIdx[di]; if (monthDay==null) return;
          const dId = sh[5] || emp.dept;
          m[dId] = (m[dId]||0) + getShiftCost(emp, sh, `${AM.month}/${monthDay}`);
        });
      });
    });
    return m;
  }, [canonEmployees, weekShifts, monthData]);
  // LIVE per-dept budgets from the Budget tab — same math BudgetView/DecBalView use.
  // Falls back to laborData.budget if Budget tab hasn't been touched (sales empty, etc).
  const liveDeptBudgets = useMemo(()=>{
    try {
      const days = window.MARCH_DAYS || [];
      if (!budgetCfg || !sales || !days.length) return {};
      const { deptBudgets } = computeBudgetData(budgetCfg, sales, days);
      return deptBudgets || {};
    } catch (e) { return {}; }
  },[budgetCfg, sales]);
  return (
    <div className="labor-panel">
      <div className="lp-header"><div className="lp-title">Labor Budget — {window.ACTIVE_MONTH_LABEL||'March 2026'}</div><div className="lp-subtitle">Forecast vs. Actual by Department</div></div>
      <div className="lp-body">
        {laborData.map(ld=>{
          const dept=getDept(ld.dept); const aHrs=actualHrsByDept[ld.dept]||0;
          const rate=AVG_RATES[ld.dept]||30; const fcstWk=aHrs*rate;
          const actAmt=actuals?.[ld.dept]?.total||0;
          // Prefer LIVE budget from Budget tab; fall back to static laborData budget.
          const liveB = liveDeptBudgets[ld.dept] || 0;
          const budget = liveB > 0 ? liveB : (ld.budget || 0);
          // LIVE FORECAST = sum of scheduled labor cost for this dept across the month.
          // Falls back to static seed only if NOTHING is scheduled (so first-load isn't all dashes).
          const liveF = liveDeptForecast[ld.dept] || 0;
          const fcst = liveF;  // 0 means nothing scheduled — show as em-dash below
          const base=Math.max(budget,fcst,actAmt,1);
          const balance=budget?(budget-actAmt):(fcst-actAmt);
          return (
            <div className="lp-dept-row" key={ld.dept}>
              <div className="lp-dept-header">
                <div className="lp-dept-dot" style={{background:dept.color}}/>
                <span className="lp-dept-name" style={{color:dept.color}}>{dept.label}</span>
                <span className="lp-dept-hrs">{aHrs}h</span>
              </div>
              {budget>0 && <div className="lp-bar-row">
                <span className="lp-bar-label">Budget</span>
                <div className="lp-bar-track"><div className="lp-bar-fill" style={{width:`${Math.min(100,budget/base*100)}%`,background:'#4A4D60'}}/></div>
                <span className="lp-bar-val" style={{color:'#6B6F85'}}>{fmt$(budget)}</span>
              </div>}
              <div className="lp-bar-row">
                <span className="lp-bar-label">Forecast</span>
                <div className="lp-bar-track"><div className="lp-bar-fill" style={{width:`${Math.min(100,fcst/base*100)}%`,background:dept.color+'99'}}/></div>
                <span className="lp-bar-val" style={{color:dept.color}}>{fcst>0?fmt$(fcst):'—'}</span>
              </div>
              <div className="lp-bar-row">
                <span className="lp-bar-label">Actual</span>
                <div className="lp-bar-track"><div className="lp-bar-fill" style={{width:`${Math.min(100,actAmt/base*100)}%`,background:dept.color}}/></div>
                <span className="lp-bar-val" style={{color:'#E8EAF0'}}>{actAmt>0?fmt$(actAmt):'—'}</span>
              </div>
              <div className="lp-balance">
                <span className="lp-balance-label">{budget?'Remaining Budget':'vs Forecast'}</span>
                <span className={`lp-balance-val ${balance>=0?'pos':'neg'}`}>{balance>=0?'+':''}{fmt$(Math.abs(balance))}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const getShiftTag = id => (window.SHIFT_TAGS||SHIFT_TAGS).find(t=>t.id===id) || null;
// Effective rate for a tag, honoring user override from budgetCfg.tagRates.
const getTagRate = (tagId) => {
  const tag = getShiftTag(tagId); if (!tag || tag.defaultRate==null) return null;
  const ov = (window.__TAG_RATE_OVERRIDES||{})[tagId];
  return ov!=null ? parseFloat(ov) : tag.defaultRate;
};

function classifyJobRole(emp){
  if (emp.kind==='supervisor') return 'supervisor';
  if (emp.kind==='temp') return 'temp';
  // Auto-detect supervisors by role name (permanent employees added via People tab)
  // NOTE: "Lead" / "Captain" are NOT supervisors — they're working roles. Only true supv titles count.
  if (emp.role && /\b(manager|director|sous|exec\s*chef|head\s*chef|supervisor|supv)\b/i.test(emp.role)) {
    return 'supervisor';
  }
  // PRIMARY: classify by positionId against the live window.POSITIONS list (= Budget tab).
  // This way the Schedule grid mirrors the Budget exactly — employees go into the bucket
  // for their assigned position; if their position was deleted, they fall through to OTHER.
  if (emp.positionId) {
    const pos = (window.POSITIONS||[]).find(p => p.id === emp.positionId);
    if (pos) return pos.id;
  }
  // FALLBACK: legacy employees without positionId — try matching by role-text against
  // window.POSITIONS labels in the same dept, so they bucket into the right Budget row.
  if (emp.role) {
    const roleL = emp.role.toLowerCase().trim();
    const sameDept = (window.POSITIONS||[]).filter(p => p.dept === emp.dept);
    const labelMatch = sameDept.find(p => (p.label||'').toLowerCase().trim() === roleL);
    if (labelMatch) return labelMatch.id;
  }
  if (emp.jobRole) {
    // Only honor jobRole if it's still a live position in the same dept
    const stillExists = (window.POSITIONS||[]).some(p => p.id === emp.jobRole && p.dept === emp.dept);
    if (stillExists) return emp.jobRole;
  }
  return 'other';
}

function AddSpecialRow({ dept, kind, onAdd }) {
  const [name, setName] = useState('');
  const label = kind==='supervisor' ? 'supervisor' : 'temp labor';
  const submit = () => {

    onAdd && onAdd(dept.id, kind, n);
    setName('');

  return (

      <td colSpan={9} style={{padding:'4px 14px 6px 30px',background:'#16181F',borderBottom:'1px dashed #2A2D3A'}}>

// ─── Mass Assign Modal ────────────────────────────────────────────────────────
// Pick a department + one or more positions, set a single time range, choose which
// days, and stamp the same shift onto everyone at once. Mirrors the Excel "bring the
// whole crew in" workflow. Skips people who already have a shift (unless overwrite).
function MassAssignModal({ employees, defaultDept, weekDates, weekLabel, onApply, onClose }) {
  const firstDept = (defaultDept && defaultDept!=='all') ? defaultDept : DEPTS[0].id;
  const [dept, setDept] = useState(firstDept);
  const deptPositions = useMemo(()=>(window.POSITIONS||[]).filter(p=>p.dept===dept), [dept]);
  const posMatch = (emp, p) => {
    const labelL = (p.label||'').toLowerCase().trim();
    return emp && (emp.positionId===p.id || (!emp.positionId && (emp.role||'').toLowerCase().trim()===labelL)
      || (emp.role||'').toLowerCase().includes(labelL));
  };
  const [selPos, setSelPos] = useState(()=>new Set());
  const [excluded, setExcluded] = useState(()=>new Set()); // emp ids manually unchecked
  const [status, setStatus] = useState('');

  const [end, setEnd] = useState('3P');
  const liveHrs = rangeToHours(joinRange(start,end));
  const [hoursOv, setHoursOv] = useState('');
  const effHrs = hoursOv!=='' ? (parseFloat(hoursOv)||0) : (liveHrs||0);
  const [days, setDays] = useState(()=>[true,true,true,true,true,true,true]);
  const [overwrite, setOverwrite] = useState(false);

  // Reset position/exclusion selection when dept changes
  useEffect(()=>{ setSelPos(new Set()); setExcluded(new Set()); }, [dept]);

  // Employees matching any selected position, in this dept
  const matchedEmps = useMemo(()=>{
    if (selPos.size===0) return [];
    return employees.filter(e => e.dept===dept && deptPositions.some(p => selPos.has(p.id) && posMatch(e,p)));
  }, [employees, dept, deptPositions, selPos]);
  const targetEmps = matchedEmps.filter(e=>!excluded.has(e.id));
  const selDayIdx = days.map((on,i)=>on?i:-1).filter(i=>i>=0);

  // Counts
  let willAssign=0, willSkip=0;
  targetEmps.forEach(e=>{
    selDayIdx.forEach(di=>{
      const sh = e.shifts[di]||['',0,''];
      const has = (sh[1]||0)>0 || (sh[0]&&sh[0]!=='');
      if (has && !overwrite) willSkip++; else willAssign++;
    });
  });

  const timeLabel = joinRange(start,end);
  const apply = () => {
    targetEmps.forEach(e=>{
      selDayIdx.forEach(di=>{
        const sh = e.shifts[di]||['',0,''];
        const has = (sh[1]||0)>0 || (sh[0]&&sh[0]!=='');
        if (has && !overwrite) return;
        const tuple = [status||'', status==='OFF'||status==='CANCEL'||status==='PASS'||status==='AVAIL' ? 0 : effHrs, status==='OFF'||status==='CANCEL'||status==='PASS'||status==='AVAIL' ? '' : timeLabel];
        onApply(e.id, di, tuple);
      });
    });
    onClose();
  };

  const togglePos = (id) => setSelPos(prev=>{ const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; });
  const allPos = () => setSelPos(prev=> prev.size===deptPositions.length ? new Set() : new Set(deptPositions.map(p=>p.id)));
  const dObj = getDept(dept);
  const isMarker = ['OFF','CANCEL','PASS','AVAIL'].includes(status);

  return (

      <div className="cell-edit-popup" style={{zIndex:501,width:560,maxWidth:'calc(100vw - 40px)',top:24,left:'50%',transform:'translateX(-50%)',height:'fit-content'}}>

        </div>

        {/* Dept + positions */}
        <div style={{display:'flex',gap:14}}>
          <div style={{flex:'0 0 180px'}}>
            <div style={{fontSize:10,fontWeight:700,color:'#6B6F85',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>Department</div>

              {DEPTS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
            </select>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
              <span style={{fontSize:10,fontWeight:700,color:'#6B6F85',textTransform:'uppercase',letterSpacing:'.06em'}}>Positions</span>
              <button className="preset-btn" style={{padding:'2px 7px',fontSize:10}} onClick={allPos}>{selPos.size===deptPositions.length?'Clear':'All'}</button>
            </div>
            <div style={{maxHeight:150,overflowY:'auto',border:'1px solid #2A2D3A',borderRadius:6,padding:4}}>
              {deptPositions.length===0 && <div style={{fontSize:11,color:'#6B6F85',padding:6}}>No positions for this dept.</div>}
              {deptPositions.map(p=>{
                const n = employees.filter(e=>e.dept===dept && posMatch(e,p)).length;
                const on = selPos.has(p.id);
                return (
                  <div key={p.id} onClick={()=>togglePos(p.id)} style={{display:'flex',alignItems:'center',gap:7,padding:'4px 6px',borderRadius:4,cursor:'pointer',background:on?dObj.color+'18':'transparent'}}>
                    <span style={{width:13,height:13,borderRadius:3,border:'1.5px solid '+(on?dObj.color:'#3A3D50'),background:on?dObj.color:'transparent',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'#13151C',fontWeight:900}}>{on?'✓':''}</span>
                    <span style={{flex:1,fontSize:11,fontWeight:600,color:on?'#E8EAF0':'#C8CAD6'}}>{p.label}</span>
                    <span style={{fontSize:10,color:'#6B6F85'}}>{n}</span>

            </div>
          </div>

          {/* Shift settings */}
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:10,fontWeight:700,color:'#6B6F85',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>Shift</div>
            <div className="popup-presets" style={{marginBottom:8}}>
              {[['','Scheduled'],['OFF','OFF'],['CANCEL','Cancel'],['PASS','Pass']].map(([v,l])=>(
                <button key={v||'sched'} className={`preset-btn${status===v?' sel':''}`} onClick={()=>setStatus(v)}>{l}</button>
              ))}
            </div>
            {!isMarker && <>
              <div style={{display:'flex',gap:8,marginBottom:8}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:9,color:'#6B6F85',marginBottom:3}}>Start</div>
                  <input value={start} onChange={e=>setStart(e.target.value)} placeholder="8A" style={inpS}/>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:9,color:'#6B6F85',marginBottom:3}}>End</div>
                  <input value={end} onChange={e=>setEnd(e.target.value)} placeholder="3P" style={inpS}/>
                </div>
                <div style={{flex:'0 0 76px'}}>
                  <div style={{fontSize:9,color:'#6B6F85',marginBottom:3}}>Hours</div>
                  <input value={hoursOv} onChange={e=>setHoursOv(e.target.value)} placeholder={String(liveHrs??0)} style={inpS}/>
                </div>
              </div>
              <div style={{fontSize:11,color:'#8B8FA8',marginBottom:10}}>
                {timeLabel ? <>Will set <b style={{color:'#E8890C'}}>{timeLabel}</b> · <b style={{color:'#E8EAF0'}}>{effHrs}h</b> per person</> : 'Enter a start & end time'}
              </div>
            </>}

            <div style={{fontSize:10,fontWeight:700,color:'#6B6F85',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>Days</div>
            <div style={{display:'flex',gap:4,marginBottom:6}}>
              {DAYS.map((d,i)=>(
                <button key={d} onClick={()=>setDays(prev=>prev.map((v,j)=>j===i?!v:v))} title={weekDates[i]?.[1]||''}
                  style={{flex:1,padding:'6px 2px',borderRadius:5,fontSize:10,fontWeight:700,cursor:'pointer',border:'1px solid '+(days[i]?'#E8890C':'#3A3D50'),background:days[i]?'#E8890C22':'#1C1E26',color:days[i]?'#E8890C':'#6B6F85'}}>
                  {d}<div style={{fontSize:8,fontWeight:600,opacity:.8}}>{weekDates[i]?.[0]}</div>
                </button>
              ))}
            </div>
            <div style={{display:'flex',gap:6,marginBottom:10}}>
              <button className="preset-btn" style={{padding:'3px 8px',fontSize:10}} onClick={()=>setDays([true,true,true,true,true,true,true])}>Whole week</button>
              <button className="preset-btn" style={{padding:'3px 8px',fontSize:10}} onClick={()=>setDays([true,true,true,true,true,false,false])}>Mon–Fri</button>
              <button className="preset-btn" style={{padding:'3px 8px',fontSize:10}} onClick={()=>setDays([false,false,false,false,false,true,true])}>Weekend</button>
            </div>

            <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:11,color:'#C8CAD6',marginBottom:4}}>
              <span onClick={()=>setOverwrite(v=>!v)} style={{width:14,height:14,borderRadius:3,border:'1.5px solid '+(overwrite?'#F87171':'#3A3D50'),background:overwrite?'#F87171':'transparent',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'#13151C',fontWeight:900}}>{overwrite?'✓':''}</span>

          <div style={{marginTop:12,borderTop:'1px solid #2A2D3A',paddingTop:10}}>

          </div>
