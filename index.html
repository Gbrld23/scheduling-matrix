// ─── Variance Analysis View ────────────────────────────────────────────────
// Compare per-employee, per-day SCHEDULED hours+cost vs ACTUAL (from One & Done imports).
// Three sub-tabs: Day×Dept matrix, Employee×Day grid, and exception list.
function VarianceView({ employees, weekShifts, actuals, monthData, budgetCfg, onJumpToSchedule }) {
  const { MARCH_DAYS } = window;
  const AM = window.ACTIVE_MONTH || {year:2026, month:3};
  const monthLabel = window.ACTIVE_MONTH_LABEL || 'This Month';
  const [subTab, setSubTab] = useState('matrix');
  const [hrThresh, setHrThresh] = useState(1);     // hours threshold to flag
  const [$Thresh,  set$Thresh]  = useState(50);    // $ threshold to flag
  const [drillKey, setDrillKey] = useState(null);  // 'monthDay|deptId' for matrix drill
  const [selDept,  setSelDept]  = useState('all'); // employee tab + exceptions filter

  // ── Name normalization (Last,First ↔ First Last + punctuation/case) ──
  const normName = (raw) => {
    if (!raw) return '';
    let s = String(raw).toLowerCase().replace(/\./g,'').replace(/\s+/g,' ').trim();
    if (s.includes(',')) {
      const [last, first] = s.split(',').map(x=>x.trim());
      s = `${first||''} ${last||''}`.trim();
    }
    return s.replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
  };

  // ── Build per-employee per-day SCHEDULE for the whole month ──
  const byEmpDay = useMemo(() => {
    // Map: empNorm -> { emp, days: { monthDay: { schedHrs, schedCost, schedDept, actHrs, actAmt, actDepts:Set, records:[] } } }
    const map = new Map();
    const ensure = (key, emp) => { if (!map.has(key)) map.set(key, { emp, key, days:{} }); return map.get(key); };
    const ensureDay = (rec, md) => { if (!rec.days[md]) rec.days[md] = { schedHrs:0, schedCost:0, schedDept:null, actHrs:0, actAmt:0, actDepts:new Set(), records:[] }; return rec.days[md]; };

    // 1) SCHEDULED — iterate every employee × every week × every day
    (employees||[]).forEach(emp => {
      const key = normName(emp.name);
      if (!key) return;
      const empRec = ensure(key, emp);
      (monthData?.weeks||[]).forEach(wk => {
        const wkSh = (weekShifts||{})[wk.id] || {};
        const shifts = wkSh[emp.id];
        if (!shifts) return;
        shifts.forEach((sh, di) => {
          const md = wk.dayIdx[di];
          if (md == null) return;
          const hrs = sh[1] || 0;
          if (hrs <= 0) return;
          const d = ensureDay(empRec, md);
          d.schedHrs += hrs;
          // M/D date string used by __HOLIDAY_DATES — matches MARCH_DAYS format.
          const AM = window.ACTIVE_MONTH || {month:3};
          const dateStr = `${AM.month}/${md}`;
          d.schedCost += getShiftCost(emp, sh, dateStr);
          d.schedDept = sh[5] || emp.dept;
        });
      });
    });

    // 2) ACTUAL — from imported records
    const recs = (actuals?._records) || [];
    recs.forEach(r => {
      if (r.monthDay == null) return;
      const key = normName(r.name);
      if (!key) return;
      // Match to roster employee, or create a stub for unmatched
      let empRec = map.get(key);
      if (!empRec) {
        empRec = ensure(key, { id:`__ext_${key}`, name:r.name, dept:r.dept, role:r.wd||'(unmatched)', __unmatched:true });
      }
      const d = ensureDay(empRec, r.monthDay);
      d.actHrs += r.hours || 0;
      d.actAmt += r.amount || 0;
      if (r.dept) d.actDepts.add(r.dept);
      d.records.push(r);
    });

    return map;
  }, [employees, weekShifts, actuals, monthData]);

  // ── Per-employee per-week totals (for OT >40) ──
  const empWeekHrs = useMemo(() => {
    const out = new Map(); // key -> { wkId -> actHrs }
    (monthData?.weeks||[]).forEach(wk => {
      byEmpDay.forEach((rec, key) => {
        let wkActHrs = 0;
        wk.dayIdx.forEach(md => { if (md!=null && rec.days[md]) wkActHrs += rec.days[md].actHrs; });
        if (!out.has(key)) out.set(key, {});
        out.get(key)[wk.id] = wkActHrs;
      });
    });
    return out;
  }, [byEmpDay, monthData]);

  // ── Per-day flat exception list (every employee×day with non-zero variance OR flag) ──
  const allRows = useMemo(() => {
    const rows = [];
    byEmpDay.forEach((rec, key) => {
      Object.entries(rec.days).forEach(([mdStr, d]) => {
        const md = parseInt(mdStr);
        const dHrs = d.actHrs - d.schedHrs;
        const d$  = d.actAmt - d.schedCost;
        if (d.schedHrs===0 && d.actHrs===0) return;
        const flags = [];
        if (d.schedHrs===0 && d.actHrs>0)  flags.push('UNSCHED');
        if (d.schedHrs>0  && d.actHrs===0) flags.push('NOSHOW');
        if (d.actHrs > 8) flags.push('OT-DAY');
        // OT-week — check this employee's week total
        const wk = (monthData?.weeks||[]).find(w => w.dayIdx.includes(md));
        if (wk) {
          const wkHrs = (empWeekHrs.get(key)||{})[wk.id] || 0;
          if (wkHrs > 40 && d.actHrs>0) flags.push('OT-WK');
        }
        // Cross-dept movement
        const actDept = d.actDepts.size===1 ? [...d.actDepts][0] : null;
        const crossDept = (d.schedDept && actDept && d.schedDept !== actDept);
        if (crossDept) flags.push('CROSS');
        rows.push({
          key, emp: rec.emp, monthDay: md, schedHrs:d.schedHrs, schedCost:d.schedCost, actHrs:d.actHrs, actAmt:d.actAmt,
          dHrs, d$, schedDept: d.schedDept, actDept, crossDept, flags, unmatched: !!rec.emp.__unmatched, records:d.records,
        });
      });
    });
    rows.sort((a,b)=> a.monthDay - b.monthDay || (Math.abs(b.d$) - Math.abs(a.d$)));
    return rows;
  }, [byEmpDay, empWeekHrs, monthData]);

  const meaningful = (r) => Math.abs(r.dHrs) >= hrThresh || Math.abs(r.d$) >= $Thresh || r.flags.length > 0;

  // ── Day × Department matrix ──
  const matrixData = useMemo(() => {
    // For each day, for each dept, sum sched$ + act$ + flag count.
    const monthDays = (MARCH_DAYS||[]).map(d => parseInt(String(d.date).split('/')[1]));
    const out = monthDays.map(md => {
      const day = MARCH_DAYS.find(x => parseInt(String(x.date).split('/')[1])===md);
      const cells = {};
      DEPTS.forEach(dept => { cells[dept.id] = { schedCost:0, actAmt:0, schedHrs:0, actHrs:0, flagCount:0, otDay:0, unsched:0, cross:0 }; });
      allRows.filter(r => r.monthDay===md).forEach(r => {
        // Attribute to scheduled dept (primary) AND actual dept if different (will surface as CROSS)
        const dId = r.schedDept || r.actDept;
        if (dId && cells[dId]) {
          cells[dId].schedCost += r.schedCost;
          cells[dId].actAmt   += r.actAmt;
          cells[dId].schedHrs += r.schedHrs;
          cells[dId].actHrs   += r.actHrs;
          if (r.flags.length) cells[dId].flagCount++;
          if (r.flags.includes('OT-DAY')) cells[dId].otDay++;
          if (r.flags.includes('UNSCHED')) cells[dId].unsched++;
          if (r.crossDept) cells[dId].cross++;
        }
      });
      return { monthDay: md, day, cells };
    });
    return out;
  }, [allRows, MARCH_DAYS]);

  const fmtSigned$ = v => (v>=0?'+':'') + fmt$(Math.abs(v)).replace('$','') ; // rendered with $ separately
  const flagColor = f => f==='UNSCHED'?'#FBBF24' : f==='NOSHOW'?'#F87171' : f==='OT-DAY'||f==='OT-WK'?'#A78BFA' : f==='CROSS'?'#60A5FA' : '#8B8FA8';

  // ── Render ──
  const totalAct = allRows.reduce((s,r)=>s+r.actAmt,0);
  const totalSched = allRows.reduce((s,r)=>s+r.schedCost,0);
  const totalVar = totalAct - totalSched;
  const flaggedCount = allRows.filter(meaningful).length;

  return (
    <div className="db-view" data-screen-label="Variance Analysis">
      <div className="db-header">
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12,flexWrap:'wrap'}}>
          <div className="db-title">Variance Analysis — {monthLabel}</div>
          <button onClick={()=>window.print()} style={{padding:'6px 12px',background:'#2A2D3A',border:'1px solid #3A3D50',borderRadius:6,color:'#C8CAD6',fontSize:11,fontWeight:700,cursor:'pointer',letterSpacing:'.05em',textTransform:'uppercase'}}>Print / PDF</button>
        </div>
        {/* Summary */}
        <div className="db-summary">
          <div className="db-big"><span className="db-big-label">Scheduled $</span><span className="db-big-val" style={{color:'#8B8FA8'}}>{fmt$(totalSched)}</span></div>
          <div className="db-big"><span className="db-big-label">Actual $</span><span className="db-big-val" style={{color:'#E8EAF0'}}>{fmt$(totalAct)}</span></div>
          <div className="db-big"><span className="db-big-label">Variance</span><span className="db-big-val" style={{color: totalVar>0?'#F87171':'#4ADE80'}}>{totalVar>=0?'+':'−'}{fmt$(Math.abs(totalVar))}</span></div>
          <div className="db-big"><span className="db-big-label">Flagged Rows</span><span className="db-big-val" style={{color:'#FBBF24'}}>{flaggedCount}</span></div>
        </div>
        {/* Threshold sliders + sub-tabs */}
        <div style={{display:'flex',gap:18,alignItems:'center',marginTop:12,flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <span style={{fontSize:10,color:'#6B6F85',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em'}}>Flag if</span>
            <span style={{fontSize:11,color:'#C8CAD6'}}>Δhrs ≥</span>
            <input type="range" min="0" max="8" step="0.25" value={hrThresh} onChange={e=>setHrThresh(parseFloat(e.target.value))} style={{width:90}}/>
            <span style={{fontSize:11,fontWeight:700,color:'#FBBF24',width:32}}>{hrThresh}h</span>
            <span style={{fontSize:11,color:'#C8CAD6',marginLeft:8}}>or Δ$ ≥</span>
            <input type="range" min="0" max="500" step="5" value={$Thresh} onChange={e=>set$Thresh(parseFloat(e.target.value))} style={{width:90}}/>
            <span style={{fontSize:11,fontWeight:700,color:'#FBBF24',width:46}}>${$Thresh}</span>
          </div>
          <div style={{flex:1}}/>
          <div style={{display:'flex',gap:0,background:'#13151C',borderRadius:6,padding:2,border:'1px solid #2A2D3A'}}>
            {[['matrix','Day × Dept'],['employee','Employees'],['exceptions','Exceptions']].map(([id,lbl])=>(
              <button key={id} onClick={()=>setSubTab(id)} style={{padding:'6px 14px',border:'none',background:subTab===id?'#E8890C':'transparent',color:subTab===id?'#fff':'#8B8FA8',fontSize:11,fontWeight:700,borderRadius:5,cursor:'pointer',letterSpacing:'.04em',textTransform:'uppercase'}}>{lbl}</button>
            ))}
          </div>
        </div>
      </div>

      <div style={{flex:1,overflow:'auto',padding:'16px 18px'}}>
        {/* SUB-TAB: Day × Dept matrix */}
        {subTab==='matrix' && <div>
          <table className="sales-table" style={{minWidth:900}}>
            <thead><tr>
              <th style={{textAlign:'left',width:90,position:'sticky',left:0,background:'#13151C',zIndex:2}}>Date</th>
              {DEPTS.map(d=> <th key={d.id} style={{textAlign:'center',color:d.color,minWidth:120}}>{d.label}</th>)}
              <th className="num" style={{width:110}}>Day Total Δ</th>
            </tr></thead>
            <tbody>
              {matrixData.map(({monthDay,day,cells})=>{
                const dayDelta = DEPTS.reduce((s,d)=>s+(cells[d.id].actAmt - cells[d.id].schedCost),0);
                const hasAny = DEPTS.some(d=>cells[d.id].schedCost>0 || cells[d.id].actAmt>0);
                if (!hasAny) return null;
                return <tr key={monthDay}>
                  <td style={{fontWeight:700,color:'#C8CAD6',whiteSpace:'nowrap',position:'sticky',left:0,background:'#13151C',zIndex:1}}>
                    {AM.month}/{monthDay} <span style={{fontSize:9,color:'#6B6F85',fontWeight:500}}>{day?.dow}</span>
                  </td>
                  {DEPTS.map(d=>{
                    const c = cells[d.id];
                    const delta = c.actAmt - c.schedCost;
                    const hasData = c.schedCost>0 || c.actAmt>0;
                    const dKey = `${monthDay}|${d.id}`;
                    const isOpen = drillKey===dKey;
                    return <td key={d.id} style={{textAlign:'center',padding:'4px 6px',cursor:hasData?'pointer':'default',background:isOpen?'#E8890C22':'transparent'}} onClick={()=>hasData && setDrillKey(isOpen?null:dKey)} title={hasData?'Click to see employees':''}>
                      {hasData ? <div>
                        <div style={{fontSize:11,fontWeight:800,color:Math.abs(delta)<10?'#6B6F85':delta>0?'#F87171':'#4ADE80'}}>{delta>=0?'+':'−'}{fmt$(Math.abs(delta))}</div>
                        <div style={{fontSize:9,color:'#6B6F85',marginTop:1}}>{c.schedHrs.toFixed(0)}h → {c.actHrs.toFixed(0)}h</div>
                        {c.flagCount>0 && <div style={{display:'inline-flex',gap:3,marginTop:2}}>
                          {c.unsched>0 && <span title={`${c.unsched} unscheduled`} style={{fontSize:8,fontWeight:800,color:'#FBBF24',background:'#FBBF2422',padding:'1px 4px',borderRadius:3}}>U{c.unsched}</span>}
                          {c.otDay>0 && <span title={`${c.otDay} OT day(s)`} style={{fontSize:8,fontWeight:800,color:'#A78BFA',background:'#A78BFA22',padding:'1px 4px',borderRadius:3}}>OT{c.otDay}</span>}
                          {c.cross>0 && <span title={`${c.cross} cross-dept`} style={{fontSize:8,fontWeight:800,color:'#60A5FA',background:'#60A5FA22',padding:'1px 4px',borderRadius:3}}>X{c.cross}</span>}
                        </div>}
                      </div> : <span style={{color:'#3A3D50'}}>—</span>}
                    </td>;
                  })}
                  <td className="num" style={{fontWeight:800,color:Math.abs(dayDelta)<10?'#6B6F85':dayDelta>0?'#F87171':'#4ADE80'}}>{dayDelta>=0?'+':'−'}{fmt$(Math.abs(dayDelta))}</td>
                </tr>;
              })}
            </tbody>
          </table>

          {/* Drill-down panel */}
          {drillKey && (() => {
            const [mdStr, dId] = drillKey.split('|');
            const md = parseInt(mdStr); const dept = getDept(dId);
            const drillRows = allRows.filter(r => r.monthDay===md && (r.schedDept===dId || r.actDept===dId));
            return <div style={{marginTop:14,background:'#1C1E26',border:`1px solid ${dept.color}66`,borderRadius:8,padding:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div style={{fontSize:13,fontWeight:800,color:dept.color}}>{dept.label} · {AM.month}/{md} — Employee Detail</div>
                <button onClick={()=>setDrillKey(null)} style={{background:'transparent',border:'1px solid #3A3D50',color:'#8B8FA8',borderRadius:5,padding:'3px 9px',fontSize:11,cursor:'pointer'}}>Close ✕</button>
              </div>
              <table className="sales-table" style={{minWidth:760}}>
                <thead><tr>
                  <th style={{textAlign:'left'}}>Employee</th>
                  <th className="num">Sched hrs</th>
                  <th className="num">Actual hrs</th>
                  <th className="num">Δ hrs</th>
                  <th className="num">Sched $</th>
                  <th className="num">Actual $</th>
                  <th className="num">Δ $</th>
                  <th>Flags</th>
                  <th></th>
                </tr></thead>
                <tbody>
                  {drillRows.length===0 && <tr><td colSpan={9} style={{color:'#6B6F85',textAlign:'center',padding:18,fontStyle:'italic'}}>No matching records.</td></tr>}
                  {drillRows.map(r=>{
                    const empDept = getDept(r.emp.dept);
                    return <tr key={r.key+'|'+r.monthDay}>
                      <td style={{fontWeight:600,color:'#C8CAD6'}}>
                        {r.emp.name}
                        {r.unmatched && <span title="Not on roster" style={{marginLeft:6,fontSize:9,color:'#FBBF24',background:'#FBBF2422',padding:'1px 5px',borderRadius:3,fontWeight:800}}>UNMATCHED</span>}
                        <div style={{fontSize:9,color:empDept?.color||'#6B6F85'}}>{empDept?.label||'—'}{r.emp.role?` · ${r.emp.role}`:''}</div>
                      </td>
                      <td className="num" style={{color:'#8B8FA8'}}>{r.schedHrs ? r.schedHrs.toFixed(2) : '—'}</td>
                      <td className="num" style={{color:'#E8EAF0',fontWeight:700}}>{r.actHrs ? r.actHrs.toFixed(2) : '—'}</td>
                      <td className="num" style={{fontWeight:700,color:Math.abs(r.dHrs)<0.25?'#6B6F85':r.dHrs>0?'#F87171':'#4ADE80'}}>{r.dHrs>=0?'+':'−'}{Math.abs(r.dHrs).toFixed(2)}</td>
                      <td className="num" style={{color:'#8B8FA8'}}>{r.schedCost ? fmt$(r.schedCost) : '—'}</td>
                      <td className="num" style={{color:'#E8EAF0',fontWeight:700}}>{r.actAmt ? fmt$(r.actAmt) : '—'}</td>
                      <td className="num" style={{fontWeight:800,color:Math.abs(r.d$)<5?'#6B6F85':r.d$>0?'#F87171':'#4ADE80'}}>{r.d$>=0?'+':'−'}{fmt$(Math.abs(r.d$))}</td>
                      <td>{r.flags.map(f=><span key={f} style={{display:'inline-block',marginRight:4,fontSize:8,fontWeight:800,color:flagColor(f),background:flagColor(f)+'22',padding:'1px 5px',borderRadius:3,letterSpacing:'.04em'}}>{f}</span>)}</td>
                      <td>{!r.unmatched && <button onClick={()=>onJumpToSchedule?.(r.emp, r.monthDay)} style={{background:'transparent',border:'1px solid #3A3D50',color:'#E8890C',borderRadius:4,padding:'2px 8px',fontSize:10,cursor:'pointer',fontWeight:700}}>Schedule →</button>}</td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>;
          })()}
        </div>}

        {/* SUB-TAB: Employee × Day */}
        {subTab==='employee' && <div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:11,color:'#8B8FA8'}}>Filter:</span>
            <select value={selDept} onChange={e=>setSelDept(e.target.value)} className="db-dept-select"><option value="all">All departments</option>{DEPTS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}</select>
            <span style={{fontSize:10,color:'#6B6F85',marginLeft:'auto'}}>Rows = employees · cells show Δ$ per day · click row to drill into that employee</span>
          </div>
          <table className="sales-table" style={{minWidth:1200}}>
            <thead><tr>
              <th style={{textAlign:'left',width:180,position:'sticky',left:0,background:'#13151C',zIndex:2}}>Employee</th>
              <th className="num" style={{width:80}}>Sched $</th>
              <th className="num" style={{width:80}}>Act $</th>
              <th className="num" style={{width:80}}>Δ $</th>
              {(MARCH_DAYS||[]).map((d,i)=>{
                const md = parseInt(String(d.date).split('/')[1]);
                return <th key={i} style={{textAlign:'center',minWidth:30,fontSize:9,color:'#6B6F85',padding:'4px 2px'}}>{md}<div style={{fontSize:8,opacity:0.6}}>{d.dow?.[0]}</div></th>;
              })}
            </tr></thead>
            <tbody>
              {[...byEmpDay.values()].filter(rec => {
                if (selDept==='all') return true;
                return rec.emp.dept===selDept || Object.values(rec.days).some(d=>d.actDepts.has(selDept));
              }).map(rec => {
                let totSched=0,totAct=0;
                Object.values(rec.days).forEach(d=>{ totSched+=d.schedCost; totAct+=d.actAmt; });
                const totDelta = totAct - totSched;
                if (Math.abs(totSched)<0.01 && Math.abs(totAct)<0.01) return null;
                const empDept = getDept(rec.emp.dept);
                return <tr key={rec.key}>
                  <td style={{fontWeight:600,color:'#C8CAD6',position:'sticky',left:0,background:'#13151C',zIndex:1}}>
                    <div>{rec.emp.name}{rec.emp.__unmatched && <span style={{marginLeft:6,fontSize:8,color:'#FBBF24',background:'#FBBF2422',padding:'1px 4px',borderRadius:3,fontWeight:800}}>UNMATCHED</span>}</div>
                    <div style={{fontSize:9,color:empDept?.color||'#6B6F85'}}>{empDept?.label||'—'}</div>
                  </td>
                  <td className="num" style={{color:'#8B8FA8'}}>{totSched?fmt$(totSched):'—'}</td>
                  <td className="num" style={{color:'#E8EAF0',fontWeight:700}}>{totAct?fmt$(totAct):'—'}</td>
                  <td className="num" style={{fontWeight:800,color:Math.abs(totDelta)<5?'#6B6F85':totDelta>0?'#F87171':'#4ADE80'}}>{totDelta>=0?'+':'−'}{fmt$(Math.abs(totDelta))}</td>
                  {(MARCH_DAYS||[]).map((day,i)=>{
                    const md = parseInt(String(day.date).split('/')[1]);
                    const d = rec.days[md];
                    if (!d || (d.schedHrs===0 && d.actHrs===0)) return <td key={i} style={{textAlign:'center',color:'#3A3D50',fontSize:9}}>·</td>;
                    const delta = d.actAmt - d.schedCost;
                    const flags = [];
                    if (d.schedHrs===0 && d.actHrs>0) flags.push('U');
                    if (d.schedHrs>0 && d.actHrs===0) flags.push('N');
                    if (d.actHrs>8) flags.push('O');
                    return <td key={i} title={`Sched ${d.schedHrs.toFixed(1)}h $${d.schedCost.toFixed(0)} · Act ${d.actHrs.toFixed(1)}h $${d.actAmt.toFixed(0)}${flags.length?' · '+flags.join(','):''}`} style={{textAlign:'center',padding:'2px 1px',background:Math.abs(delta)>$Thresh?(delta>0?'#F8717122':'#4ADE8022'):'transparent',cursor:'pointer'}} onClick={()=>!rec.emp.__unmatched && onJumpToSchedule?.(rec.emp, md)}>
                      <div style={{fontSize:9,fontWeight:700,color:Math.abs(delta)<5?'#6B6F85':delta>0?'#F87171':'#4ADE80',lineHeight:1.1}}>{delta>=0?'+':'−'}{Math.abs(delta)>=1000?(Math.abs(delta)/1000).toFixed(1)+'k':Math.abs(delta).toFixed(0)}</div>
                      {flags.length>0 && <div style={{fontSize:7,color:'#FBBF24',fontWeight:800}}>{flags.join('')}</div>}
                    </td>;
                  })}
                </tr>;
              })}
            </tbody>
          </table>
          <div style={{fontSize:10,color:'#6B6F85',marginTop:8,lineHeight:1.5}}>
            Cell shows Δ$ (actual − scheduled). Cells over the $-threshold are tinted red (over-spent) or green (under-spent). Flags: <b style={{color:'#FBBF24'}}>U</b>=unscheduled · <b style={{color:'#F87171'}}>N</b>=no-show · <b style={{color:'#A78BFA'}}>O</b>=OT day. Click any cell to jump to the schedule.
          </div>
        </div>}

        {/* SUB-TAB: Exceptions list */}
        {subTab==='exceptions' && <div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:11,color:'#8B8FA8'}}>Filter:</span>
            <select value={selDept} onChange={e=>setSelDept(e.target.value)} className="db-dept-select"><option value="all">All departments</option>{DEPTS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}</select>
            <span style={{fontSize:10,color:'#6B6F85',marginLeft:'auto'}}>Sorted by absolute $ variance · only meaningful rows shown</span>
          </div>
          <table className="sales-table" style={{minWidth:900}}>
            <thead><tr>
              <th style={{textAlign:'left',width:80}}>Date</th>
              <th style={{textAlign:'left'}}>Employee</th>
              <th className="num">Sched hrs / $</th>
              <th className="num">Actual hrs / $</th>
              <th className="num">Δ hrs</th>
              <th className="num">Δ $</th>
              <th>Flags</th>
              <th></th>
            </tr></thead>
            <tbody>
              {allRows.filter(r=>{
                if (!meaningful(r)) return false;
                if (selDept==='all') return true;
                return r.schedDept===selDept || r.actDept===selDept;
              }).sort((a,b)=>Math.abs(b.d$)-Math.abs(a.d$)).map(r=>{
                const empDept = getDept(r.emp.dept);
                const day = MARCH_DAYS.find(x=>parseInt(String(x.date).split('/')[1])===r.monthDay);
                return <tr key={r.key+'|'+r.monthDay}>
                  <td style={{fontWeight:700,color:'#C8CAD6',whiteSpace:'nowrap'}}>{AM.month}/{r.monthDay} <span style={{fontSize:9,color:'#6B6F85'}}>{day?.dow}</span></td>
                  <td style={{fontWeight:600,color:'#C8CAD6'}}>
                    {r.emp.name}
                    {r.unmatched && <span style={{marginLeft:6,fontSize:8,color:'#FBBF24',background:'#FBBF2422',padding:'1px 4px',borderRadius:3,fontWeight:800}}>UNMATCHED</span>}
                    <div style={{fontSize:9,color:empDept?.color||'#6B6F85'}}>{empDept?.label||'—'}{r.crossDept && r.actDept && <span style={{color:'#60A5FA',marginLeft:4}}>→ worked {getDept(r.actDept)?.label}</span>}</div>
                  </td>
                  <td className="num" style={{color:'#8B8FA8'}}>{r.schedHrs?r.schedHrs.toFixed(2):'—'} / {r.schedCost?fmt$(r.schedCost):'—'}</td>
                  <td className="num" style={{color:'#E8EAF0',fontWeight:700}}>{r.actHrs?r.actHrs.toFixed(2):'—'} / {r.actAmt?fmt$(r.actAmt):'—'}</td>
                  <td className="num" style={{fontWeight:700,color:Math.abs(r.dHrs)<0.25?'#6B6F85':r.dHrs>0?'#F87171':'#4ADE80'}}>{r.dHrs>=0?'+':'−'}{Math.abs(r.dHrs).toFixed(2)}</td>
                  <td className="num" style={{fontWeight:800,color:Math.abs(r.d$)<5?'#6B6F85':r.d$>0?'#F87171':'#4ADE80'}}>{r.d$>=0?'+':'−'}{fmt$(Math.abs(r.d$))}</td>
                  <td>{r.flags.map(f=><span key={f} style={{display:'inline-block',marginRight:4,fontSize:8,fontWeight:800,color:flagColor(f),background:flagColor(f)+'22',padding:'1px 5px',borderRadius:3,letterSpacing:'.04em'}}>{f}</span>)}</td>
                  <td>{!r.unmatched && <button onClick={()=>onJumpToSchedule?.(r.emp, r.monthDay)} style={{background:'transparent',border:'1px solid #3A3D50',color:'#E8890C',borderRadius:4,padding:'2px 8px',fontSize:10,cursor:'pointer',fontWeight:700}}>Schedule →</button>}</td>
                </tr>;
              })}
              {allRows.filter(meaningful).length===0 && <tr><td colSpan={8} style={{color:'#6B6F85',textAlign:'center',padding:24,fontStyle:'italic'}}>No variances above your threshold. Lower the slider to see smaller differences.</td></tr>}
            </tbody>
          </table>
        </div>}

      </div>
    </div>
  );
}

function App() {
  const saved = JSON.parse(localStorage.getItem('km_v2')||'null');
  const safeBudgetCfg = (() => {
    const b = saved?.budgetCfg;
    const DEF = window.DEFAULT_BUDGET_CONFIG;
    if (!b || !b.pcts) return DEF;
    return {
      officeFlat: b.officeFlat ?? DEF.officeFlat,
      pcts: { ...DEF.pcts, ...b.pcts },
      hwPlans: { ...DEF.hwPlans, ...(b.hwPlans || {}) },
      defaultPlan: b.defaultPlan || DEF.defaultPlan,
      // Preserve persisted budget extras — these were being silently dropped on reload,
      // which is why custom positions (and rate overrides / holidays) kept disappearing.
      holidays: Array.isArray(b.holidays) ? b.holidays : (DEF.holidays || []),
      positionRates: { ...(DEF.positionRates || {}), ...(b.positionRates || {}) },
      customPositions: Array.isArray(b.customPositions) ? b.customPositions : (DEF.customPositions || []),
      positionOrder: (b.positionOrder && typeof b.positionOrder === 'object') ? b.positionOrder : (DEF.positionOrder || {}),
      tagRates: (b.tagRates && typeof b.tagRates === 'object') ? b.tagRates : (DEF.tagRates || {}),
      hiddenPositions: Array.isArray(b.hiddenPositions) ? b.hiddenPositions : [],
    };
  })();

  // Migrate old single-week schema → multi-week. Seeds legacy shifts into wk4 (the original week).
  const initialEmployees = saved?.employees || INIT_EMPLOYEES;
  const initialWeekShifts = (() => {
    if (saved?.weekShifts) return saved.weekShifts;
    const seed = { wk1:{}, wk2:{}, wk3:{}, wk4:{}, wk5:{} };
    (saved?.employees || INIT_EMPLOYEES).forEach(e => {
      if (e.shifts && e.shifts.some(s=>s[0]||s[1]||s[2])) {
        seed.wk4[e.id] = JSON.parse(JSON.stringify(e.shifts));
      }
    });
    return seed;
  })();
  // Strip .shifts from canonical employees (now lives in weekShifts)
  const cleanEmployees = initialEmployees.map(({shifts, ...rest}) => rest);
  const [employees, setEmployees] = useState(cleanEmployees);
  // Month key helper
  const monthKey = (am) => `${am.year}-${String(am.month).padStart(2,'0')}`;
  // Migrate legacy top-level weekShifts/actuals/sales/events into per-month buckets
  const savedMonth = saved?.activeMonth || {year:2026, month:3};
  const initialMonthBuckets = (() => {
    if (saved?.monthBuckets) return saved.monthBuckets;
    const k = monthKey(savedMonth);
    return {
      [k]: {
        weekShifts: initialWeekShifts,
        actuals: saved?.actuals || {},
        sales:   saved?.sales || {},
        events:  saved?.events || {},
      },
    };
  })();
  const [monthBuckets, setMonthBuckets] = useState(initialMonthBuckets);
  const [activeMonth, setActiveMonth] = useState(savedMonth);
  const [viewingArchive, setViewingArchive] = useState(null);
  const [activeWeek, setActiveWeek] = useState(saved?.activeWeek || 'wk4');
  const [activeTab,  setActiveTab]  = useState('schedule');
  const [showFinanceMenu, setShowFinanceMenu] = useState(false);
  const [activeDept, setActiveDept] = useState('all');
  const [showLabor,  setShowLabor]  = useState(true);
  const [massOpen,   setMassOpen]   = useState(false);
  const [budgetCfg,  setBudgetCfg]  = useState(safeBudgetCfg);
  const [archives,   setArchives]   = useState(saved?.archives || []);
  const [showArchMenu,setShowArchMenu]=useState(false);
  const [tweaks, setTweaks]         = useState(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = useState(false);
  const [syncStatus, setSyncStatus] = useState('connecting');
  const [syncPaused, setSyncPaused] = useState(false);
  const applyingRemoteRef = useRef(false);

  // ─── Active-month data derivation ──────────────────────────────────────────
  // When viewingArchive is set, show that archived month read-only. Otherwise use activeMonth bucket.
  const archiveEntry = viewingArchive ? archives.find(a=>a.id===viewingArchive) : null;
  const readonly = !!archiveEntry;
  const activeMonthKey = monthKey(activeMonth);
  const rawBucket = archiveEntry || monthBuckets[activeMonthKey] || null;
  // Firebase RTDB strips empty objects/arrays — coerce missing fields, and de-array any week obj
  // (numeric-keyed objects come back as sparse arrays). Always normalize to plain object form.
  const normalizeWeekShifts = (ws) => {
    if (!ws) return {};
    const out = {};
    for (const wkId of Object.keys(ws)) {
      const w = ws[wkId];
      if (!w) { out[wkId] = {}; continue; }
      if (Array.isArray(w)) {
        const o = {};
        w.forEach((v, i) => { if (v) o[String(i)] = v; });
        out[wkId] = o;
      } else {
        out[wkId] = w;
      }
    }
    return out;
  };
  const currentBucket = rawBucket ? {
    weekShifts: normalizeWeekShifts(rawBucket.weekShifts),
    actuals:    rawBucket.actuals || {},
    sales:      rawBucket.sales || {},
    events:     rawBucket.events || {},
    plan:       rawBucket.plan || {},
  } : { weekShifts:{wk1:{},wk2:{},wk3:{},wk4:{},wk5:{}}, actuals:{}, sales:{}, events:{}, plan:{} };

  const weekShifts = currentBucket.weekShifts;
  const actuals    = currentBucket.actuals;
  const sales      = currentBucket.sales;
  const events     = currentBucket.events;
  const plan       = currentBucket.plan;

  // Ensure current month has a bucket
  useEffect(()=>{
    if (readonly) return;
    if (!monthBuckets[activeMonthKey]) {
      setMonthBuckets(b => ({ ...b, [activeMonthKey]: { weekShifts:{wk1:{},wk2:{},wk3:{},wk4:{},wk5:{}}, actuals:{}, sales:{}, events:{} }}));
    }
  },[activeMonthKey]);

  // Setters: write to active bucket (block writes while viewing an archive)
  const mutateBucket = (patch) => {
    if (readonly) { alert('Viewing an archived month. Exit archive to edit.'); return; }
    setMonthBuckets(prev => {
      const raw = prev[activeMonthKey];
      // Normalize the stored bucket so updaters always see a sane shape
      // (Firebase strips empty {}/[] and may turn numeric-keyed objects into sparse arrays)
      const cur = raw ? {
        weekShifts: normalizeWeekShifts(raw.weekShifts),
        actuals:    raw.actuals || {},
        sales:      raw.sales   || {},
        events:     raw.events  || {},
        plan:       raw.plan    || {},
      } : { weekShifts:{wk1:{},wk2:{},wk3:{},wk4:{},wk5:{}}, actuals:{}, sales:{}, events:{}, plan:{} };
      const nextBucket = typeof patch === 'function' ? patch(cur) : { ...cur, ...patch };
      return { ...prev, [activeMonthKey]: nextBucket };
    });
  };
  const setWeekShifts = (next) => mutateBucket(cur => {
    const safe = cur.weekShifts || {};
    return { ...cur, weekShifts: typeof next==='function' ? next(safe) : next };
  });
  const setActuals    = (next) => mutateBucket(cur => ({ ...cur, actuals:    typeof next==='function' ? next(cur.actuals)    : next }));
  const setSales      = (next) => mutateBucket(cur => ({ ...cur, sales:      typeof next==='function' ? next(cur.sales)      : next }));
  const setEvents     = (next) => mutateBucket(cur => ({ ...cur, events:     typeof next==='function' ? next(cur.events)     : next }));
  const setPlan       = (next) => mutateBucket(cur => ({ ...cur, plan:       typeof next==='function' ? next(cur.plan||{})    : next }));

  useEffect(()=>{ localStorage.setItem('km_v2',JSON.stringify({employees,activeMonth,monthBuckets,activeWeek,budgetCfg,archives})); },[employees,activeMonth,monthBuckets,activeWeek,budgetCfg,archives]);

  // Publish position rate overrides + holidays + custom positions globally.
  // CRITICAL: run synchronously during render (not in useEffect) so the People-tab
  // dropdown and Schedule-grid sub-sections see custom positions on the SAME render
  // that adds them. useEffect runs AFTER render → would lag a frame and look "missing".
  (() => {
    window.__POS_RATE_OVERRIDES = budgetCfg?.positionRates || {};
    window.__HOLIDAY_DATES = new Set(budgetCfg?.holidays || []);
    window.__TAG_RATE_OVERRIDES = budgetCfg?.tagRates || {};
    // Merge custom positions onto the base list so they show everywhere
    const base = window.__BASE_POSITIONS || (window.__BASE_POSITIONS = window.POSITIONS.slice());
    const custom = budgetCfg?.customPositions || [];
    const baseIds = new Set(base.map(p=>p.id));
    const merged = [...base, ...custom.filter(p=>p && p.id && !baseIds.has(p.id))];
    // Filter out positions the user has hidden from the Budget tab.
    const hidden = new Set(budgetCfg?.hiddenPositions || []);
    const visible = merged.filter(p => !hidden.has(p.id));
    // Apply user-defined position order (per dept) — items not in the order list stay
    // in their original relative position at the end of their dept group.
    const posOrder = budgetCfg?.positionOrder || {};
    const sortByOrder = (arr, deptId) => {
      const ord = posOrder[deptId] || [];
      const idx = id => { const i = ord.indexOf(id); return i<0 ? 1e9 : i; };
      return arr.slice().sort((a,b)=>{
        const ia = idx(a.id), ib = idx(b.id);
        if (ia !== ib) return ia - ib;
        return 0; // preserve stable original order for un-ranked items
      });
    };
    // Group by dept, sort each group, flatten back. Stable-sort preserves cross-dept order.
    const byDept = {};
    visible.forEach(p => { (byDept[p.dept] = byDept[p.dept] || []).push(p); });
    window.POSITIONS = (window.DEPTS||[]).flatMap(d => sortByOrder(byDept[d.id]||[], d.id))
      .concat(visible.filter(p => !(window.DEPTS||[]).some(d=>d.id===p.dept))); // orphans last

    // Also extend JOB_ROLES so each custom position becomes its own "area" sub-section
    // on the Schedule grid (under that dept, above the OTHER catch-all row).
    // IMPORTANT: snapshot by-reference (not JSON clone) — role objects contain `match` functions
    // that JSON.stringify would silently drop, breaking classifyJobRole.
    if (!window.__BASE_JOB_ROLES) {
      const snap = {};
      const src = window.JOB_ROLES || {};
      Object.keys(src).forEach(k=>{ snap[k] = (src[k]||[]).slice(); });
      window.__BASE_JOB_ROLES = snap;
    }
    const baseJR = window.__BASE_JOB_ROLES;
    // Reset JOB_ROLES to the originals every render so deleted positions disappear
    const nextJR = {};
    Object.keys(baseJR).forEach(k=>{ nextJR[k] = baseJR[k].slice(); });
    custom.forEach(p=>{
      if (!p || !p.id || !p.dept) return;
      const list = nextJR[p.dept] = nextJR[p.dept] || [{ id:'all', label:(window.DEPTS||[]).find(d=>d.id===p.dept)?.label?.toUpperCase()||'ALL', match:()=>true }];
      // Skip if id already a role
      if (list.some(r=>r.id===p.id)) return;
      const labelL = (p.label||'').toLowerCase();
      const role = {
        id: p.id,
        label: (p.label||'').toUpperCase(),
        // Match by emp.positionId === p.id, or emp.role text equal to position label
        match: e => e && (e.positionId===p.id || (e.role||'').toLowerCase().trim()===labelL),
      };
      // Insert just before the catch-all 'other'/'all' row so it stays at the bottom
      const otherIdx = list.findIndex(r=>r.id==='other'||r.id==='all');
      if (otherIdx>=0) list.splice(otherIdx, 0, role);
      else list.push(role);
    });
    // Re-sort each dept's role list to match positionOrder (supervisor stays first,
    // 'other'/'all' stays last; everything else follows the user's order).
    Object.keys(nextJR).forEach(deptId => {
      const ord = posOrder[deptId] || [];
      const list = nextJR[deptId];
      const ANCHOR_TOP = new Set(['supervisor']);
      const ANCHOR_BOT = new Set(['other','all','temp']);
      const idx = id => { const i = ord.indexOf(id); return i<0 ? 1e9 : i; };
      list.sort((a,b)=>{
        const at = ANCHOR_TOP.has(a.id), bt = ANCHOR_TOP.has(b.id);
        if (at !== bt) return at ? -1 : 1;
        const ab = ANCHOR_BOT.has(a.id), bb = ANCHOR_BOT.has(b.id);
        if (ab !== bb) return ab ? 1 : -1;
        return idx(a.id) - idx(b.id);
      });
    });
    window.JOB_ROLES = nextJR;
  })();

  // ─── Firebase live sync ────────────────────────────────────────────────────
  // Subscribe: listen for remote changes and merge in
  useEffect(()=>{
    if (!window.KMSync) return;
    const unsub = window.KMSync.subscribe(({ status, remoteSnapshot, applyingRemote }) => {
      setSyncStatus(status);
      if (applyingRemote && remoteSnapshot && !syncPaused) {
        applyingRemoteRef.current = true;
        if (remoteSnapshot.employees)    setEmployees(remoteSnapshot.employees);
        if (remoteSnapshot.activeMonth)  setActiveMonth(remoteSnapshot.activeMonth);
        if (remoteSnapshot.monthBuckets) setMonthBuckets(remoteSnapshot.monthBuckets);
        if (remoteSnapshot.budgetCfg)    setBudgetCfg(remoteSnapshot.budgetCfg);
        if (remoteSnapshot.archives)     setArchives(remoteSnapshot.archives);
        setTimeout(()=>{ applyingRemoteRef.current = false; }, 50);
      }
    });
    return unsub;
  }, [syncPaused]);

  // Push: when local state changes (and not from remote apply), push to Firebase
  useEffect(()=>{
    if (!window.KMSync) return;
    if (applyingRemoteRef.current) return;
    if (syncPaused) return;
    if (readonly) return;
    window.KMSync.push({ employees, activeMonth, monthBuckets, budgetCfg, archives });
  }, [employees, activeMonth, monthBuckets, budgetCfg, archives, syncPaused, readonly]);

  // Apply user event overrides into live monthDays so Declining Balance/Stats pick them up
  useEffect(()=>{
    window.MARCH_DAYS.forEach((d,i)=>{ if(events[i]!==undefined) d.event = events[i]; });
  },[events, activeMonth]);
  useEffect(()=>{
    window.addEventListener('message',e=>{
      if(e.data?.type==='__activate_edit_mode') setShowTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode') setShowTweaks(false);
    });
    window.parent.postMessage({type:'__edit_mode_available'},'*');
  },[]);

  // Build merged employees-with-shifts for the active week; consumer components read this
  const activeEmployees = useMemo(() => {
    const w = weekShifts[activeWeek] || {};
    return employees.map(e => ({ ...e, shifts: w[e.id] || Array(7).fill(['',0,'']) }));
  }, [employees, weekShifts, activeWeek]);

  const handleCellEdit = useCallback((empId,dayIdx,shift)=>{
    setWeekShifts(prev => {
      const safe = prev || {};
      const wk = safe[activeWeek] || {};
      const existing = wk[empId] || Array(7).fill(['',0,'']);
      const updated = existing.map((s,i)=>i===dayIdx?shift:s);
      return { ...safe, [activeWeek]: { ...wk, [empId]: updated } };
    });
  },[activeWeek]);

  // Reorder seniority within a dept+role. Dragged empId is inserted AT target empId's position.
  const handleReorder = useCallback((deptId, roleId, draggedId, targetId)=>{
    setEmployees(prev => {
      // Get group in current order (by seniority ?? index)
      const group = prev
        .map((e,i)=>({e,i}))
        .filter(({e})=>e.dept===deptId && classifyJobRole(e)===roleId)
        .sort((a,b)=>((a.e.seniority??9999) - (b.e.seniority??9999)) || (a.i - b.i));
      const dragIdx = group.findIndex(g=>g.e.id===draggedId);
      const tgtIdx  = group.findIndex(g=>g.e.id===targetId);
      if (dragIdx<0 || tgtIdx<0) return prev;
      const reordered = group.slice();
      const [moved] = reordered.splice(dragIdx, 1);
      reordered.splice(tgtIdx, 0, moved);
      // Re-stamp seniority 1..N for this group
      const seniorityByEmp = {};
      reordered.forEach((g,idx)=>{ seniorityByEmp[g.e.id] = idx+1; });
      return prev.map(e=> seniorityByEmp[e.id]!=null ? {...e, seniority: seniorityByEmp[e.id]} : e);
    });
  },[]);

  // Employee cost popup — listens for a custom event fired by ScheduleGrid name clicks
  const [costEmpId, setCostEmpId] = useState(null);
  useEffect(()=>{
    const h = (e)=>setCostEmpId(e.detail?.empId || null);
    window.addEventListener('open-emp-cost', h);
    return ()=>window.removeEventListener('open-emp-cost', h);
  },[]);

  // Rebuild month calendar whenever activeMonth (or archive being viewed) changes
  const effectiveMonth = archiveEntry ? { year: archiveEntry.year || activeMonth.year, month: archiveEntry.monthNum || activeMonth.month } : activeMonth;
  const monthData = useMemo(()=>{
    const md = window.buildMonth(effectiveMonth.year, effectiveMonth.month);
    window.WEEKS = md.weeks;
    window.MARCH_DAYS = md.monthDays;
    window.WEEK_START_SERIAL = md.weekStartSerial;
    window.ACTIVE_MONTH_LABEL = md.label;
    window.ACTIVE_MONTH = { year: md.year, month: md.month };
    return md;
  },[effectiveMonth.year, effectiveMonth.month]);
  // Clamp activeWeek if month changed and the old week id no longer exists
  useEffect(()=>{
    if (!monthData.weeks.find(w=>w.id===activeWeek)) setActiveWeek(monthData.weeks[0]?.id || 'wk1');
  },[monthData]);
    // Active week initial guard: wk4 only exists if the old March data. Use wk4 if available else wk1 via effect below.
    // Week selection validity is enforced by an effect watching monthData.

  // Week object currently viewed
  const curWeek = useMemo(()=>monthData.weeks.find(w=>w.id===activeWeek)||monthData.weeks[0],[monthData,activeWeek]);
  const weekCtx = useMemo(()=>{
    if (!curWeek) return { dates:[], events:[] };
    const dates = curWeek.dates;
    const wevents = curWeek.dayIdx.map((monthDay,i)=>{
      const midx = monthDay!=null ? (monthData.monthDays.findIndex(d=>d.date.endsWith('/'+monthDay))) : -1;
      const dayObj = midx>=0 ? monthData.monthDays[midx] : null;
      const override = midx>=0 ? events[midx] : undefined;
      return { day:i, event: override!==undefined ? override : (dayObj?.event||'') };
    });
    window.WEEK_DATES = dates; window.WEEK_EVENTS = wevents;
    return { dates, events: wevents };
  },[curWeek,events,monthData]);

  // Dept-aware totals for the top bar — filter by activeDept if not 'all'
  const totalHrs = useMemo(()=>{
    if (activeDept==='all') return activeEmployees.reduce((s,e)=>s+e.shifts.reduce((ss,[,h])=>ss+(h||0),0),0);
    return activeEmployees.reduce((s,e)=>{
      return s + e.shifts.reduce((ss,sh)=>{
        const shDept = sh[5] || e.dept;
        return ss + (shDept===activeDept ? (sh[1]||0) : 0);
      },0);
    },0);
  },[activeEmployees, activeDept]);
  const totalFcst = useMemo(()=>{
    // MTD Forecast = sum of scheduled labor cost across the WHOLE month (all weeks)
    // for the active dept (or all depts when 'all'). 0 → em-dash in the sidebar.
    if (!monthData || !weekShifts) return 0;
    let total = 0;
    const AM = window.ACTIVE_MONTH || {month:3};
    monthData.weeks.forEach(wk => {
      const wkSh = weekShifts[wk.id] || {};
      employees.forEach(emp => {
        const shifts = wkSh[emp.id]; if (!shifts) return;
        shifts.forEach((sh, di) => {
          if (!sh) return;
          const monthDay = wk.dayIdx[di]; if (monthDay==null) return;
          if (activeDept !== 'all') {
            const shDept = sh[5] || emp.dept;
            if (shDept !== activeDept) return;
          }
          total += getShiftCost(emp, sh, `${AM.month}/${monthDay}`);
        });
      });
    });
    return total;
  },[employees, weekShifts, monthData, activeDept]);
  const totalAct = useMemo(()=>{
    if (activeDept==='all') return Object.values(actuals).reduce((s,d)=>s+(d.total||0),0);
    return actuals?.[activeDept]?.total || 0;
  },[actuals, activeDept]);
  const staffCount = useMemo(()=>{
    if (activeDept==='all') return activeEmployees.filter(e=>e.shifts.some(([s,h])=>(h||0)>0 && s!=='OFF' && s!=='PASS' && s!=='AVAIL' && s!=='CANCEL')).length;
    return activeEmployees.filter(e=>e.shifts.some((sh)=>{
      const shDept = sh[5] || e.dept;
      // A "real" shift = has hours and isn't an OFF/PASS/AVAIL/CANCEL marker.
      // Empty status with hours is valid (most shifts after dept-code removal).
      return shDept===activeDept && (sh[1]||0)>0 && sh[0]!=='OFF' && sh[0]!=='PASS' && sh[0]!=='AVAIL' && sh[0]!=='CANCEL';
    })).length;
  },[activeEmployees, activeDept]);

  return (
    <WeekContext.Provider value={weekCtx}>
    <>
    <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>
      <div className="app-header">
        <div className="app-logo">SCHEDULING <span>MATRIX</span></div>
        <div className="main-tabs">
          {[['schedule','Schedule'],['planning','Planning'],['people','People']].map(([id,lbl])=>(
            <button key={id} className={`main-tab${activeTab===id?' active':''}`} onClick={()=>setActiveTab(id)}>{lbl}</button>
          ))}
          <div style={{position:'relative'}}>
            <button
              className={`main-tab${['budget','declining','variance','stats','import'].includes(activeTab)?' active':''}`}
              onClick={()=>setShowFinanceMenu(v=>!v)}
              title="Finance, budgeting, and actuals"
            >
              Finance ▾
              {totalAct>0&&<span style={{marginLeft:5,background:'#16A34A44',color:'#4ADE80',borderRadius:10,padding:'1px 5px',fontSize:9,fontWeight:800}}>✓</span>}
            </button>
            {showFinanceMenu && <>
              <div style={{position:'fixed',inset:0,zIndex:400}} onClick={()=>setShowFinanceMenu(false)}/>
              <div style={{position:'absolute',top:'calc(100% + 6px)',left:0,zIndex:401,background:'#1C1E26',border:'1px solid #3A3D50',borderRadius:8,minWidth:200,boxShadow:'0 12px 36px #0008',padding:'6px 0'}}>
                {[['budget','Budget','Set % of sales, event forecasts'],
                  ['declining','Declining Balance','Day-by-day running balance'],
                  ['variance','Variance Analysis','Scheduled vs actual labor by day'],
                  ['stats','Statistics','KPIs and department performance'],
                  ['import','Import','Load One & Done actuals']].map(([id,lbl,sub])=>(
                  <div key={id}
                    onClick={()=>{setActiveTab(id);setShowFinanceMenu(false);}}
                    style={{padding:'8px 14px',cursor:'pointer',borderLeft:'3px solid '+(activeTab===id?'#E8890C':'transparent'),background:activeTab===id?'#E8890C14':'transparent'}}
                    onMouseEnter={e=>{if(activeTab!==id)e.currentTarget.style.background='#2A2D3A';}}
                    onMouseLeave={e=>{if(activeTab!==id)e.currentTarget.style.background='transparent';}}
                  >
                    <div style={{fontSize:12,fontWeight:700,color:'#E8EAF0',display:'flex',alignItems:'center',gap:6}}>
                      {lbl}
                      {id==='import'&&totalAct>0&&<span style={{background:'#16A34A44',color:'#4ADE80',borderRadius:10,padding:'1px 5px',fontSize:9,fontWeight:800}}>✓ Loaded</span>}
                    </div>
                    <div style={{fontSize:10,color:'#8B8FA8',marginTop:2}}>{sub}</div>
                  </div>
                ))}
              </div>
            </>}
          </div>
        </div>
        {activeTab==='schedule'&&<>
          <div className="week-nav">
            {(() => {
              const wks = monthData.weeks;
              const idx = wks.findIndex(w=>w.id===activeWeek);
              const atStart = idx<=0, atEnd = idx>=wks.length-1;
              return <>
                <button className="nav-btn" onClick={()=>{if(!atStart)setActiveWeek(wks[idx-1].id);}} disabled={atStart} style={{opacity:atStart?.35:1,cursor:atStart?'not-allowed':'pointer'}} title="Previous week">‹</button>
                <select value={activeWeek} onChange={e=>setActiveWeek(e.target.value)} style={{background:'#1C1E26',border:'1px solid #3A3D50',borderRadius:6,color:'#E8EAF0',fontSize:12,fontWeight:600,padding:'6px 10px',outline:'none',cursor:'pointer'}}>
                  {wks.map(w=><option key={w.id} value={w.id}>{w.label}</option>)}
                </select>
                <button className="nav-btn" onClick={()=>{if(!atEnd)setActiveWeek(wks[idx+1].id);}} disabled={atEnd} style={{opacity:atEnd?.35:1,cursor:atEnd?'not-allowed':'pointer'}} title="Next week">›</button>
              </>;
            })()}
          </div>
          <button className="print-btn" onClick={()=>printSchedule(activeDept,activeEmployees,curWeek.label)} title={activeDept==='all'?'Print all departments':'Print '+getDept(activeDept).label+' schedule'}>🖨 Print{activeDept!=='all'?' '+getDept(activeDept).label:''}</button>
          <button className="print-btn" onClick={()=>setMassOpen(true)} title="Assign one shift to a whole crew at once" style={{borderColor:'#E8890C66',color:'#E8890C'}}>⚡ Bulk Assign</button>
        </>}
        <div style={{marginLeft:activeTab==='schedule'?0:'auto',position:'relative',display:'flex',alignItems:'center',gap:8}}>
          <div title={syncPaused?'Sync paused — working offline':
            syncStatus==='online'?'Live sync connected. Edits save automatically across all users.':
            syncStatus==='connecting'?'Connecting to sync…':
            syncStatus==='offline'?'Offline — changes will sync when connection returns':
            'Sync error — changes saved locally only'}
            style={{display:'inline-flex',alignItems:'center',gap:6,padding:'5px 10px',background:'#1C1E26',border:'1px solid '+(syncPaused?'#6B6F85':syncStatus==='online'?'#16A34A66':syncStatus==='offline'?'#EAB30866':syncStatus==='error'?'#DC262666':'#3A3D50'),borderRadius:6,fontSize:10,fontWeight:700,letterSpacing:'.05em',color:syncPaused?'#8B8FA8':syncStatus==='online'?'#4ADE80':syncStatus==='offline'?'#FACC15':syncStatus==='error'?'#F87171':'#C8CAD6',cursor:'pointer'}}
            onClick={()=>setSyncPaused(p=>!p)}>
            <span style={{width:7,height:7,borderRadius:'50%',background:syncPaused?'#6B6F85':syncStatus==='online'?'#4ADE80':syncStatus==='offline'?'#FACC15':syncStatus==='error'?'#F87171':'#8B8FA8',animation:syncStatus==='online'&&!syncPaused?'pulse 2s infinite':'none'}}/>
            {syncPaused?'PAUSED':syncStatus==='online'?'LIVE':syncStatus==='connecting'?'…':syncStatus.toUpperCase()}
          </div>
          <button className="print-btn" onClick={()=>setShowArchMenu(v=>!v)} title="Archive / Month actions" style={{background:readonly?'#EAB30833':undefined,borderColor:readonly?'#EAB308':undefined}}>
            📁 {readonly ? `Viewing: ${archiveEntry.month} (read-only)` : monthData.label} ▾
          </button>
          {showArchMenu && <>
            <div style={{position:'fixed',inset:0,zIndex:400}} onClick={()=>setShowArchMenu(false)}/>
            <div className="archive-menu">
              {readonly ? <>
                <div className="archive-hdr" style={{color:'#EAB308'}}>Read-only Archive</div>
                <div style={{fontSize:10,color:'#8B8FA8',padding:'6px 10px',lineHeight:1.5}}>You're viewing <b style={{color:'#E8EAF0'}}>{archiveEntry.month}</b>. Exit to return to the current month and resume editing.</div>
                <div className="archive-item" onClick={()=>{setViewingArchive(null);setShowArchMenu(false);}}>← Exit Archive View</div>
                <div className="archive-divider"/>
                <div className="archive-item" onClick={()=>{
                  const blob={...archiveEntry};
                  const d=document.createElement('a');d.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(blob,null,2));
                  d.download=`scheduling-matrix-${archiveEntry.month.toLowerCase().replace(/ /g,'-')}.json`;d.click();setShowArchMenu(false);
                }}>📥 Export this archive (JSON)</div>
              </> : <>
                <div className="archive-hdr">Current Month — {monthData.label}</div>
                <div className="archive-item" onClick={()=>{
                  const blob={version:2,employees,activeMonth,monthBuckets,budgetCfg,archives,exported:new Date().toISOString()};
                  const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(blob,null,2));
                  a.download=`scheduling-matrix-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setShowArchMenu(false);
                }}>📥 Backup / Export All Data (JSON)</div>
                <div className="archive-item" onClick={()=>{
                  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
                  inp.onchange=async e=>{
                    const f=e.target.files?.[0];if(!f)return;
                    const txt=await f.text();let data;try{data=JSON.parse(txt);}catch{alert('Invalid JSON file.');return;}
                    if(!confirm('Restore from this backup? Current data across ALL users will be replaced. This cannot be undone.')) return;
                    if(data.employees)    setEmployees(data.employees.map(({shifts,...rest})=>rest));
                    if(data.activeMonth)  setActiveMonth(data.activeMonth);
                    if(data.monthBuckets) setMonthBuckets(data.monthBuckets);
                    else if(data.weekShifts){ // v1 backup compatibility
                      const k=monthKey(data.activeMonth||activeMonth);
                      setMonthBuckets({[k]:{weekShifts:data.weekShifts,actuals:data.actuals||{},sales:data.sales||{},events:data.events||{}}});
                    }
                    if(data.budgetCfg)    setBudgetCfg(data.budgetCfg);
                    if(data.archives)     setArchives(data.archives);
                    alert('✓ Backup restored. Live-syncing to all users.');
                    setShowArchMenu(false);
                  };
                  inp.click();
                }}>📤 Restore from Backup (JSON)</div>
                <div className="archive-divider"/>
                <div className="archive-item" onClick={()=>{
                  // Roll forward to next month
                  const nextAM = activeMonth.month===12 ? {year:activeMonth.year+1, month:1} : {year:activeMonth.year, month:activeMonth.month+1};
                  const nextMD = window.buildMonth(nextAM.year, nextAM.month);
                  if(!confirm(`Roll over to ${nextMD.label}?\n\n• Current month (${monthData.label}) will be archived and viewable read-only\n• Employees carry forward\n• Schedule starts blank (no shifts)\n• Events reset to "Dark"\n• Sales zero out; % allocation & H&W rates carry forward\n• Imported actuals archive with ${monthData.label}`)) return;
                  // Archive current
                  const curBucket = monthBuckets[activeMonthKey];
                  const snapshot = { id:Date.now(), month:monthData.label, monthKey:activeMonthKey, year:activeMonth.year, monthNum:activeMonth.month, archived:new Date().toISOString(),
                    weekShifts:JSON.parse(JSON.stringify(curBucket?.weekShifts||{})),
                    actuals:JSON.parse(JSON.stringify(curBucket?.actuals||{})),
                    sales:JSON.parse(JSON.stringify(curBucket?.sales||{})),
                    events:JSON.parse(JSON.stringify(curBucket?.events||{})),
                    employees:JSON.parse(JSON.stringify(employees)),
                    budgetCfg:JSON.parse(JSON.stringify(budgetCfg)),
                  };
                  setArchives([snapshot, ...archives].slice(0,24));
                  // New month: blank bucket
                  const newKey = `${nextAM.year}-${String(nextAM.month).padStart(2,'0')}`;
                  const newWeekShifts = {};
                  nextMD.weeks.forEach(w=>{ newWeekShifts[w.id] = {}; });
                  setMonthBuckets(b => ({ ...b, [newKey]: { weekShifts:newWeekShifts, actuals:{}, sales:{}, events:{} }}));
                  setActiveMonth(nextAM);
                  setActiveWeek(nextMD.weeks[0].id);
                  // Zero projected sales — already blank in new bucket. Carry % allocation & H&W (budgetCfg unchanged).
                  alert(`✓ Rolled to ${nextMD.label}.\n\n${monthData.label} archived. You can view it from the Archived section below.`);
                  setShowArchMenu(false);
                }}>✨ Roll to next month →</div>
                {archives.length>0 && <>
                  <div className="archive-divider"/>
                  <div className="archive-hdr">Archived ({archives.length})</div>
                  {archives.map(a=>(
                    <div key={a.id} className="archive-item" style={{display:'flex',alignItems:'center',gap:6}}>
                      <span style={{flex:1,cursor:'pointer'}} onClick={()=>{setViewingArchive(a.id);setShowArchMenu(false);}} title="View read-only">👁 {a.month}</span>
                      <span style={{fontSize:9,color:'#6B6F85'}}>{new Date(a.archived).toLocaleDateString()}</span>
                      <span style={{cursor:'pointer',opacity:.6,padding:'0 4px'}} title="Download JSON" onClick={e=>{e.stopPropagation();
                        const blob={...a};
                        const d=document.createElement('a');d.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(blob,null,2));
                        d.download=`scheduling-matrix-${a.month.toLowerCase().replace(/ /g,'-')}.json`;d.click();setShowArchMenu(false);
                      }}>⬇</span>
                    </div>
                  ))}
                  <div className="archive-divider"/>
                  <div className="archive-item danger" onClick={()=>{if(confirm('Clear all archives? This cannot be undone.')){setArchives([]);setShowArchMenu(false);}}}>🗑 Clear Archives</div>
                </>}
              </>}
            </div>
          </>}
        </div>
      </div>

      {/* Summary bar */}
      {activeTab==='schedule'&&(
        <div className="week-summary">
          {activeDept!=='all' && <>
            <div className="ws-item"><span style={{width:8,height:8,borderRadius:'50%',background:getDept(activeDept).color,display:'inline-block'}}/><span className="ws-val" style={{color:getDept(activeDept).color}}>{getDept(activeDept).label}</span></div>
            <div className="ws-divider"/>
          </>}
          <div className="ws-item"><span className="ws-label">Staff</span><span className="ws-val">{staffCount}</span></div>
          <div className="ws-divider"/>
          <div className="ws-item"><span className="ws-label">{activeDept==='all'?'Total Hrs':'Dept Hrs'}</span><span className="ws-val">{totalHrs}h</span></div>
          <div className="ws-divider"/>
          {WEEK_EVENTS.map((ev,i)=>(
            <div key={i} className="ws-item">
              <span className="ws-label">{DAYS[i]}</span>
              <span className="ws-val" style={{fontSize:10,color:'#6B6F85'}} title={ev.event}>{ev.event && ev.event.length>12?ev.event.slice(0,11)+'…':ev.event}</span>
            </div>
          ))}
        </div>
      )}

      <div className="app-body">
        {activeTab==='schedule'&&<>
          <div className="dept-sidebar">
            <div className="dept-section-label">Departments</div>
            <button className={`dept-all-btn${activeDept==='all'?' active':''}`} onClick={()=>setActiveDept('all')}>All Departments</button>
            {DEPTS.map(d=>(
              <button key={d.id} className={`dept-btn${activeDept===d.id?' active':''}`} onClick={()=>setActiveDept(d.id)}>
                <span className="dot" style={{background:d.color}}/>
                <span className="dept-name" style={{color:activeDept===d.id?d.color:'#8B8FA8'}}>{d.label}</span>
              </button>
            ))}
          </div>
          <div className="schedule-area">
            <ScheduleGrid employees={activeEmployees} activeDept={activeDept} plan={plan} customPositionsKey={(budgetCfg?.customPositions||[]).map(p=>p.id).join('|')} onCellEdit={handleCellEdit} onReorder={handleReorder} onAddSpecial={(deptId, kind, name)=>{
              const newId = Date.now() + Math.floor(Math.random()*1000);
              const roleLabel = kind==='supervisor' ? 'Supervisor' : 'Temp Labor';
              setEmployees(prev => [...prev, {
                id: newId, name, dept: deptId, role: roleLabel, kind,
                plan: 'b', seniority: kind==='supervisor' ? -1000 : 99999,
                shifts: Array(7).fill(['',0,''])
              }]);
            }}/>
          </div>
        </>}
        {activeTab==='declining'&&<DecBalView laborData={LABOR_DATA} actuals={actuals} budgetCfg={budgetCfg} sales={sales} employees={employees} weekShifts={weekShifts} monthData={monthData} onClearActuals={()=>setActuals({})}/>}
        {activeTab==='variance'&&<VarianceView employees={employees} weekShifts={weekShifts} actuals={actuals} monthData={monthData} budgetCfg={budgetCfg} onJumpToSchedule={(emp, monthDay)=>{
          // Find the week containing this monthDay
          const wk = (monthData?.weeks||[]).find(w => w.dayIdx.includes(monthDay));
          if (wk) setActiveWeek(wk.id);
          if (emp?.dept) setActiveDept(emp.dept);
          setActiveTab('schedule');
        }}/>}
        {activeTab==='budget'&&<BudgetView config={budgetCfg} sales={sales} events={events} onConfigChange={setBudgetCfg} onSalesChange={setSales} onEventsChange={setEvents}/>}
        {activeTab==='planning'&&<PlanningView plan={plan} onPlanChange={setPlan} monthData={monthData} employees={employees} weekShifts={weekShifts} budgetCfg={budgetCfg} sales={sales} actuals={actuals} customPositionsKey={(budgetCfg?.customPositions||[]).map(p=>p.id).join('|')}/>}
        {activeTab==='stats'&&<StatsView employees={activeEmployees} canonEmployees={employees} weekShifts={weekShifts} budgetCfg={budgetCfg} laborData={LABOR_DATA} actuals={actuals}/>}
        {activeTab==='import'&&<ImportView onApply={(grouped, records, extras)=>{
          // Branch 1: LACTR-ERL Budget upload
          if (extras && extras.lactr) {
            const lactr = extras.lactr;
            // Upsert events into events[] and sales into sales[] (both are keyed by date like "3/5")
            setEvents(prev => {
              const next = { ...(prev||{}) };
              const dateToIdx = Object.fromEntries((window.MARCH_DAYS||[]).map((d,i) => [d.date, i]));
              lactr.events.forEach(e => {
                if (e.total <= 0) return;
                const i = dateToIdx[e.date];
                if (i == null) return;
                next[i] = e.event || '';
              });
              return next;
            });
            setSales(prev => {
              const next = { ...(prev||{}) };
              const dateToIdx = Object.fromEntries((window.MARCH_DAYS||[]).map((d,i) => [d.date, i]));
              lactr.events.forEach(e => {
                if (e.total <= 0) return;
                const i = dateToIdx[e.date];
                if (i == null) return;
                // Merge into premium columns — R&C entries are preserved
                next[i] = {
                  ...(next[i]||{}),
                  prem_food: e.food || 0,
                  prem_nabev: e.nabev || 0,
                  prem_alcohol: e.alcohol || 0,
                };
              });
              return next;
            });
            return;
          }
          // Branch 2: Supervisor Labor — stash on actuals under special key.
          // Comes EITHER from a dedicated Supervisor Labor file (records empty) OR
          // auto-extracted from a One & Done upload (records also present — fall through after stash).
          if (extras && extras.supervisors) {
            setActuals(prev => ({ ...(prev||{}), _supervisors: extras.supervisors }));
            if (!records || !records.length) return;
          }
          // Build actuals keyed by [dept][serial] = {amount, hours} so ALL days across ALL weeks persist.
          const recs = (records||[]).filter(r=>r.monthDay!=null);
          const AM = window.ACTIVE_MONTH || {year:2026, month:3};
          const MONTH_START_SERIAL = window.dateToSerial(new Date(AM.year, AM.month-1, 1));
          setActuals(prev => {
            const next = { ...(prev||{}) };
            // Clear existing per-serial entries for touched (dept, serial) combos
            const touched = new Set(recs.map(r => `${r.dept}|${MONTH_START_SERIAL + r.monthDay - 1}`));
            DEPTS.forEach(d => {
              const src = next[d.id]; if (!src) return;
              const clean = { ...src };
              Object.keys(clean).forEach(k => {
                if (/^\d{5}$/.test(k) && touched.has(`${d.id}|${k}`)) delete clean[k];
              });
              next[d.id] = clean;
            });
            // Write new records
            recs.forEach(r => {
              const serial = MONTH_START_SERIAL + r.monthDay - 1;
              if (!next[r.dept]) next[r.dept] = {};
              const existing = next[r.dept][serial] || { amount:0, hours:0 };
              next[r.dept][serial] = {
                amount: existing.amount + (r.amount||0),
                hours:  existing.hours  + (r.hours||0),
              };
            });
            // Recompute per-dept totals (sum all serial entries)
            DEPTS.forEach(d => {
              if (!next[d.id]) return;
              let total = 0, totalHrs = 0;
              Object.entries(next[d.id]).forEach(([k,v]) => {
                if (/^\d{5}$/.test(k) && v && typeof v==='object') {
                  total += v.amount||0; totalHrs += v.hours||0;
                }
              });
              // Also keep legacy 0..6 keys for the single-week Labor Plan card (current week only)
              next[d.id].total = total;
              next[d.id].totalHrs = totalHrs;
            });
            // Merge grouped (0..6) for the active week's Labor Plan card
            Object.entries(grouped||{}).forEach(([deptId, dayMap]) => {
              if (!next[deptId]) next[deptId] = {};
              for (let i=0;i<7;i++) {
                if (dayMap[i]) next[deptId][i] = dayMap[i];
              }
            });
            next._records = [...((prev?._records)||[]).filter(r => !recs.some(nr => nr.monthDay===r.monthDay && nr.dept===r.dept)), ...recs];
            return next;
          });
        }} actuals={actuals} activeWeek={activeWeek}/>}
        {activeTab==='people'&&<PeopleView employees={activeEmployees} canonEmployees={employees} onUpdate={(next)=>{
          // next contains .shifts from activeEmployees merge — strip before saving to canonical
          setEmployees(next.map(({shifts, ...rest}) => rest));
        }} budgetCfg={budgetCfg}/>}
      </div>
    </div>

    {costEmpId && <EmpCostModal empId={costEmpId} employees={employees} weekShifts={weekShifts} monthData={monthData} actuals={actuals} onClose={()=>setCostEmpId(null)}/>}
    {massOpen && <MassAssignModal employees={activeEmployees} defaultDept={activeDept} weekDates={(curWeek&&curWeek.dates)||[]} weekLabel={curWeek&&curWeek.label} onApply={handleCellEdit} onClose={()=>setMassOpen(false)}/>}

    {showTweaks&&(
      <div style={{position:'fixed',bottom:20,right:20,background:'#252838',border:'1px solid #3A3D50',borderRadius:12,padding:20,width:260,zIndex:9999,boxShadow:'0 8px 32px #00000070'}}>
        <div style={{fontWeight:800,fontSize:13,color:'#fff',marginBottom:14}}>Tweaks</div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:700,color:'#6B6F85',marginBottom:6}}>ACCENT COLOR</div>
          <input type="color" value={tweaks.accentColor} style={{width:'100%',height:32,borderRadius:6,border:'none',cursor:'pointer'}}
            onChange={e=>{const v=e.target.value;setTweaks(t=>({...t,accentColor:v}));window.parent.postMessage({type:'__edit_mode_set_keys',edits:{accentColor:v}},'*');}}/>
        </div>
        <div>
          <div style={{fontSize:10,fontWeight:700,color:'#6B6F85',marginBottom:6}}>WEEK LABEL</div>
          <input type="text" value={tweaks.weekLabel} style={{background:'#1C1E26',border:'1px solid #3A3D50',borderRadius:6,color:'#E8EAF0',fontSize:12,padding:'6px 10px',width:'100%',outline:'none'}}
            onChange={e=>{const v=e.target.value;setTweaks(t=>({...t,weekLabel:v}));window.parent.postMessage({type:'__edit_mode_set_keys',edits:{weekLabel:v}},'*');}}/>
        </div>
      </div>
    )}
    </>
    </WeekContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
