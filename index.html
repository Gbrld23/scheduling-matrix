          <button className="popup-save" disabled={willAssign===0} style={{opacity:willAssign===0?.4:1,cursor:willAssign===0?'not-allowed':'pointer'}} onClick={apply}>Assign {willAssign||''}</button>
        </div>
      </div>
    </>
  );
}
const inpS = {width:'100%',background:'#1C1E26',border:'1px solid #3A3D50',borderRadius:6,color:'#E8EAF0',fontSize:12,fontWeight:600,padding:'6px 8px',outline:'none',boxSizing:'border-box'};

function ScheduleGrid({ employees, activeDept, onCellEdit, onReorder, onAddSpecial, customPositionsKey, plan }) {
  const { dates: WEEK_DATES, events: WEEK_EVENTS_CTX } = useWeek();
  const WEEK_EVENTS = WEEK_EVENTS_CTX;
  const [editing, setEditing] = useState(null);
  const editable = activeDept!=='all'; // 'All Departments' is a read-only roll-up / overview
  const [dragInfo, setDragInfo] = useState(null); // { empId, dept, jobRole }
  // ── Excel-style fill-handle paint ──
  const [painting, setPainting] = useState(false);
  const [paintRange, setPaintRange] = useState(null); // {r0,r1,d0,d1}
  const paintRef = useRef(null);       // {srcRow,srcDay,srcEmp,shift,rowEmpMap,range}
  const rowEmpMapRef = useRef({});
  useEffect(()=>{
    if (!painting) return;
    document.body.classList.add('painting');
    const onMove = (e)=>{
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cell = el && el.closest && el.closest('td[data-row]');
      const p = paintRef.current; if (!p || !cell) return;
      const r = +cell.getAttribute('data-row'), d = +cell.getAttribute('data-day');
      const range = { r0:Math.min(p.srcRow,r), r1:Math.max(p.srcRow,r), d0:Math.min(p.srcDay,d), d1:Math.max(p.srcDay,d) };
      p.range = range; setPaintRange(range);
    };
    const onUp = ()=>{
      const p = paintRef.current;
      if (p) {
        const rng = p.range || {r0:p.srcRow,r1:p.srcRow,d0:p.srcDay,d1:p.srcDay};
        const map = p.rowEmpMap || {}; const src = p.shift;
        for (let r=rng.r0; r<=rng.r1; r++){
          const empId = map[r]; if (empId==null) continue;
          for (let d=rng.d0; d<=rng.d1; d++){
            if (r===p.srcRow && d===p.srcDay) continue;
            const tuple = (empId===p.srcEmp)
              ? src.slice()
              : [src[0]||'', src[1]||0, src[2]||'', src[3]||'', '', null, src[6]||'', ''];
            onCellEdit(empId, d, tuple);
          }
        }
      }
      document.body.classList.remove('painting');
      paintRef.current = null; setPaintRange(null); setPainting(false);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp, {once:true});
    return ()=>{ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.body.classList.remove('painting'); };
  }, [painting, onCellEdit]);
  const groups = useMemo(()=>{
    const vis = activeDept==='all'?employees:employees.filter(e=>e.dept===activeDept || e.shifts.some(sh=>sh[5]===activeDept));
    // Group employees under a dept when they have either primary dept match OR any override shift to that dept
    const m={}; DEPTS.forEach(d=>{m[d.id]=[];});
    vis.forEach(e=>{
      const depts = new Set([e.dept]);
      e.shifts.forEach(sh=>{ if(sh[5]) depts.add(sh[5]); });
      depts.forEach(d=>{ if(m[d]) m[d].push(e); });
    });
    // For each dept, subgroup by job role and preserve seniority order (sort by e.seniority ?? index)
    return DEPTS.map(d=>{
      // Synthetic role defs: supervisors on top, regular roles middle, temp on bottom.
      // The "regular" role list is derived strictly from window.POSITIONS for this dept
      // (the same list shown on the Budget tab) so the Schedule grid mirrors the Budget.
      const SUPER_ROLE = { id:'supervisor', label:'SUPERVISORS', match:e=>classifyJobRole(e)==='supervisor' };
      const TEMP_ROLE = { id:'temp', label:'TEMP LABOR', match:e=>e.kind==='temp' };
      const deptPositions = (window.POSITIONS||[]).filter(p => p.dept === d.id);
      // Build a role-def per position, matching by employee.positionId === p.id.
      // Fallback: legacy employees without positionId match by role-text equality.
      const regular = deptPositions.map(p => {
        const labelL = (p.label||'').toLowerCase().trim();
        return {
          id: p.id,
          label: (p.label||'').toUpperCase(),
          match: e => e && (e.positionId === p.id || (!e.positionId && (e.role||'').toLowerCase().trim() === labelL)),
        };
      });
      // Always include an OTHER catch-all so legacy / un-mapped employees still appear somewhere.
      regular.push({ id:'other', label:'OTHER', match: ()=>true });
      const roleDefs = [SUPER_ROLE, ...regular, TEMP_ROLE];

      const subGroups = [];
      roleDefs.forEach(rd=>{
        const roleEmps = m[d.id].filter(e=>{
          if (e.dept !== d.id) return rd.id === classifyJobRole(e);
          return classifyJobRole(e) === rd.id;
        });
      // Always render supervisor & temp sections (even if empty) so user can add to them.
      // Also render any "real position" rows (i.e. non-catch-all) even when empty so the
      // Schedule grid mirrors the Budget tab's full position list.
      const isCatchAll = (rd.id==='other' || rd.id==='all');
      if (roleEmps.length || rd.id==='supervisor' || rd.id==='temp' || !isCatchAll) {
        roleEmps.sort((a,b)=>(a.seniority??9999) - (b.seniority??9999) || a.id - b.id);
        subGroups.push({ role: rd, emps: roleEmps });
      }
      });
      // Skip dept entirely if no regular roster AND no supervisors/temp yet (keeps grid sparse)
      const totalRoster = m[d.id].length;
      if (totalRoster===0) return null;
      return { dept:d, subGroups, total:totalRoster };
    }).filter(Boolean);
  },[employees,activeDept,customPositionsKey]);
  const todayCol = (new Date().getDay()+6)%7; // Mon=0
  // Build a fresh rowIdx→empId map every render (DOM order) for fill-handle paint
  const rowEmpMap = {}; let _rowCounter = 0;
  rowEmpMapRef.current = rowEmpMap;
  const inPaint = (r,d) => paintRange && r>=paintRange.r0 && r<=paintRange.r1 && d>=paintRange.d0 && d<=paintRange.d1;
  return (
    <div className="grid-wrapper">
      {editing && <CellPopup emp={employees.find(e=>e.id===editing.empId)} dayIdx={editing.dayIdx} onSave={onCellEdit} onClose={()=>setEditing(null)}/>}
      {!editable && <div style={{padding:'8px 16px',fontSize:11,color:'#8B8FA8',background:'#15171F',borderBottom:'1px solid #2A2D3A',display:'flex',alignItems:'center',gap:8}}><span style={{color:'#E8890C',fontWeight:800,letterSpacing:'.05em',textTransform:'uppercase',fontSize:10}}>Overview</span> All departments — totals only. Select a single department to edit shifts.</div>}
      <table className="schedule-table">
        <thead><tr>
          <th className="th-name">Employee</th>
          {DAYS.map((d,i)=>{
            const dateStr = WEEK_DATES[i]?.[0];
            const isHol = !!(dateStr && window.__HOLIDAY_DATES && window.__HOLIDAY_DATES.has(dateStr));
            return (
            <th key={d} className="th-day" style={{...(i===todayCol?{background:'#E8890C18'}:{}), ...(isHol?{background:'#A78BFA1A',borderTop:'2px solid #A78BFA'}:{})}} title={isHol?'Holiday — all shifts on this day are paid at 2× rate':undefined}>
              <div className="th-day-name" style={isHol?{color:'#C4B5FD'}:{}}>{d}{isHol?<span style={{marginLeft:4,fontSize:9}}>🎉</span>:null}</div>
              <div className="th-day-date" style={isHol?{color:'#A78BFA',fontWeight:700}:{}}>{dateStr}</div>
              <div className="th-day-event" style={isHol?{color:'#A78BFA'}:{}} title={isHol?undefined:WEEK_EVENTS[i]?.event}>{isHol?'HOLIDAY (2×)':(()=>{const ev=WEEK_EVENTS[i]?.event||'';return ev.length>12?ev.slice(0,11)+'…':ev;})()}</div>
            </th>
            );
          })}
          <th className="th-total">HRS</th>
        </tr></thead>
        <tbody>
          {groups.map(({dept,subGroups,total})=>(
            <React.Fragment key={dept.id}>
              <tr className="section-row" style={{background:dept.light}}>
                <td colSpan={9} style={{color:dept.color}}>
                  <div className="section-label">
                    <span style={{width:9,height:9,borderRadius:'50%',background:dept.color,display:'inline-block'}}/>
                    {dept.label}<span className="section-count">{total} staff</span>
                  </div>
                </td>
              </tr>
              {subGroups.map(({role,emps})=>(
                <React.Fragment key={dept.id+'_'+role.id}>
                  <tr className="role-row" style={{background:'#1C1E26'}}>
                    <td colSpan={9} style={{padding:'5px 14px 5px 30px',borderBottom:'1px solid #2A2D3A',borderTop:'1px solid #2A2D3A'}}>
                      <span style={{fontSize:9,fontWeight:800,letterSpacing:'.08em',color:dept.color,opacity:.9}}>
                        {role.label}
                        <span style={{marginLeft:8,color:'#6B6F85',fontWeight:600,letterSpacing:'.03em'}}>· {emps.length}</span>
                        <span style={{marginLeft:10,fontSize:8,color:'#6B6F85',fontWeight:500,letterSpacing:'.05em',textTransform:'none'}}>drag ⋮⋮ to reorder seniority</span>
                      </span>
                    </td>
                  </tr>
                  {(() => {
                    const isPosRole = !['supervisor','temp','other','all'].includes(role.id);
                    if (!isPosRole || !plan || !plan[role.id]) return null;
                    const perDay = WEEK_DATES.map((wd,i)=>{
                      const date = wd?.[0];
                      const need = (plan[role.id] && planSumN(plan[role.id][date])) || 0;
                      const have = emps.filter(e=>{ const sh=e.shifts[i]||['',0,'']; const shDept=sh[5]||e.dept; return shDept===dept.id && (sh[1]||0)>0 && !['OFF','PASS','AVAIL','CANCEL'].includes(sh[0]); }).length;
                      return {need,have};
                    });
                    if (!perDay.some(p=>p.need>0)) return null;
                    return (
                      <tr className="needs-row">
                        <td className="needs-label">▸ need / sched</td>
                        {perDay.map((p,i)=>{
                          if (p.need<=0) return <td key={i} className="needs-cell" style={{color:'#3A3D50'}}>·</td>;
                          const color = p.have>=p.need ? '#4ADE80' : '#F87171';
                          return <td key={i} className="needs-cell" title={`Plan needs ${p.need}, ${p.have} scheduled`}><span style={{color}}>{p.have}/{p.need}</span></td>;
                        })}
                        <td className="td-total"></td>
                      </tr>
                    );
                  })()}
                  {emps.map((emp,idxInRole)=>{
                    const rowIdx = _rowCounter++; rowEmpMap[rowIdx] = emp.id;
                    // For this dept-section row: show only shifts assigned to this dept
                    const sectionShifts = emp.shifts.map(sh => {
                      const shDept = sh[5] || emp.dept;
                      return shDept === dept.id ? sh : ['',0,''];
                    });
                    const total=sectionShifts.reduce((s,sh)=>s+(sh[1]||0),0);
                    const isCrossover = emp.dept !== dept.id;
                    const isDragging = dragInfo && dragInfo.empId===emp.id && dragInfo.dept===dept.id && dragInfo.role===role.id;
                    return (
                      <tr key={emp.id+'@'+dept.id+'@'+role.id} className="emp-row"
                          style={{opacity:isDragging?.4:1}}
                          draggable={editable && !painting}
                          onDragStart={e=>{
                            setDragInfo({empId:emp.id,dept:dept.id,role:role.id,from:idxInRole});
                            e.dataTransfer.effectAllowed='move';
                            try{ e.dataTransfer.setData('text/plain', String(emp.id)); }catch(_){}
                          }}
                          onDragOver={e=>{
                            if (!dragInfo || dragInfo.dept!==dept.id || dragInfo.role!==role.id) return;
                            e.preventDefault(); e.dataTransfer.dropEffect='move';
                          }}
                          onDrop={e=>{
                            if (!dragInfo || dragInfo.dept!==dept.id || dragInfo.role!==role.id) return;
                            e.preventDefault();
                            if (dragInfo.empId===emp.id) { setDragInfo(null); return; }
                            onReorder && onReorder(dept.id, role.id, dragInfo.empId, emp.id);
                            setDragInfo(null);
                          }}
                          onDragEnd={()=>setDragInfo(null)}
                      >
                        <td className="td-name">
                          <div style={{display:'flex',alignItems:'center',gap:8}}>
                            {editable && <span title="Drag to reorder" style={{cursor:'grab',color:'#6B6F85',fontSize:14,userSelect:'none',lineHeight:1,letterSpacing:'-2px',opacity:.6}}>⋮⋮</span>}
                            <div style={{flex:1,minWidth:0}}>
                              <div className="emp-name" style={{cursor:'pointer'}} onClick={()=>window.dispatchEvent(new CustomEvent('open-emp-cost',{detail:{empId:emp.id}}))}>
                                <span style={{color:'#6B6F85',fontSize:9,fontWeight:700,marginRight:6}}>{idxInRole+1}</span>
                                {emp.name}
                                {isCrossover&&<span style={{marginLeft:6,fontSize:8,fontWeight:800,color:getDept(emp.dept).color,background:getDept(emp.dept).color+'22',padding:'1px 5px',borderRadius:3,letterSpacing:'.04em',verticalAlign:'middle'}}>FROM {getDept(emp.dept).label.toUpperCase()}</span>}
                              </div>
                              <div className="emp-role">{emp.role}</div>
                            </div>
                          </div>
                        </td>
                        {sectionShifts.map((sh,di)=>{
                          const [st,hrs,tm]=sh; const flag=sh[3]||''; const tag=sh[6]||''; const note=sh[7]||''; const origSh=emp.shifts[di]; const shDept = origSh[5] || emp.dept;
                          const sc=STATUS_COLORS[st]||STATUS_COLORS[''];
                          const showDeptBadge = origSh[5] && origSh[5]===dept.id && origSh[1]>0;
                          // Dept-grouping shift codes (C/P/B/R/S/LD/CA/BA/STW/H) are obsolete now
                          // that rows are grouped by job title. Hide them; only show meaningful
                          // statuses (PASS/AVAIL/CANCEL) and OFF as their own special rendering.
                          const isDeptCode = /^(C|P|B|R|S|LD|CA|BA|STW|H)$/.test(st||'');
                          const tagDef = tag ? (window.SHIFT_TAGS||SHIFT_TAGS).find(t=>t.id===tag) : null;
                          const tagBadge = tagDef ? <span style={{fontSize:7,marginLeft:3,color:tagDef.color,fontWeight:900,letterSpacing:'.05em'}}>{tagDef.badge}</span> : null;
                          const noteDot = note ? <span title={note} style={{fontSize:8,marginLeft:3,color:'#E8890C',cursor:'help',fontWeight:900}}>✎</span> : null;
                          return (
                            <td key={di} data-row={rowIdx} data-day={di} className={"td-cell"+(inPaint(rowIdx,di)?" paint-hi":"")} style={di===todayCol?{background:'#E8890C08'}:{}}>
                              <div className="cell-inner" style={editable?undefined:{cursor:'default'}} onClick={(ev)=>{
                                if (!editable) return;
                                if ((ev.shiftKey||ev.altKey) && window.__SHIFT_CLIPBOARD) {
                                  // Quick-paste without opening the popup
                                  onCellEdit(emp.id, di, [...window.__SHIFT_CLIPBOARD]);
                                  return;
                                }
                                setEditing({empId:emp.id,dayIdx:di});
                              }} title={!editable ? undefined : (window.__SHIFT_CLIPBOARD ? 'Click to edit · Shift-click to paste' : 'Click to edit')}>
                                {(!st||st===''||isDeptCode)?(
                                  hrs>0?(
                                    <>
                                      {tm&&<span className="cell-time">{tm}</span>}
                                      <span className="cell-hours" style={flag==='OT'?{color:'#E8890C',fontWeight:800}:flag==='HOL'?{color:'#F87171',fontWeight:800}:{}}>{hrs}h{flag==='OT'&&<span style={{fontSize:7,marginLeft:3,color:'#E8890C',fontWeight:900}}>OT</span>}{flag==='HOL'&&<span style={{fontSize:7,marginLeft:3,color:'#F87171',fontWeight:900}}>HOL</span>}{flag==='LEAD'&&<span style={{fontSize:7,marginLeft:3,color:'#4ADE80',fontWeight:900}}>LD+$3</span>}{tagBadge}{noteDot}</span>
                                      {showDeptBadge&&<span style={{fontSize:7,fontWeight:800,color:dept.color,marginTop:2,letterSpacing:'.04em'}}>◆ LOANED</span>}
                                    </>
                                  ):<span className="cell-off">—</span>
                                ):
                                 st==='OFF'?<span className="cell-off">OFF</span>:(
                                  <><span className="cell-badge" style={{background:sc.bg,color:sc.color}}>{st}{flag==='OT'&&<span style={{fontSize:7,marginLeft:3,color:'#E8890C',fontWeight:900}}>OT</span>}{flag==='HOL'&&<span style={{fontSize:7,marginLeft:3,color:'#F87171',fontWeight:900}}>HOL</span>}{flag==='LEAD'&&<span style={{fontSize:7,marginLeft:3,color:'#4ADE80',fontWeight:900}}>LD+$3</span>}{tagBadge}{noteDot}</span>
                                  {tm&&<span className="cell-time">{tm}</span>}
                                  {hrs>0&&<span className="cell-hours" style={flag==='OT'?{color:'#E8890C',fontWeight:800}:flag==='HOL'?{color:'#F87171',fontWeight:800}:{}}>{hrs}h</span>}
                                  {showDeptBadge&&<span style={{fontSize:7,fontWeight:800,color:dept.color,marginTop:2,letterSpacing:'.04em'}}>◆ LOANED</span>}</>
                                )}
                                {editable && (origSh[1]>0 || (origSh[0]&&origSh[0]!=='')) && (
                                  <span className="fill-handle" title="Drag to copy this shift across cells (Excel fill)" onMouseDown={(ev)=>{
                                    ev.preventDefault(); ev.stopPropagation();
                                    paintRef.current = { srcRow:rowIdx, srcDay:di, srcEmp:emp.id, shift:origSh.slice(), rowEmpMap:rowEmpMapRef.current, range:{r0:rowIdx,r1:rowIdx,d0:di,d1:di} };
                                    setPaintRange({r0:rowIdx,r1:rowIdx,d0:di,d1:di}); setPainting(true);
                                  }}/>
                                )}
                              </div>
                            </td>
                          );
                        })}
                        <td className="td-total" style={{color:total>=40?'#16A34A':total>=32?'#E8890C':'#6B6F85'}}>{total>0?total:'—'}</td>
                      </tr>
                    );
                  })}
                  {editable && role.id==='temp' && (
                    <AddSpecialRow dept={dept} kind={role.id} onAdd={onAddSpecial}/>
                  )}
                </React.Fragment>
              ))}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ─── DailyLaborView ───────────────────────────────────────────────────────────
function DailyLaborView({ employees, laborData, actuals }) {
  const { dates: WEEK_DATES, events: WEEK_EVENTS_CTX } = useWeek();
  const WEEK_EVENTS = WEEK_EVENTS_CTX;
  const [view, setView] = useState('$'); // '$' or 'h'

  // Scheduled hours per dept per day
  const schedHrs = useMemo(()=>{
    const r={}; DEPTS.forEach(d=>{r[d.id]=Array(7).fill(0);});
    employees.forEach(e=>{ e.shifts.forEach(([,h],di)=>{ if(h>0) r[e.dept][di]=(r[e.dept][di]||0)+h; }); });
    return r;
  },[employees]);

  // Totals per day across all depts
  const dayTotals = useMemo(()=>{
    return Array(7).fill(0).map((_,di)=>{
      const hrs=DEPTS.reduce((s,d)=>s+(schedHrs[d.id]?.[di]||0),0);
      const fcst=DEPTS.reduce((s,d)=>s+(schedHrs[d.id]?.[di]||0)*(AVG_RATES[d.id]||30),0);
      const act=DEPTS.reduce((s,d)=>s+(actuals?.[d.id]?.[di]?.amount||0),0);
      return {hrs,fcst,act};
    });
  },[schedHrs,actuals]);

  const weekTotals = useMemo(()=>({
    hrs:DEPTS.reduce((s,d)=>s+(schedHrs[d.id]||[]).reduce((a,b)=>a+b,0),0),
    fcst:laborData.reduce((s,l)=>s+l.forecast,0),
    act:DEPTS.reduce((s,d)=>s+(actuals?.[d.id]?.total||0),0),
  }),[schedHrs,actuals,laborData]);

  return (
    <div className="dl-view">
      <div className="dl-header">
        <div className="dl-header-title">Daily Labor — Week of Mar 23–29, 2026</div>
        <div className="dl-stat"><span className="dl-stat-label">Total Sched Hrs</span><span className="dl-stat-val">{weekTotals.hrs}h</span></div>
        <div className="dl-stat"><span className="dl-stat-label">Monthly Forecast</span><span className="dl-stat-val" style={{color:'#E8890C'}}>{fmt$(weekTotals.fcst)}</span></div>
        <div className="dl-stat"><span className="dl-stat-label">MTD Actual</span><span className="dl-stat-val" style={{color:weekTotals.act>0?'#16A34A':'#6B6F85'}}>{weekTotals.act>0?fmt$(weekTotals.act):'Not imported'}</span></div>
        <div style={{marginLeft:'auto',display:'flex',gap:4}}>
          {['$','h'].map(v=><button key={v} onClick={()=>setView(v)} style={{padding:'5px 12px',borderRadius:6,border:'1px solid #3A3D50',background:view===v?'#2A2D3A':'transparent',color:view===v?'#fff':'#8B8FA8',cursor:'pointer',fontSize:12,fontWeight:700}}>{v==='$'?'Show $':'Show Hrs'}</button>)}
        </div>
      </div>
      <div className="dl-body">
        {/* Events banner */}
        <div className="events-bar">
          {DAYS.map((d,i)=>(
            <div key={d} className="event-day" style={i===3||i===4?{background:'#6366F108'}:i===5||i===6?{background:'#06B6D408'}:{}}>
              <div className="event-day-label">{d}</div>
              <div className="event-day-date">{WEEK_DATES[i][0]}</div>
              <div className="event-day-name">{WEEK_EVENTS[i]?.event}</div>
            </div>
          ))}
        </div>

        {/* Grid */}
        <div style={{overflowX:'auto'}}>
          <table className="dl-table">
            <thead><tr>
              <th className="dept-col">Department</th>
              {DAYS.map((d,i)=><th key={d}>{d} <span style={{color:'#4A4D60',fontWeight:500}}>{WEEK_DATES[i][0]}</span></th>)}
              <th className="total-col">Week Total</th>
              <th>Monthly Fcst</th>
              <th>MTD Actual</th>
              <th>Remaining</th>
            </tr></thead>
            <tbody>
              {DEPTS.map(dept=>{
                const hrs=schedHrs[dept.id]||Array(7).fill(0);
                const rate=AVG_RATES[dept.id]||30;
                const ld=laborData.find(l=>l.dept===dept.id)||{};
                const weekHrs=hrs.reduce((s,h)=>s+h,0);
                const weekFcst=weekHrs*rate;
                const actTotal=actuals?.[dept.id]?.total||0;
                const remaining=(ld.budget||ld.forecast||0)-actTotal;
                return (
                  <tr key={dept.id} className="dl-td">
                    <td className="dl-dept-cell">
                      <div style={{display:'flex',alignItems:'center',gap:7}}>
                        <div style={{width:10,height:10,borderRadius:'50%',background:dept.color,flexShrink:0}}/>
                        <div><div className="dl-dept-name" style={{color:dept.color}}>{dept.label}</div>
                          <div className="dl-dept-role">{weekHrs}h this week</div></div>
                      </div>
                    </td>
                    {hrs.map((h,di)=>{
                      const fcst=h*rate;
                      const actD=actuals?.[dept.id]?.[di];
                      const actAmt=actD?.amount||0;
                      const actH=actD?.hours||0;
                      const varAmt=actAmt-fcst;
                      return (
                        <td key={di} className="dl-td" style={{borderRight:'1px solid #22253240',padding:'6px 8px',textAlign:'center',background:actAmt>0&&varAmt>0?'#DC262608':actAmt>0&&varAmt<=0?'#16A34A08':'transparent'}}>
                          {h===0&&!actAmt?<span style={{color:'#3A3D50',fontSize:11}}>—</span>:(
                            <div className="dl-metric">
                              <div className="dl-metric-row">
                                <span className="dl-metric-lbl">Sched</span>
                                <span className="dl-metric-val" style={{color:'#8B8FA8'}}>{view==='$'?fmt$(fcst):fmtH(h)}</span>
                              </div>
                              {actAmt>0 && <>
                                <div className="dl-metric-row" style={{background:'#1C1E26',borderRadius:3}}>
                                  <span className="dl-metric-lbl">Actual</span>
                                  <span className="dl-metric-val" style={{color:'#E8EAF0'}}>{view==='$'?fmt$(actAmt):fmtH(actH)}</span>
                                </div>
                                <div className="dl-metric-row">
                                  <span className="dl-metric-lbl">Var</span>
                                  <span className={`dl-metric-val ${varAmt>0?'dl-var-neg':'dl-var-pos'}`}>{varAmt>0?'+':''}{view==='$'?fmt$(varAmt):fmtH(actH-h)}</span>
                                </div>
                              </>}
                            </div>
                          )}
                        </td>
                      );
                    })}
                    <td className="dl-total-cell">
                      <div className="dl-total-hrs">{weekHrs}h</div>
                      <div className="dl-total-fcst">{fmt$(weekFcst)}</div>
                      {actTotal>0&&<div className="dl-total-act" style={{color:actTotal>weekFcst?'#F87171':'#4ADE80'}}>{fmt$(actTotal)}</div>}
                    </td>
                    <td style={{padding:'6px 10px',textAlign:'right',fontSize:12,fontWeight:700,color:'#E8890C'}}>{fmt$(ld.forecast)}</td>
                    <td style={{padding:'6px 10px',textAlign:'right',fontSize:12,fontWeight:700,color:actTotal>0?'#E8EAF0':'#4A4D60'}}>{actTotal>0?fmt$(actTotal):'—'}</td>
                    <td style={{padding:'6px 10px',textAlign:'right',fontSize:13,fontWeight:800}}
                      className={remaining>=0?'pos':'neg'}>{remaining!==0?(remaining>=0?'+':'')+fmt$(Math.abs(remaining)):'—'}</td>
                  </tr>
                );
              })}
              {/* Totals row */}
              <tr style={{borderTop:'2px solid #2A2D3A',background:'#13151C'}}>
                <td className="dl-dept-cell" style={{fontWeight:800,fontSize:12,color:'#fff'}}>TOTAL</td>
                {dayTotals.map((dt,di)=>(
                  <td key={di} style={{padding:'8px 8px',textAlign:'center',borderRight:'1px solid #22253240'}}>
                    <div style={{fontSize:12,fontWeight:800,color:'#E8EAF0'}}>{dt.hrs>0?(view==='$'?fmt$(dt.fcst):fmtHrs(dt.hrs)):'—'}</div>
                    {dt.act>0&&<div style={{fontSize:10,color:'#4ADE80',marginTop:2}}>{view==='$'?fmt$(dt.act):fmtHrs(dt.act)}</div>}
                  </td>
                ))}
                <td className="dl-total-cell" style={{fontSize:14,fontWeight:900,color:'#E8EAF0'}}>{weekTotals.hrs}h<div style={{fontSize:10,color:'#E8890C'}}>{fmt$(weekTotals.fcst)}</div></td>
                <td style={{padding:'8px 10px',textAlign:'right',fontSize:13,fontWeight:800,color:'#E8890C'}}>{fmt$(weekTotals.fcst)}</td>
                <td style={{padding:'8px 10px',textAlign:'right',fontSize:13,fontWeight:800,color:weekTotals.act>0?'#E8EAF0':'#4A4D60'}}>{weekTotals.act>0?fmt$(weekTotals.act):'—'}</td>
                <td style={{padding:'8px 10px',textAlign:'right',fontSize:14,fontWeight:900}} className={weekTotals.act>0?(weekTotals.fcst-weekTotals.act>=0?'pos':'neg'):''}>{weekTotals.act>0?fmt$(weekTotals.fcst-weekTotals.act):'—'}</td>
              </tr>
            </tbody>
          </table>
        </div>

        {/* Declining Balance Cards */}
        <div className="dl-balance-section">
          <div className="dl-balance-title">Declining Balance — {window.ACTIVE_MONTH_LABEL||'March 2026'}</div>
          <div className="dl-balance-grid">
            {laborData.map(ld=>{
              const dept=getDept(ld.dept);
              const actTotal=actuals?.[ld.dept]?.total||0;
              const base=Math.max(ld.budget||ld.forecast,ld.forecast,actTotal,1);
              const remaining=(ld.budget||ld.forecast)-actTotal;
              return (
                <div className="dl-balance-card" key={ld.dept}>
                  <div className="dl-bc-header">
                    <div className="dl-bc-dot" style={{background:dept.color}}/>
                    <span className="dl-bc-name" style={{color:dept.color}}>{dept.label}</span>
                    <span className="dl-bc-budget" style={{fontSize:11}}>{ld.budget>0?`Budget: ${fmt$(ld.budget)}`:'Forecast Only'}</span>
                  </div>
                  <div className="dl-bc-bars">
                    {ld.budget>0&&<div className="dl-bc-bar-row">
                      <span className="dl-bc-label">Budget</span>
                      <div className="dl-bc-track"><div className="dl-bc-fill" style={{width:'100%',background:'#4A4D60'}}/></div>
                      <span className="dl-bc-value" style={{color:'#6B6F85'}}>{fmt$(ld.budget)}</span>
                    </div>}
                    <div className="dl-bc-bar-row">
                      <span className="dl-bc-label">Forecast</span>
                      <div className="dl-bc-track"><div className="dl-bc-fill" style={{width:`${Math.min(100,ld.forecast/base*100)}%`,background:dept.color+'88'}}/></div>
                      <span className="dl-bc-value" style={{color:dept.color}}>{fmt$(ld.forecast)}</span>
                    </div>
                    <div className="dl-bc-bar-row">
                      <span className="dl-bc-label">Actual</span>
                      <div className="dl-bc-track"><div className="dl-bc-fill" style={{width:`${Math.min(100,actTotal/base*100)}%`,background:dept.color}}/></div>
                      <span className="dl-bc-value" style={{color:'#E8EAF0'}}>{actTotal>0?fmt$(actTotal):'—'}</span>
                    </div>
                  </div>
                  <div className="dl-bc-remaining">
                    <span className="dl-bc-rem-label">Remaining</span>
                    <span className={`dl-bc-rem-val ${remaining>=0?'pos':'neg'}`}>{remaining>=0?'+':''}{fmt$(Math.abs(remaining))}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ImportView ───────────────────────────────────────────────────────────────
function ImportView({ onApply, actuals, activeWeek }) {
  const { dates: WEEK_DATES, events: WEEK_EVENTS_CTX } = useWeek();
  const WEEK_EVENTS = WEEK_EVENTS_CTX;
  const [text, setText]       = useState('');
  const [parsed, setParsed]   = useState(null);
  const [msg, setMsg]         = useState(null); // {type:'ok'|'err', text}
  const fileRef = useRef();

  const parseData = (raw) => {
    // Auto-detect delimiter: tab, comma, or pipe
    const firstLine = raw.split('\n').find(l=>l.trim()) || '';
    const tabs = (firstLine.match(/\t/g)||[]).length;
    const commas = (firstLine.match(/,/g)||[]).length;
    const delim = tabs > 5 ? '\t' : (commas > 5 ? ',' : '\t');
    // CSV-aware splitter that respects quotes
    const splitRow = (line) => {
      if (delim === '\t') return line.split('\t').map(s=>s.trim());
      const out=[]; let cur=''; let q=false;
      for (let i=0;i<line.length;i++){
        const c=line[i];
        if (c==='"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
        else if (c===delim && !q){ out.push(cur.trim()); cur=''; }
        else cur+=c;
      }
      out.push(cur.trim());
      return out;
    };
    const allRows = raw.split('\n').map(splitRow).filter(r => r.length>3 && r.some(c=>c));
    // Find header row — look for "Per No", "Work Cost Center", or "Work Date"
    let headerRowIdx = allRows.findIndex(r => r.some(c => /per no|work cost center|cost center|work date|work desc|hours/i.test(c)));
    const headerRow = headerRowIdx>=0 ? allRows[headerRowIdx] : null;
    const dataRows = headerRowIdx>=0 ? allRows.slice(headerRowIdx+1) : allRows;

    // Map columns by header name (case-insensitive, fuzzy)
    const findCol = (...patterns) => {
      if (!headerRow) return -1;
      for (const p of patterns) {
        const rx = new RegExp(p, 'i');
        const idx = headerRow.findIndex(h => rx.test(h||''));
        if (idx>=0) return idx;
      }
      return -1;
    };
    const colName = findCol('^name$', 'emp full name', 'employee', '\\bname\\b');
    const colCC   = findCol('work cost center', 'cost center', '^cc$');
    const colWD   = findCol('^work desc$', 'work cc desc', 'description');
    const colWJD  = findCol('work job desc'); // separate from "Work Desc" — actual job title
    const colTC   = findCol('time code', '^tc$'); // Q in standard layout
    const colHrs  = findCol('work hours', '^hours$', 'hrs');
    // PREFER "Ext Amount" (column U — extended total including premiums) over base "Amount"
    const colAmt  = findCol('ext\\s*amount', 'extended\\s*amount', 'ext\\s*amt', 'amount', 'dollars', '\\$', 'pay');
    const colDate = findCol('work date', '^date$');

    // Time codes to ignore — tips & service charges aren't worked labor.
    const IGNORE_TC_RX = /^\s*(tips|service[- ]?charge|srvc)/i;

    const records=[]; let skipped=0, outOfMonth=0, noCol=0;
    const AM = window.ACTIVE_MONTH || {year:2026, month:3};
    const monthStart = new Date(AM.year, AM.month-1, 1);
    const monthEnd   = new Date(AM.year, AM.month, 0);
    const MONTH_START_SERIAL = window.dateToSerial(monthStart);
    const MONTH_END_SERIAL   = window.dateToSerial(monthEnd);

    // Parse date cell: accept Excel serial OR MM/DD/YYYY OR YYYY-MM-DD
    const parseDateCell = (v) => {
      if (!v) return null;
      const s = String(v).trim();
      // Excel serial (numeric, > 40000)
      if (/^\d+(\.\d+)?$/.test(s) && parseFloat(s) > 40000) return Math.round(parseFloat(s));
      // MM/DD/YYYY or M/D/YY
      const mdy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (mdy) {
        let [,m,d,y] = mdy; m=+m; d=+d; y=+y; if (y<100) y+=2000;
        return window.dateToSerial(new Date(y, m-1, d));
      }
      // YYYY-MM-DD
      const ymd = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (ymd) { const [,y,m,d] = ymd; return window.dateToSerial(new Date(+y, +m-1, +d)); }
      return null;
    };

    const ccSummary = {}; // raw CC -> {count, dept, amount, hours}
    let ignoredTC = 0;
    const ignoredTCSeen = new Set();
    dataRows.forEach(cols=>{
      if(cols.length < 5) { skipped++; return; }
      // Header-mapped OR fallback to legacy positions
      const name = (colName>=0 ? cols[colName] : cols[1]) || '';
      const cc   = (colCC>=0   ? cols[colCC]   : cols[11]) || '';
      const wd   = (colWD>=0   ? cols[colWD]   : cols[12]) || '';
      const wjd  = (colWJD>=0  ? cols[colWJD]  : cols[14]) || '';
      const tc   = (colTC>=0   ? cols[colTC]   : cols[16]) || ''; // Time Code (col Q in standard report)
      const hrs  = parseFloat((colHrs>=0 ? cols[colHrs] : cols[18]) || 0) || 0;
      const amt  = parseFloat((colAmt>=0 ? cols[colAmt] : cols[19]) || 0) || 0;
      const dateRaw = (colDate>=0 ? cols[colDate] : cols[20]) || '';
      // Skip Time Codes for tips / service charges — they aren't worked labor.
      if (tc && IGNORE_TC_RX.test(tc)) { ignoredTC++; ignoredTCSeen.add(tc.trim()); return; }
      const serialInt = parseDateCell(dateRaw);
      if (!cc.trim() || serialInt === null) { noCol++; return; }
      const dept=mapCostCenter(cc.trim(), wd);
      const ccKey = cc.trim().toUpperCase();
      if (!ccSummary[ccKey]) ccSummary[ccKey] = {count:0, dept:dept||'UNMAPPED', amount:0, hours:0};
      ccSummary[ccKey].count++;
      ccSummary[ccKey].amount += amt;
      ccSummary[ccKey].hours += hrs;
      if(!dept) { skipped++; return; }
      if (serialInt < MONTH_START_SERIAL || serialInt > MONTH_END_SERIAL) { outOfMonth++; return; }
      const monthDay = serialInt - MONTH_START_SERIAL + 1;
      let wkId=null, dayIdx=null;
      for (const wk of (window.WEEKS||[])) {
        const i = wk.dayIdx.indexOf(monthDay);
        if (i>=0) { wkId=wk.id; dayIdx=i; break; }
      }
      records.push({
        name: name.trim(), dept, hours:hrs, amount:amt, cc: cc.trim(),
        wd: wd.trim(), wjd: wjd.trim(),
        monthDay, wkId, dayIdx,
        date: `${AM.month}/${monthDay}`,
      });
    });
    if(!records.length) {
      const parts = [
        `Skipped ${skipped + noCol} rows`,
        outOfMonth?`${outOfMonth} outside ${window.ACTIVE_MONTH_LABEL||'current month'}`:null,
        headerRow? `detected ${delim==='\t'?'tab':'comma'}-separated with header at row ${headerRowIdx+1}` : `no header row found — ${delim==='\t'?'tab':'comma'}-separated, ${allRows.length} rows`,
      ].filter(Boolean);
      setMsg({type:'err',text:`No matching records found. ${parts.join('. ')}. ${outOfMonth>0?`Switch to the correct month before importing.`:'Check that your paste includes the column headers (Name, Work Cost Center, Work Desc, Hours, Amount, Work Date).'}`});
      return;
    }
    // Group by week → dept → dayIdx (for per-week dashboard summaries)
    const byWeek = {};
    records.forEach(r=>{
      if (!r.wkId) return;
      if(!byWeek[r.wkId]) byWeek[r.wkId] = {};
      const g = byWeek[r.wkId];
      if(!g[r.dept]) g[r.dept]={};
      if(!g[r.dept][r.dayIdx]) g[r.dept][r.dayIdx]={hours:0,amount:0,count:0};
      g[r.dept][r.dayIdx].hours += r.hours;
      g[r.dept][r.dayIdx].amount += r.amount;
      g[r.dept][r.dayIdx].count++;
    });
    Object.values(byWeek).forEach(g=>{
      Object.keys(g).forEach(d=>{
        g[d].total = Object.values(g[d]).reduce((s,v)=>s+(v.amount||0),0);
        g[d].totalHrs = Object.values(g[d]).filter(v=>typeof v==='object').reduce((s,v)=>s+(v.hours||0),0);
      });
    });
    // Also keep the old "grouped" for the active week — that's what feeds the Daily Labor dashboard preview below
    const grouped = byWeek[activeWeek] || Object.values(byWeek)[0] || {};
    const weekCount = Object.keys(byWeek).length;
    const dayRange = records.reduce((r,rec)=>({min:Math.min(r.min,rec.monthDay),max:Math.max(r.max,rec.monthDay)}),{min:32,max:0});
    // Auto-extract supervisor labor from records — Work Job Desc matching real supervisor titles.
    // NOTE: "Lead" / "Captain" are working roles, NOT supervisors — excluded by design.
    // (so One & Done uploads automatically populate the Stats › Supervisor Labor table.)
    const SUPV_RX = /\b(supv|supervisor|manager|director|sous|exec\s*chef|head\s*chef|chef\s*de\s*cuisine)\b/i;
    const supByPerson = {}; // key: name|dept → {name, dept, wd, hrs, amt}
    const supByDept = {};   // dept → {hrs, amt}
    let supDebugTitles = new Set();
    records.forEach(r => {
      const title = (r.wjd||r.wd||'');
      if (title) supDebugTitles.add(title);
      if (!SUPV_RX.test(title)) return;
      const k = r.name + '|' + r.dept;
      if (!supByPerson[k]) supByPerson[k] = { name:r.name, dept:r.dept, wd:title, hrs:0, amt:0 };
      supByPerson[k].hrs += r.hours;
      supByPerson[k].amt += r.amount;
      if (!supByDept[r.dept]) supByDept[r.dept] = { hrs:0, amt:0 };
      supByDept[r.dept].hrs += r.hours;
      supByDept[r.dept].amt += r.amount;
    });
    const supervisors = Object.keys(supByPerson).length
      ? { byPerson: supByPerson, byDept: supByDept, source:'one-and-done' }
      : null;
    console.log('[One&Done] Unique job titles seen:', [...supDebugTitles].sort());
    console.log('[One&Done] Supervisors auto-extracted:', supervisors ? Object.keys(supByPerson).length : 0, 'from titles matching SUPV/MANAGER/DIRECTOR/SOUS/EXEC CHEF/HEAD CHEF');
    if (ignoredTC>0) console.log('[One&Done] Ignored', ignoredTC, 'tips/service-charge rows · time codes:', [...ignoredTCSeen].sort());
    setParsed({grouped, byWeek, records, skipped, outOfMonth, total:records.length, weekCount, dayRange, ccSummary, ignoredTC, ignoredTCSeen:[...ignoredTCSeen], __supervisorsAuto: supervisors});
    setMsg({type:'ok',text:`Parsed ${records.length} records · ${dayRange.min>dayRange.max?'no dates':'3/'+dayRange.min+'–3/'+dayRange.max} · ${weekCount} week${weekCount>1?'s':''} · ${Object.keys(grouped).length} depts${ignoredTC?` · skipped ${ignoredTC} tips/service-charge row${ignoredTC>1?'s':''}`:''}${supervisors?` · ${Object.keys(supByPerson).length} supervisors auto-detected`:''}. Click Apply.`});
  };

  const handleFile = e => {
    const f=e.target.files?.[0]; if(!f) return;
    const name = f.name.toLowerCase();
    // XLSX / XLS: use SheetJS; convert to TSV so parseData can consume it
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
      if (!window.XLSX) { setMsg({type:'err',text:'XLSX support not loaded. Please try again in a moment.'}); return; }
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const wb = XLSX.read(ev.target.result, { type:'array' });
          // Pick the first non-empty sheet
          let sheetRows = [];
          for (const sn of wb.SheetNames) {
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'', raw:false });
            if (rows.length > sheetRows.length) sheetRows = rows;
          }
          // Detect file type: LACTR? Supervisor Labor? One & Done?
          const joined = sheetRows.slice(0,12).map(r=>r.join('|')).join('\n').toLowerCase();
          if (joined.includes('lactr - erl') || joined.includes('event -  name')) {
            // LACTR-ERL budget file — parse straight into budget events, skip normal actuals flow
            const lactr = window.parseLACTR(sheetRows);
            window.__pendingLACTR = lactr;
            setMsg({type:'ok',text:`Parsed LACTR-ERL budget file — ${lactr.events.length} event-days detected. Click "Apply LACTR to Budget" below to auto-fill the Budget tab.`});
            setParsed({ __lactr: lactr, grouped:{}, byWeek:{}, records:[], total:0, skipped:0, outOfMonth:0, weekCount:0, dayRange:{min:32,max:0}, ccSummary:{} });
            return;
          }
          if (joined.match(/supv|supervisor labor/) && joined.includes('work job desc')) {
            // Supervisor Labor file — parse into per-dept monthly totals
            let h = sheetRows.findIndex(r => (r||[]).some(x => /per no|emp full name/i.test(x||'')));
            if (h<0) h = 0;
            const sup = window.parseSupervisors(sheetRows, h);
            window.__supervisorsData = sup;
            const deptCount = Object.keys(sup.byDept).length;
            const peopleCount = Object.keys(sup.byPerson).length;
            const totalHrs = Object.values(sup.byDept).reduce((s,v)=>s+v.hrs,0);
            const totalAmt = Object.values(sup.byDept).reduce((s,v)=>s+v.amt,0);
            setMsg({type:'ok',text:`Parsed Supervisor Labor — ${peopleCount} supervisors · ${deptCount} depts · ${totalHrs.toFixed(1)}h · ${fmt$(totalAmt)} for the month. Totals now available in Stats.`});
            setParsed({ __supervisors: sup, grouped:{}, byWeek:{}, records:[], total:0, skipped:0, outOfMonth:0, weekCount:0, dayRange:{min:32,max:0}, ccSummary:{} });
            return;
          }
          // Default: treat as One & Done — convert to TSV string and run normal parser
          const tsv = sheetRows.map(r => r.map(c => String(c==null?'':c).replace(/\t/g,' ')).join('\t')).join('\n');
          setText(tsv); parseData(tsv);
        } catch (err) {
          console.error(err);
          setMsg({type:'err',text:'Could not parse XLSX: '+err.message});
        }
      };
      reader.readAsArrayBuffer(f);
      return;
    }
    // Text fallback
    const reader=new FileReader();
    reader.onload = ev => { setText(ev.target.result); parseData(ev.target.result); };
    reader.readAsText(f);
  };

  const apply = () => {
    if(!parsed) return;
    // LACTR-ERL → write into window.__pendingLACTR; Budget tab watches for it
    if (parsed.__lactr) {
      onApply && onApply({}, [], { lactr: parsed.__lactr });
      setMsg({type:'ok',text:`✓ Applied LACTR-ERL to Budget tab — ${parsed.__lactr.events.length} event days.`});
      setParsed(null); setText('');
      return;
    }
    if (parsed.__supervisors) {
      onApply && onApply({}, [], { supervisors: parsed.__supervisors });
      setMsg({type:'ok',text:`✓ Applied Supervisor Labor — ${Object.keys(parsed.__supervisors.byPerson).length} supervisors.`});
      setParsed(null); setText('');
      return;
    }
    onApply(parsed.grouped, parsed.records, parsed.__supervisorsAuto ? { supervisors: parsed.__supervisorsAuto } : undefined);
    const extra = parsed.__supervisorsAuto ? ` · ${Object.keys(parsed.__supervisorsAuto.byPerson).length} supervisors → Stats` : '';
    setMsg({type:'ok',text:`✓ Applied ${parsed.total} records to Daily Labor dashboard${extra}.`});
    setParsed(null); setText('');
  };

  // Summary table from parsed data
  const summaryRows = useMemo(()=>{
    if(!parsed) return [];
    return DEPTS.map(dept=>{
      const d=parsed.grouped[dept.id];
      if(!d) return null;
      const days=Array(7).fill(0).map((_,i)=>d[i]?.amount||0);
      return {dept,days,total:d.total||0,totalHrs:d.totalHrs||0};
    }).filter(Boolean);
  },[parsed]);

  return (
    <div className="import-view">
      <div className="import-layout">
        {/* Instructions */}
        <div>
          <div className="import-card">
            <div className="import-card-title">Import One &amp; Done Report</div>
            <div className="import-card-sub">Actual labor data from payroll that feeds into the declining balance. Column L (Work Cost Center) maps each record to a department.</div>
            <div className="import-steps">
              <div className="import-step"><div className="step-num">1</div><div className="step-text">Open the <strong>One &amp; Done Report</strong> in Excel</div></div>
              <div className="import-step"><div className="step-num">2</div><div className="step-text">Select <strong>all data rows</strong> (including header row 10) → Copy</div></div>
              <div className="import-step"><div className="step-num">3</div><div className="step-text">Paste into the field on the right, or upload the <strong>.xlsx or .csv</strong> file directly</div></div>
              <div className="import-step"><div className="step-num">4</div><div className="step-text">Click <strong>Parse &amp; Preview</strong>, review the summary, then click <strong>Apply</strong></div></div>
            </div>
            <div style={{marginTop:12,padding:'10px 12px',background:'#0F172A',border:'1px solid #2563EB44',borderRadius:6,fontSize:11,lineHeight:1.5,color:'#93C5FD'}}>
              <strong style={{color:'#60A5FA',display:'block',marginBottom:4}}>This uploader also accepts:</strong>
              <div>• <strong>Supervisor Labor</strong> (.xlsx) — auto-routed by cost center into the Stats &rsaquo; Supervisor Labor table.</div>
              <div>• <strong>LACTR-ERL</strong> (.xlsx) — per-event daily Food / Non-Alc / Alcohol. Auto-fills Budget tab events + sales.</div>
            </div>
            <div className="import-card-title" style={{marginBottom:8}}>Cost Center → Department</div>
            <div className="cc-map">
              {[['33416','Group Sales'],['33416-BOH','Kitchen Prem'],['33417','R&C FOH (merged)'],['33417-BOH','R&C Kitchen'],['33418','R&C FOH'],['33421','Bars'],['33422','Admin'],['33422-BOH','Stewarding'],['55936','Warehouse']].map(([cc,dept])=>(
                <div key={cc}><span>{cc}</span>→ {dept}</div>
              ))}
            </div>
          </div>
          {actuals && Object.keys(actuals).length>0 && (
            <div className="import-card" style={{marginTop:12}}>
              <div className="import-card-title">Currently Imported</div>
              {DEPTS.map(d=>{
                const total=actuals[d.id]?.total||0;
                if(!total) return null;
                return <div key={d.id} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid #2A2D3A',fontSize:12}}>
                  <span style={{color:d.color}}>{d.label}</span>
                  <span style={{fontWeight:700}}>{fmt$(total)}</span>
                </div>;
              })}
            </div>
          )}
        </div>

        {/* Paste/upload area */}
        <div>
          <div className="import-card">
            <div className="import-card-title">Paste Data</div>
            <textarea className="import-textarea" value={text} onChange={e=>{setText(e.target.value);setMsg(null);setParsed(null);}} placeholder="Copy all rows from the One &amp; Done Report in Excel and paste here (Ctrl+V / Cmd+V)&#10;&#10;Expected columns: Per No | Emp Full Name | ... | Work Cost Center (L) | Work Desc (M) | ... | Work Hours (S) | Ext Amount (T) | Work Date (U)"/>
            <div className="import-actions">
              <button className="import-btn" onClick={()=>parseData(text)} disabled={!text.trim()}>Parse &amp; Preview</button>
              <button className="import-btn-sec" onClick={()=>fileRef.current.click()}>Upload File (.xlsx / .csv / .txt)</button>
              <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv,.txt,.tsv" style={{display:'none'}} onChange={handleFile}/>
              {text&&<button className="import-btn-sec" onClick={()=>{setText('');setParsed(null);setMsg(null);}}>Clear</button>}
            </div>
            {msg&&<div className={`import-success${msg.type==='err'?' import-error':''}`}>{msg.text}</div>}
          </div>

          {/* Multi-week summary */}
          {parsed && parsed.byWeek && Object.keys(parsed.byWeek).length > 0 && (
            <div className="import-card" style={{marginTop:12}}>
              <div className="import-preview-title">Summary by Week</div>
              <div style={{display:'flex',flexDirection:'column',gap:6,fontSize:12}}>
                {(window.WEEKS||[]).map(wk => {
                  const g = parsed.byWeek[wk.id]; if (!g) return null;
                  const hrs = Object.values(g).reduce((s,d)=>s+(d.totalHrs||0),0);
                  const amt = Object.values(g).reduce((s,d)=>s+(d.total||0),0);
                  const depts = Object.keys(g).length;
                  const isActive = wk.id === activeWeek;
                  return <div key={wk.id} style={{display:'flex',justifyContent:'space-between',padding:'6px 10px',background:isActive?'#E8890C15':'#1C1E26',border:'1px solid '+(isActive?'#E8890C66':'#2A2D3A'),borderRadius:6}}>
                    <span style={{fontWeight:700,color:isActive?'#E8890C':'#C8CAD6'}}>{wk.label}{isActive&&<span style={{fontSize:9,marginLeft:6,letterSpacing:'.05em'}}>← ACTIVE</span>}</span>
                    <span style={{color:'#8B8FA8'}}><strong style={{color:'#E8EAF0'}}>{hrs.toFixed(0)}h</strong> · <strong style={{color:'#E8890C'}}>{fmt$(amt)}</strong> · {depts} dept{depts!==1?'s':''}</span>
                  </div>;
                })}
              </div>
              <div style={{marginTop:10,padding:'8px 10px',background:'#0F172A',border:'1px solid #2563EB44',borderRadius:6,fontSize:11,color:'#93C5FD'}}>
                <strong>Applying will replace actuals for 3/{parsed.dayRange.min}–3/{parsed.dayRange.max}.</strong> Previously imported days outside this range are preserved.
              </div>
            </div>
          )}

          {/* Cost Center diagnostic */}
          {parsed && parsed.ccSummary && Object.keys(parsed.ccSummary).length > 0 && (
            <div className="import-card" style={{marginTop:12}}>
              <div className="import-preview-title">Cost Centers Detected — Routing Check</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:6,fontSize:11}}>
                {Object.entries(parsed.ccSummary).sort(([a],[b])=>a.localeCompare(b)).map(([cc,info])=>{
                  const deptObj = DEPTS.find(d=>d.id===info.dept);
                  const isUnmapped = info.dept==='UNMAPPED';
                  return <div key={cc} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 10px',background:isUnmapped?'#DC262622':'#1C1E26',border:'1px solid '+(isUnmapped?'#DC262666':'#2A2D3A'),borderRadius:6}}>
                    <span style={{fontFamily:'monospace',color:'#C8CAD6',fontWeight:700}}>{cc}</span>
                    <span style={{color:deptObj?deptObj.color:'#F87171',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'.04em'}}>→ {deptObj?deptObj.label:'UNMAPPED ⚠'}</span>
                    <span style={{color:'#6B6F85',fontSize:10}}>{info.count}r · ${info.amount.toFixed(0)}</span>
                  </div>;
                })}
              </div>
            </div>
          )}

          {/* Ignored Time Codes (tips / service charges) */}
          {parsed && parsed.ignoredTC > 0 && (
            <div className="import-card" style={{marginTop:12,borderColor:'#FBBF2466'}}>
              <div className="import-preview-title" style={{color:'#FBBF24'}}>Ignored Rows — Tips &amp; Service Charges</div>
              <div style={{fontSize:11,color:'#8B8FA8',marginBottom:8,lineHeight:1.5}}>
                Skipped <strong style={{color:'#FBBF24'}}>{parsed.ignoredTC}</strong> row{parsed.ignoredTC>1?'s':''} where the <strong>Time Code</strong> (column Q) starts with <code style={{background:'#0F172A',padding:'1px 4px',borderRadius:3,color:'#FBBF24'}}>TIPS</code>, <code style={{background:'#0F172A',padding:'1px 4px',borderRadius:3,color:'#FBBF24'}}>SERVICE-CHARGE</code>, or <code style={{background:'#0F172A',padding:'1px 4px',borderRadius:3,color:'#FBBF24'}}>SRVC</code>. These aren't worked labor, so they're excluded from actuals and variance.
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                {(parsed.ignoredTCSeen||[]).sort().map(tc=><span key={tc} style={{fontSize:10,fontWeight:700,background:'#FBBF2422',color:'#FBBF24',padding:'2px 7px',borderRadius:10,letterSpacing:'.04em'}}>{tc}</span>)}
              </div>
            </div>
          )}

          {/* LACTR-ERL preview */}
          {parsed && parsed.__lactr && (
            <div className="import-card" style={{marginTop:12}}>
              <div className="import-preview-title">LACTR-ERL — Event / Sales Preview</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:10}}>
                {(() => {

// ─── PeopleView ───────────────────────────────────────────────────────────────
function PeopleView({ employees, onUpdate, budgetCfg }) {
  const { dates: WEEK_DATES } = useWeek();
  const [filter, setFilter] = useState('');
  const [newName, setNewName] = useState('');
  const [newDept, setNewDept] = useState('kitchen_prem');
  const [newRole, setNewRole] = useState('');
  const plans = budgetCfg.hwPlans || { b:{name:'B Plan'}, v:{name:'V Plan'} };
  const defaultPlan = budgetCfg.defaultPlan || 'b';
  const filtered = employees.filter(e=>(e.name+' '+e.role).toLowerCase().includes(filter.toLowerCase()));
  const addEmp = () => {
    if(!newName.trim()) return;
    onUpdate([...employees,{id:Date.now(),name:newName.trim(),dept:newDept,role:newRole.trim()||'Staff',plan:defaultPlan,shifts:Array(7).fill(['',0,''])}]);
    setNewName(''); setNewRole('');
  };
  return (
    <div className="people-view">
      <div style={{display:'flex',gap:10,marginBottom:14,alignItems:'center'}}>
        <input className="add-inp" style={{maxWidth:260}} placeholder="🔍  Search…" value={filter} onChange={e=>setFilter(e.target.value)}/>
        <span style={{fontSize:11,color:'#6B6F85',marginLeft:'auto'}}>{filtered.length} / {employees.length} employees</span>
      </div>
      <table className="people-table">
        <thead><tr><th>Name</th><th>Department</th><th>Position</th><th style={{width:110}}>H&amp;W Plan</th><th>Sched Hrs</th><th>Wk Cost</th><th/></tr></thead>
        <tbody>
          {filtered.map(e=>{
            const d=getDept(e.dept); const hrs=e.shifts.reduce((s,sh)=>s+(sh[1]||0),0);
            // Display the highest tier (h8) as the headline rate, but compute weekly cost
            // per-shift so 4h/6h/8h tiers each apply their own rate.
            const rate=getEmpRate(e); const wkCost=getEmpWeeklyCost(e, WEEK_DATES);
            return (
              <tr key={e.id}>
                <td style={{fontWeight:600,color:'#C8CAD6'}}>{e.name}</td>
                <td><select className="dept-select" value={e.dept} onChange={ev=>onUpdate(employees.map(x=>x.id===e.id?{...x,dept:ev.target.value}:x))} style={{borderColor:d.color+'88',color:d.color}}>
                  {DEPTS.map(dep=><option key={dep.id} value={dep.id}>{dep.label}</option>)}
                </select></td>
                <td>
                  {(() => {
                    // Auto-resolve positionId from role text if not already set
                    let posId = e.positionId || '';
                    if (!posId && e.role) {
                      const roleFull = (e.role||'').toLowerCase().trim();
                      // Split compound roles on separators, remove meta tokens, try each
                      const tokens = [roleFull, ...roleFull.split(/\s*[\/,&+\|]\s*/)]
                        .map(t => t.trim())
                        .filter(t => t && !/^(com|gal|wh|da|n\/?a)$/i.test(t));
                      const normalize = s => s.replace(/\bleads?\b/g,'lead').replace(/\bsous\s*chef\b/g,'sous chef').replace(/\bhead\s+/g,'lead ').trim();
                      let match = null;
                      for (const raw of tokens) {
                        const roleL = normalize(raw);
                        // Tier 1: exact match in same dept
                        match = (window.POSITIONS||[]).find(p => p.dept === e.dept && (
                          p.label.toLowerCase() === roleL || p.id.toLowerCase() === roleL
                        ));
                        if (match) break;
                        // Tier 2: substring in same dept
                        match = (window.POSITIONS||[]).find(p => p.dept === e.dept && (
                          roleL.includes(p.label.toLowerCase()) || p.label.toLowerCase().includes(roleL)
                        ));
                        if (match) break;
                        // Tier 3: exact match in ANY dept (role naming drift) — only use if unique
                        const anyMatches = (window.POSITIONS||[]).filter(p =>
                          p.label.toLowerCase() === roleL || p.id.toLowerCase() === roleL
                        );
                        if (anyMatches.length === 1) { match = anyMatches[0]; break; }
                      }
                      if (match) posId = match.id;
                    }
                    return (
                      <select className="role-input" value={posId} onChange={ev=>{
                        const newPosId = ev.target.value;
                        const pos = (window.POSITIONS||[]).find(p=>p.id===newPosId);
                        onUpdate(employees.map(x=>x.id===e.id?{...x, positionId: newPosId||undefined, role: pos?pos.label:x.role}:x));
                      }} style={{width:'100%'}}>
                        <option value="">— custom ({e.role||'unset'}) —</option>
                        {(window.POSITIONS||[]).filter(p=>p.dept===e.dept).map(p=>{
                          const r = getPosRate(p.id, 'h8') ?? p.h8;
                          return <option key={p.id} value={p.id}>{p.label} (${r}/hr)</option>;
                        })}
                      </select>
                    );
                  })()}
                </td>
                <td>
                  <div style={{display:'inline-flex',background:'#1C1E26',border:'1px solid #2A2D3A',borderRadius:5,overflow:'hidden'}}>
                    {Object.keys(plans).map(pk=>{
                      const active = (e.plan||defaultPlan)===pk;
                      const isB = pk==='b';
                      return <button key={pk}
                        onClick={()=>onUpdate(employees.map(x=>x.id===e.id?{...x,plan:pk}:x))}
                        style={{background:active?(isB?'#2563EB33':'#D97757aa'):'transparent',color:active?(isB?'#93C5FD':'#fff'):'#6B6F85',border:'none',padding:'5px 11px',fontSize:10,fontWeight:800,cursor:'pointer',letterSpacing:'.05em',textTransform:'uppercase'}}>
                        {plans[pk].name.replace(/\s*plan\s*/i,'').trim() || pk.toUpperCase()}
                      </button>;
                    })}
                  </div>
                </td>
                <td style={{fontWeight:700,color:hrs>=40?'#16A34A':hrs>=32?'#E8890C':'#6B6F85'}}>{hrs>0?fmtHrs(hrs):'—'}</td>
                <td style={{fontWeight:700,color:'#8B8FA8'}}>{wkCost>0?fmt$(wkCost):'—'}</td>
                <td style={{whiteSpace:'nowrap'}}>
                  <button
                    onClick={()=>{
                      // Duplicate this person — same name/role, new id, blank shifts. User picks new dept after.
                      const otherDepts = DEPTS.filter(d=>d.id!==e.dept);
                      const choices = otherDepts.map((d,i)=>`${i+1}. ${d.label}`).join('\n');
                      const ans = prompt(`Duplicate "${e.name}" into another department.\n\nPick a number:\n\n${choices}`);
                      const pickIdx = parseInt(ans,10)-1;
                      if (isNaN(pickIdx) || pickIdx<0 || pickIdx>=otherDepts.length) return;
                      const newDeptId = otherDepts[pickIdx].id;
                      const dup = { ...e, id: Date.now(), dept: newDeptId, shifts: Array(7).fill(['',0,'']) };
                      onUpdate([...employees, dup]);
                    }}
                    title="Duplicate to another department"
                    style={{background:'transparent',border:'none',color:'#4A4D60',cursor:'pointer',padding:'4px 6px',borderRadius:4,fontSize:13,marginRight:2}}
                    onMouseEnter={x=>x.target.style.color='#06B6D4'} onMouseLeave={x=>x.target.style.color='#4A4D60'}
                  >⎘</button>
                  <button onClick={()=>onUpdate(employees.filter(x=>x.id!==e.id))} style={{background:'transparent',border:'none',color:'#4A4D60',cursor:'pointer',padding:'4px 8px',borderRadius:4,fontSize:13}} onMouseEnter={x=>x.target.style.color='#DC2626'} onMouseLeave={x=>x.target.style.color='#4A4D60'}>✕</button>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div className="add-emp-row">
        <input className="add-inp" placeholder="Last, First" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addEmp()} style={{maxWidth:200}}/>
        <select className="dept-select" value={newDept} onChange={e=>setNewDept(e.target.value)} style={{fontSize:12,padding:'7px 8px'}}>
          {DEPTS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
        </select>
        <input className="add-inp" placeholder="Role / Title" value={newRole} onChange={e=>setNewRole(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addEmp()} style={{maxWidth:150}}/>
        <button className="add-btn" onClick={addEmp}>+ Add</button>
      </div>
    </div>
  );
}

    return `<div style="font-weight:700;font-size:9pt">${st}</div>${tm ? `<div style="font-size:8pt;color:#555">${tm}</div>` : ''}${hrs > 0 ? `<div style="font-size:8pt;color:#777">${hrs}h</div>` : ''}`;
